r { font-size: 9px !important; margin: 0 !important; display: inline !important; }\n  .mobile-chapters {\n    margin-top: 4px !important;\n    padding: 10px 12px !important;\n    font-size: 14px !important;\n    font-weight: 700;\n    border-radius: 11px !important;\n  }\n  .topbar { display: none; }\n  .main { padding: 12px 14px 32px !important; }\n  .hero { margin: 8px 0 18px !important; padding: 22px 18px !important; border-radius: 18px !important; }\n  .hero h1 { font-size: 28px !important; line-height: 1.15 !important; }\n  .hero .lead { font-size: 15px !important; line-height: 1.6 !important; }\n  .journey-strip { overflow-x: auto; padding-bottom: 4px; gap: 6px !important; }\n  .journey-step { font-size: 11px !important; }\n  .lesson-section { margin-top: 22px !important; }\n  .section-heading h2 { font-size: 19px !important; }\n  .card { padding: 16px !important; border-radius: 15px !important; }\n  .info-list { grid-template-columns: 1fr !important; padding: 6px 16px !important; }\n  .animation-grid, .lab-grid { grid-template-columns: 1fr !important; }\n  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px !important; }\n  .change-grid { grid-template-columns: 1fr !important; }\n  .controls { display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px !important; }\n  .controls .btn, .controls .speed-select { width: 100%; min-height: 44px; }\n  .footer-nav {\n    display: grid !important;\n    grid-template-columns: 1fr 1fr;\n    gap: 10px !important;\n    margin-top: 24px !important;\n  }\n  .footer-nav .btn { width: 100%; min-height: 46px; font-size: 14px !important; }\n  .footer-note { display: none !important; }\n  .mobile-bottom-switches {\n    display: flex !important;\n    align-items: center;\n    gap: 10px;\n    margin-top: 18px;\n    padding: 12px;\n    background: var(--surface);\n    border: 1px solid var(--line);\n    border-radius: 14px;\n  }\n  .mobile-bottom-switches .mini-switch { min-height: 42px; font- e-item strong { font-size: 9px !important; }\n  .instructor-foot { display: none !important; }\n  .figure-wrap { min-height: 190px !important; }\n  .lab-chart { min-height: 190px !important; }\n  .lab-chart svg { height: 200px !important; }\n}\n\n\n/* Mobile Fullscreen Dark Mode & Always-On Sound Refinement (<= 650px) */\nhtml.dark-mode, body.dark-mode { background: #101827 !important; color: #edf3ff !important; }\nbody.dark-mode .mobile-chapters {\n  background: #1b2940 !important;\n  color: #edf3ff !important;\n  border-color: #3a4d6a !important;\n}\nbody.dark-mode .mobile-bottom-switches {\n  background: #172237 !important;\n  border-color: #33445f !important;\n}\n@media (max-width: 650px) {\n  #mobileSoundToggle { display: none !important; }\n  .mobile-bottom-switches {\n    padding: 10px 12px !important;\n    margin-bottom: env(safe-area-inset-bottom) !important;\n  }\n  #mobileThemeToggle {\n    width: 100%;\n    min-height: 44px;\n    font-size: 13px;\n    font-weight: 800;\n  }\n}\n\n\n.mobile-top-theme { display: none; }\n@media (max-width: 650px) {\n  .brand-top-row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    width: 100%;\n  }\n  .mobile-top-theme {\n    display: inline-flex !important;\n    flex: 0 0 auto !important;\n    width: auto !important;\n    min-height: 28px !important;\n    padding: 4px 10px !important;\n    border-radius: 999px !important;\n    font-size: 11px !important;\n    font-weight: 800 !important;\n  }\n}\n\n</style>\n</head>\n<body>\n<div class=\"app-shell\" id=\"candlesApp\">\n  <aside class=\"sidebar\">\n\n    <div class=\"brand\">\n      <div class=\"brand-top-row\">\n        <div><span class=\"brand-name\">CANDLES</span><span class=\"brand-sub\">A BEGINNER'S GUIDE</span><span class=\"brand-publisher\">\u2014 BY TRADING BOOKS</span></div>\n        <button class=\"mini-switch mobile-top-theme\" id=\"mobileThemeToggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle dark mode\">\u25d0 Dark</button>\n      </div>\n    </div>\n    <div class=\"nav-label\">THE LEARNING BOOK</div>\n    <nav class=\"chapter-nav\" id=\"chapterNav\" aria-label=\"Chapters\"></nav>\n    <select class=\"mobile-chapters\" id=\"mobileChapter\" aria-label=\"Choose a chapter\"></select>\n    <div class=\"progress-card\">\n      <div class=\"progress-meta\"><span>Learning progress</span><span id=\"progressLabel\">0 / 3</span></div>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"></div></div>\n      <div class=\"progress-hint\">Answer the three questions to finish a chapter.</div>\n      <div class=\"bottom-switches\">\n        <button class=\"mini-switch\" id=\"globalSound\" type=\"button\" aria-pressed=\"true\" aria-label=\"Toggle sound\">\ud83d\udd0a Sound</button>\n        <button class=\"mini-switch\" id=\"themeToggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle dark mode\">\u25d0 Dark</button>\n      </div>\n    </div>\n  </aside>\n\n  <main class=\"main\">\n    <div class=\"content\">\n      <header class=\"topbar\">\n        <span class=\"eyebrow\">INTERACTIVE EDUCATION \u00b7 BEGINNER LEVEL</span>\n        <span class=\"topbar-right\" id=\"chapterCounter\">CHAPTER 01 / 04</span>\n      </header>\n      <div id=\"lessonContent\"></div>\n\n    </div>\n  </main>\n</div>\n\n<script>\n/* ==========================================================================\n   CANDLES CONTENT MODEL\n   Update individual lessons, explanations, animation stages or questions here.\n   The renderer below reads these objects; content is not mixed into layout code.\n   ========================================================================== */\nconst LESSONS = [\n  {\n    id: \"foundations\",\n    number: \"01\",\n    title: \"What Is a Candle?\",\n    navTitle: \"What Is a Candle?\",\n    navDescription: \"Learn the four prices\",\n    kicker: \"CHAPTER 01 \u00b7 START HERE\",\n    introduction: \"A candle shows what price did in one short period. You only need to learn four simple prices.\",\n    topic: \"A candlestick is a small picture of price movement. It shows where price started, where it ended, and the highest and lowest points it reached.\",\n    information: [\n      { title: \"What is a candle?\", text: \"One candle is one piece of a price chart. It has four prices: Open, High, Low and Close.\" },\n      { title: \"Why use candles?\", text: \"They make price movement easy to see. The body shows the start and end. The wicks show the highest and lowest points.\" },\n      { title: \"What is a timeframe?\", text: \"A timeframe tells you how long one candle lasts. On a 1-minute chart, one candle means one minute. On a daily chart, it means one day.\" },\n      { title: \"The four prices\", text: \"Open is the first price. High is the top price. Low is the bottom price. Close is the last price.\" }\n    ],\n    animation: null,\n    quiz: [\n      { question: \"What four values does a candlestick record?\", options: [\"Open, High, Low and Close\", \"Buy, Sell, Profit and Loss\", \"Start, Average, Volume and End\"], answer: 0, explanation: \"Every standard candlestick records OHLC: Open, High, Low and Close.\" },\n      { question: \"What does the timeframe of a candle tell you?\", options: [\"How profitable it is\", \"How long the candle represents\", \"How many traders bought\"], answer: 1, explanation: \"A timeframe defines the duration represented by each candle.\" },\n      { question: \"Which part shows the difference between Open and Close?\", options: [\"The wick\", \"The body\", \"The chart grid\"], answer: 1, explanation: \"The candle body connects the opening and closing prices.\" }\n    ]\n  },\n  {\n    id: \"green\",\n    number: \"02\",\n    title: \"Green Candle\",\n    navTitle: \"Green Candle\",\n    navDescription: \"Price ends higher\",\n    kicker: \"CHAPTER 02 \u00b7 GREEN CANDLE\",\n    introduction: \"See how a green candle is made when price ends higher than where it started.\",\n    topic: \"A green candle means the Close is higher than the Open. The body goes from Open to Close. The wicks show the highest and lowest prices.\",\n    information: [\n      { title: \"What does green mean?\", text: \"The Close is above the Open. Price ended higher. It does not tell you what the next candle will do.\" },\n      { title: \"Open and Close\", text: \"On a green candle, Open is at the bottom of the body. Close is at the top.\" },\n      { title: \"Upper wick\", text: \"The upper wick goes from the top of the body to the High. It shows how high price went.\" },\n      { title: \"Lower wick\", text: \"The lower wick goes from the Low to the bottom of the body. It shows how low price went.\" }\n    ],\n    animation: {\n      open: 100, final: { open: 100, high: 130, low: 90, close: 120 },\n      stages: [\n        { title: \"The opening\", price: 100, high: 100, low: 100, explanation: \"A new candle begins when the market opens at this price.\", changed: \"The opening price is established at 100.\", unchanged: \"No high or low movement has occurred yet.\", focus: \"open\" },\n        { title: \"Price falls\", price: 90, high: 100, low: 90, explanation: \"Price moves below the opening price. The lowest point reached so far creates the lower wick.\", changed: \"The low moves down to 90. A lower wick begins to appear.\", unchanged: \"The open remains fixed at 100.\", focus: \"lower\" },\n        { title: \"Price rises\", price: 110, high: 110, low: 90, explanation: \"Price moves above the opening price. The candle body now begins forming in green.\", changed: \"The current price rises above 100, so the body becomes green.\", unchanged: \"The low remains at 90.\", focus: \"body\" },\n        { title: \"Body grows\", price: 120, high: 120, low: 90, explanation: \"As the current price rises, the green candle body becomes larger.\", changed: \"The close moves from 110 to 120, growing the body.\", unchanged: \"The low remains at 90. The high updates to 120.\", focus: \"body\" },\n        { title: \"A new high\", price: 130, high: 130, low: 90, explanation: \"Price reaches 130. This is the highest price reached so far.\", changed: \"The high reaches 130.\", unchanged: \"The open remains 100 and the low remains 90.\", focus: \"upper\" },\n        { title: \"Price retraces\", price: 120, high: 130, low: 90, explanation: \"Price has moved down from its highest point. The upper wick shows the distance between the high and the current closing price.\", changed: \"The current price falls to 120. The upper wick appears.\", unchanged: \"The high remains fixed at 130 and the low at 90.\", focus: \"upper\" },\n        { title: \"The candle closes\", price: 120, high: 130, low: 90, explanation: \"The candle closes above its opening price. Therefore, it is a green candle.\", changed: \"The final close is confirmed at 120.\", unchanged: \"Open 100, high 130 and low 90 are fixed.\", focus: \"body\" }\n      ]\n    },\n    quiz: [\n      { question: \"A green candle closes at 120 and opens at 100. Where is its open?\", options: [\"At the top of the body\", \"At the bottom of the body\", \"At the highest wick\"], answer: 1, explanation: \"For a green candle, the open is at the bottom and the close is at the top.\" },\n      { question: \"The high is 130 and the close is 120. What shows this difference?\", options: [\"Upper wick\", \"Lower wick\", \"Body\"], answer: 0, explanation: \"The upper wick extends from the body to the highest price.\" },\n      { question: \"In the animation, why did the lower wick stay at 90 after price rose?\", options: [\"The low is retained after being reached\", \"The candle resets every time price rises\", \"The opening price changed\"], answer: 0, explanation: \"The high and low record the extremes reached during the candle. They do not disappear when price reverses.\" }\n    ]\n  },\n  {\n    id: \"red\",\n    number: \"03\",\n    title: \"Red Candle\",\n    navTitle: \"Red Candle\",\n    navDescription: \"Price ends lower\",\n    kicker: \"CHAPTER 03 \u00b7 RED CANDLE\",\n    introduction: \"Now see the opposite: a red candle is made when price ends lower than where it started.\",\n    topic: \"A red candle means the Close is lower than the Open. On a red candle, Open is at the top of the body and Close is at the bottom.\",\n    information: [\n      { title: \"What does red mean?\", text: \"The Close is below the Open. Price ended lower. It does not tell you what the next candle will do.\" },\n      { title: \"Open and Close\", text: \"On a red candle, Open is at the top of the body. Close is at the bottom.\" },\n      { title: \"Upper wick\", text: \"The upper wick goes from the High to the top of the body.\" },\n      { title: \"Lower wick\", text: \"The lower wick goes from the bottom of the body to the Low.\" }\n    ],\n    animation: {\n      open: 120, final: { open: 120, high: 130, low: 90, close: 100 },\n      stages: [\n        { title: \"The opening\", price: 120, high: 120, low: 120, explanation: \"A new candle begins when the market opens at 120.\", changed: \"The opening price is established at 120.\", unchanged: \"The high and low are initially at the opening price.\", focus: \"open\" },\n        { title: \"Price rises\", price: 130, high: 130, low: 120, explanation: \"Price moves above the opening price. The high reaches 130, creating the upper extreme.\", changed: \"The high moves to 130.\", unchanged: \"The opening price remains at 120.\", focus: \"upper\" },\n        { title: \"Price falls\", price: 110, high: 130, low: 110, explanation: \"Price moves below the opening price. A red body begins forming between 120 and 110.\", changed: \"The close moves below the open, turning the body red.\", unchanged: \"The high remains at 130.\", focus: \"body\" },\n        { title: \"Body grows\", price: 100, high: 130, low: 100, explanation: \"As the price falls further, the red candle body grows downward.\", changed: \"The closing price falls to 100.\", unchanged: \"The high remains fixed at 130.\", focus: \"body\" },\n        { title: \"A new low\", price: 90, high: 130, low: 90, explanation: \"Price reaches 90. This becomes the lowest price reached during the period.\", changed: \"The low is now 90.\", unchanged: \"The open remains 120 and the high remains 130.\", focus: \"lower\" },\n        { title: \"Price retraces\", price: 100, high: 130, low: 90, explanation: \"Price recovers from 90 to 100. The lower wick remains visible below the closing price.\", changed: \"The current price returns to 100, creating a lower wick.\", unchanged: \"The high stays 130 and the low stays 90.\", focus: \"lower\" },\n        { title: \"The candle closes\", price: 100, high: 130, low: 90, explanation: \"The candle closes below its opening price. Therefore, it is a red candle.\", changed: \"The final close is confirmed at 100.\", unchanged: \"Open 120, high 130 and low 90 are fixed.\", focus: \"body\" }\n      ]\n    },\n    quiz: [\n      { question: \"A red candle opens at 120 and closes at 100. Where is its open?\", options: [\"At the bottom of the body\", \"At the top of the body\", \"At the lowest price\"], answer: 1, explanation: \"For a red candle, the open is at the top and the close is at the bottom.\" },\n      { question: \"The low is 90 and the close is 100. What shows this difference?\", options: [\"Upper wick\", \"Body\", \"Lower wick\"], answer: 2, explanation: \"The lower wick extends from the body down to the lowest price.\" },\n      { question: \"What makes the candle red?\", options: [\"Its high is lower than the open\", \"Its close is below its open\", \"Its low is below its open\"], answer: 1, explanation: \"Candle colour is determined by the relationship between closing and opening prices.\" }\n    ]\n  },\n  {\n    id: \"overview\",\n    number: \"04\",\n    title: \"Overview\",\n    navTitle: \"Overview\",\n    navDescription: \"Everything in one place\",\n    kicker: \"CHAPTER 04 \u00b7 THE BIG PICTURE\",\n    introduction: \"This short final chapter brings together everything you have learned about a candlestick.\"\n  }\n];\n\n/* ==========================================================================\n   APP STATE\n   Navigation, animation and assessment state live here, separate from content.\n   ========================================================================== */\nconst state = {\n  chapter: 0, stage: 0, playing: false, timer: null, speed: 1,\n  quizIndex: 0, answers: {}, completed: loadProgress(), audioContext: null, formationAnswers: {},\n  audio: { enabled: true, volume: 0.45, profile: \"balanced\" }\n};\nfunction loadProgress() {\n  try { const value = JSON.parse(localStorage.getItem(\"candles-progress\") || \"[]\"); return Array.isArray(value) ? value : []; }\n  catch { return []; }\n}\nfunction saveProgress() {\n  try { localStorage.setItem(\"candles-progress\", JSON.stringify(state.completed)); } catch {}\n}\nconst $ = (selector, scope = document) => scope.querySelector(selector);\nconst $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];\nconst esc = value => String(value).replace(/[&<>\"']/g, c => ({ \"&\":\"&amp;\", \"<\":\"&lt;\", \">\":\"&gt;\", '\"':\"&quot;\", \"'\":\"&#39;\" }[c]));\n\n/* ==========================================================================\n   SHARED CANDLE GEOMETRY\n   All diagrams use one mapping function and OHLC convention.\n   A green candle: open at body bottom, close at body top.\n   A red candle: open at body top, close at body bottom.\n   ========================================================================== */\nfunction candleSVG({open, high, low, close, compact = false, labels = true}) {\n  const width = 480, height = compact ? 255 : 285;\n  const top = 35, bottom = height - 35;\n  const min = Math.min(low, open, close) - 5, max = Math.max(high, open, close) + 5;\n  const range = Math.max(1, max - min);\n  const y = value => bottom - ((value - min) / range) * (bottom - top);\n  const color = close > open ? \"var(--bull)\" : close < open ? \"var(--bear)\" : \"var(--neutral)\";\n  const bodyTop = y(Math.max(open, close)), bodyBottom = y(Math.min(open, close));\n  const bodyHeight = Math.max(3, bodyBottom - bodyTop);\n  const midX = 205, bodyWidth = 66;\n  const lines = [open, close, high, low].filter((v,i,a)=>a.indexOf(v)===i);\n  return `<svg viewBox=\"0 0 ${width} ${height}\" role=\"img\" aria-label=\"Candlestick with open ${open}, high ${high}, low ${low}, close ${close}\">\n    ${lines.map(v=>`<line x1=\"65\" x2=\"400\" y1=\"${y(v)}\" y2=\"${y(v)}\" stroke=\"var(--line)\" stroke-dasharray=\"3 5\"/>`).join(\"\")}\n    <line x1=\"${midX}\" x2=\"${midX}\" y1=\"${y(high)}\" y2=\"${y(low)}\" stroke=\"${color}\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <rect x=\"${midX-bodyWidth/2}\" y=\"${bodyTop}\" width=\"${bodyWidth}\" height=\"${bodyHeight}\" rx=\"2\" fill=\"${color}\"/>\n    ${labels ? `<g fill=\"var(--ink-soft)\" font-size=\"11\">\n      <text x=\"260\" y=\"${y(high)+4}\">HIGH \u00b7 ${high}</text>\n      <text x=\"260\" y=\"${y(open)+4}\">OPEN \u00b7 ${open}</text>\n      <text x=\"260\" y=\"${y(close)+4}\">CLOSE \u00b7 ${close}</text>\n      <text x=\"260\" y=\"${y(low)+4}\">LOW \u00b7 ${low}</text>\n    </g>` : \"\"}\n  </svg>`;\n}\n\n/* ==========================================================================\n   LESSON SECTION RENDERERS\n   Each function owns one section, so sections can be edited independently.\n   ========================================================================== */\nfunction renderTopic(lesson) {\n  return `<section class=\"lesson-section\" id=\"topic\">\n    ${sectionHeading(\"01\",\"First, the big idea\")}\n    <div class=\"card prose\"><p>${esc(lesson.topic)}</p></div>\n  </section>`;\n}\nfunction renderInformation(lesson) {\n  return `<section class=\"lesson-section\" id=\"information\">\n    ${sectionHeading(\"02\",\"Know these four things\")}\n    <div class=\"card info-list\">${lesson.information.map(item=>`\n      <article class=\"info-item\"><strong>${esc(item.title)}</strong><p>${esc(item.text)}</p></article>\n    `).join(\"\")}</div>\n  </section>`;\n}\nfunction sectionHeading(number, title) {\n  return `<div class=\"section-heading\"><span class=\"section-index\">${number}</span><h2>${title}</h2></div>`;\n}\nfunction renderIllustration(lesson) {\n  if (lesson.id === \"foundations\") {\n    return `<section class=\"lesson-section\" id=\"illustration\">\n      ${sectionHeading(\"03\",\"Explore the candle\")}\n      <div class=\"card figure-card\">\n        <div class=\"figure-wrap\">\n          <svg viewBox=\"0 0 500 300\" role=\"img\" aria-label=\"Interactive diagram of candlestick anatomy\">\n            <line x1=\"215\" x2=\"215\" y1=\"40\" y2=\"250\" stroke=\"var(--bull)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n            <rect x=\"178\" y=\"112\" width=\"74\" height=\"66\" rx=\"3\" fill=\"var(--bull)\"/>\n            <g class=\"diagram-part\" data-part=\"high\"><line class=\"hit\" x1=\"215\" x2=\"215\" y1=\"40\" y2=\"40\"/><line x1=\"252\" x2=\"280\" y1=\"40\" y2=\"40\" stroke=\"var(--line-strong)\"/><text x=\"290\" y=\"44\" fill=\"var(--ink-soft)\" font-size=\"16\" font-weight=\"800\">HIGH</text></g>\n            <g class=\"diagram-part\" data-part=\"close\"><line class=\"hit\" x1=\"215\" x2=\"215\" y1=\"112\" y2=\"112\"/><line x1=\"252\" x2=\"280\" y1=\"112\" y2=\"112\" stroke=\"var(--line-strong)\"/><text x=\"290\" y=\"116\" fill=\"var(--ink-soft)\" font-size=\"16\" font-weight=\"800\">CLOSE</text></g>\n            <g class=\"diagram-part\" data-part=\"open\"><line class=\"hit\" x1=\"215\" x2=\"215\" y1=\"178\" y2=\"178\"/><line x1=\"252\" x2=\"280\" y1=\"178\" y2=\"178\" stroke=\"var(--line-strong)\"/><text x=\"290\" y=\"182\" fill=\"var(--ink-soft)\" font-size=\"16\" font-weight=\"800\">OPEN</text></g>\n            <g class=\"diagram-part\" data-part=\"low\"><line class=\"hit\" x1=\"215\" x2=\"215\" y1=\"250\" y2=\"250\"/><line x1=\"252\" x2=\"280\" y1=\"250\" y2=\"250\" stroke=\"var(--line-strong)\"/><text x=\"290\" y=\"254\" fill=\"var(--ink-soft)\" font-size=\"16\" font-weight=\"800\">LOW</text></g>\n            <g class=\"diagram-part\" data-part=\"upper\"><line class=\"hit\" x1=\"215\" x2=\"215\" y1=\"40\" y2=\"112\"/><text x=\"95\" y=\"75\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-size=\"12\">UPPER WICK</text><path d=\"M103 71 H194\" stroke=\"var(--line-strong)\"/></g>\n            <g class=\"diagram-part\" data-part=\"lower\"><line class=\"hit\" x1=\"215\" x2=\"215\" y1=\"178\" y2=\"250\"/><text x=\"95\" y=\"224\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-size=\"12\">LOWER WICK</text><path d=\"M103 220 H194\" stroke=\"var(--line-strong)\"/></g>\n            <g class=\"diagram-part\" data-part=\"body\"><rect class=\"hit\" x=\"178\" y=\"112\" width=\"74\" height=\"66\"/><text x=\"95\" y=\"150\" text-anchor=\"end\" fill=\"var(--ink-soft)\" font-size=\"12\">BODY</text><path d=\"M103 146 H173\" stroke=\"var(--line-strong)\"/></g>\n          </svg>\n        </div>\n        <div class=\"figure-caption\">Select a candle component in the diagram. The highlighted part and explanation will update together.</div>\n        <div class=\"diagram-explanation\" id=\"diagramExplanation\"><strong>Choose a component</strong><p>Select a label or candle part to learn what it represents.</p></div>\n      </div>\n    </section>`;\n  }\n  const o = lesson.animation.final;\n  return `<section class=\"lesson-section\" id=\"illustration\">\n    ${sectionHeading(\"03\",\"Explore the candle\")}\n    <div class=\"card figure-card\">\n      <div class=\"figure-wrap\">${candleSVG(o)}</div>\n      <div class=\"figure-caption\">${lesson.id === \"green\" ? \"GREEN CANDLE \u00b7 Open 100 \u00b7 High 130 \u00b7 Low 90 \u00b7 Close 120. Click a labelled part in the Chapter 1 anatomy diagram to learn more.\" : \"RED CANDLE \u00b7 Open 120 \u00b7 High 130 \u00b7 Low 90 \u00b7 Close 100. Compare the body: the Close is below the Open.\"}</div>\n    </div>\n  </section>`;\n}\nfunction renderAnimation(lesson) {\n  if (!lesson.animation) {\n    return `<section class=\"lesson-section\" id=\"animation\">\n      ${sectionHeading(\"04\",\"Watch a candle form\")}\n      <div class=\"card prose\"><p>In the next two chapters, watch price build a candle step by step. The Open stays the same. High and Low remember the furthest prices reached.</p><p>Use Previous and Next, or press Play to watch the full path.</p></div>\n    </section>`;\n  }\n  return `<section class=\"lesson-section\" id=\"animation\">\n    ${sectionHeading(\"04\",\"Watch a candle form\")}\n    <div class=\"animation-grid\">\n      <div class=\"card simulator\">\n        <div class=\"sim-head\"><span class=\"sim-tag\">FORMATION SIMULATOR</span><span class=\"sim-tag\">${lesson.id === \"green\" ? \"BULLISH\" : \"BEARISH\"} EXAMPLE</span></div>\n        <div class=\"stage-title\" id=\"stageTitle\">The opening</div>\n        <svg class=\"sim-svg\" id=\"simSvg\" viewBox=\"0 0 320 270\" role=\"img\" aria-label=\"Step-by-step candle formation\"></svg>\n        <div class=\"figure-caption\" style=\"text-align:center;margin:-2px 0 10px\">The moving dot is the current price. At the final stage, it becomes the CLOSE.</div>\n        <div class=\"readouts\">\n          <div class=\"readout\"><span>CURRENT PRICE</span><strong id=\"currentPrice\">100</strong></div>\n          <div class=\"readout\"><span>HIGH</span><strong id=\"currentHigh\">100</strong></div>\n          <div class=\"readout\"><span>LOW</span><strong id=\"currentLow\">100</strong></div>\n          <div class=\"readout\"><span>OPEN</span><strong id=\"currentOpen\">100</strong></div>\n        </div>\n        <div class=\"stage-track\" id=\"stageTrack\"></div>\n        <div class=\"controls\">\n          <button class=\"btn\" id=\"previousStage\" type=\"button\">\u2190 Previous</button>\n          <button class=\"btn btn-primary\" id=\"playPause\" type=\"button\">\u25b6 Play</button>\n          <button class=\"btn\" id=\"nextStage\" type=\"button\">Next \u2192</button>\n          <button class=\"btn\" id=\"replay\" type=\"button\">\u21ba Replay</button>\n          <select class=\"speed-select\" id=\"speedSelect\" aria-label=\"Animation speed\"><option value=\"0.5\">Slow</option><option value=\"0.75\" selected>Normal</option><option value=\"1.15\">Fast</option></select>\n        </div>\n        <div class=\"stage-count\" id=\"stageCount\">Stage 1 of 7</div>\n        <div class=\"formation-check\" id=\"formationCheck\" hidden>\n          <h3>Quick check: find OPEN and CLOSE</h3>\n          <p>The animation is complete. Tap the correct answer for each question.</p>\n          <div id=\"formationQuiz\"></div>\n        </div>\n      </div>\n      <aside class=\"instructor\" aria-live=\"polite\">\n        <div class=\"instructor-label\">\u2726 INSTRUCTOR EXPLANATION</div>\n        <h3 id=\"instructorTitle\">The opening</h3>\n        <div class=\"instructor-copy\" id=\"instructorCopy\">A new candle begins when the market opens.</div>\n        <div class=\"change-grid\">\n          <div class=\"change-item\"><strong>WHAT CHANGED</strong><span id=\"changedText\"></span></div>\n          <div class=\"change-item\"><strong>WHAT STAYED THE SAME</strong><span id=\"unchangedText\"></span></div>\n        </div>\n        <div class=\"instructor-foot\">The instructor's explanation is synchronized to the selected animation stage.</div>\n      </aside>\n    </div>\n  </section>`;\n}\nfunction renderLab() {\n  return `<section class=\"lesson-section\" id=\"laboratory\">\n    ${sectionHeading(\"05\",\"Try it yourself\")}\n    <div class=\"card lab-grid\">\n      <div>\n        <div class=\"prose\" style=\"margin-bottom:15px\">Change the four prices to make your own candle. The chart changes straight away. High must be the biggest number. Low must be the smallest number.</div>\n        <div class=\"lab-fields\">\n          <div class=\"field\"><label for=\"labOpen\">OPEN</label><input id=\"labOpen\" type=\"number\" step=\"any\" value=\"100\"></div>\n          <div class=\"field\"><label for=\"labHigh\">HIGH</label><input id=\"labHigh\" type=\"number\" step=\"any\" value=\"130\"></div>\n          <div class=\"field\"><label for=\"labLow\">LOW</label><input id=\"labLow\" type=\"number\" step=\"any\" value=\"90\"></div>\n          <div class=\"field\"><label for=\"labClose\">CLOSE</label><input id=\"labClose\" type=\"number\" step=\"any\" value=\"120\"></div>\n        </div>\n        <div class=\"lab-result bull\" id=\"labResult\" role=\"status\">Green candle \u00b7 Close is above Open.</div>\n        <button class=\"btn\" id=\"resetLab\" type=\"button\" style=\"margin-top:10px\">Reset example</button>\n      </div>\n      <div class=\"lab-chart\" id=\"labChart\"></div>\n    </div>\n  </section>`;\n}\nfunction renderOverview() {\n  return `<section class=\"lesson-section\" id=\"overview\">\n    ${sectionHeading(\"01\",\"The big picture\")}\n    <div class=\"card overview-card\">\n      <h3>One candle tells one simple price story</h3>\n      <p class=\"prose\">A candlestick shows what price did during one set time. That time can be one minute, one hour, or one day. It gives you four important prices:</p>\n      <div class=\"overview-grid\">\n        <div class=\"overview-item\"><strong>Open</strong><span>The first price when the candle starts.</span></div>\n        <div class=\"overview-item\"><strong>Close</strong><span>The last price when the candle ends.</span></div>\n        <div class=\"overview-item\"><strong>High</strong><span>The highest price reached during that time.</span></div>\n        <div class=\"overview-item\"><strong>Low</strong><span>The lowest price reached during that time.</span></div>\n      </div>\n      <p class=\"prose\"><strong>Body:</strong> the thick middle part. It joins Open and Close.<br><strong>Wicks:</strong> the thin lines above and below the body. They show High and Low.</p>\n      <div class=\"overview-reminder\"><strong>Remember:</strong> a green candle closes higher than it opens. A red candle closes lower than it opens. Candle colour shows what happened in that one period. It does not promise what price will do next.</div>\n    </div>\n  </section>`;\n}\nfunction renderOverviewLesson(lesson) {\n  return `<header class=\"hero\">\n      <div class=\"hero-topline\"><span class=\"kicker\">${esc(lesson.kicker)}</span><span class=\"lesson-pill\">FINAL CHAPTER</span></div>\n      <h1>${esc(lesson.title)}</h1>\n      <div class=\"lead\">${esc(lesson.introduction)}</div>\n    </header>\n    ${renderOverview()}\n    <footer class=\"footer-nav\">\n      <button class=\"btn\" id=\"previousChapter\">\u2190 Previous chapter</button>\n      <div class=\"footer-note\">You have reached the end of the book.</div>\n      <button class=\"btn btn-finish\" id=\"finishBookBtn\" type=\"button\">\u2713 Finish Book</button>\n    </footer>\n    <div class=\"disclaimer\">CANDLES \u2014 by TRADING BOOKS \u00b7 Educational material only. A candle describes one period of price movement. It does not predict what price will do next.</div>`;\n}\nfunction renderQuiz(lesson) {\n  return `<section class=\"lesson-section\" id=\"knowledge-check\">\n    ${sectionHeading(\"06\",\"Quick check\")}\n    <div id=\"quizContainer\"></div>\n  </section>`;\n}\nfunction renderLesson() {\n  stopAnimation();\n  const lesson = LESSONS[state.chapter];\n  $(\"#chapterCounter\").textContent = `CHAPTER ${lesson.number} / ${LESSONS.length}`;\n  $(\"#lessonContent\").innerHTML = lesson.id === \"overview\" ? renderOverviewLesson(lesson) : `\n    <header class=\"hero\">\n      <div class=\"hero-topline\"><span class=\"kicker\">${esc(lesson.kicker)}</span><span class=\"lesson-pill\">LESSON ${state.chapter+1} OF ${LESSONS.length}</span></div>\n      <h1>${esc(lesson.title)}</h1>\n      <div class=\"lead\">${esc(lesson.introduction)}</div>\n      <nav class=\"journey-strip\" aria-label=\"Lesson steps\">\n        <a class=\"journey-step active\" href=\"#topic\"><span>1</span><b>Learn</b></a>\n        <i></i><a class=\"journey-step\" href=\"#animation\"><span>2</span><b>Watch</b></a>\n        <i></i><a class=\"journey-step\" href=\"#laboratory\"><span>3</span><b>Try it</b></a>\n        <i></i><a class=\"journey-step\" href=\"#knowledge-check\"><span>4</span><b>Quiz</b></a>\n      </nav>\n    </header>\n    ${renderTopic(lesson)}\n    ${renderInformation(lesson)}\n    ${renderIllustration(lesson)}\n    ${renderAnimation(lesson)}\n    ${renderLab()}\n    ${renderQuiz(lesson)}\n    <footer class=\"footer-nav\">\n      <button class=\"btn\" id=\"previousChapter\" ${state.chapter === 0 ? \"disabled\" : \"\"}>\u2190 Previous chapter</button>\n      <div class=\"footer-note\">${state.completed.includes(lesson.id) ? \"\u2713 Chapter completed\" : \"Complete the knowledge check to mark this chapter complete.\"}</div>\n      <button class=\"btn btn-primary\" id=\"nextChapter\" ${state.chapter === LESSONS.length-1 ? \"disabled\" : \"\"}>Next chapter \u2192</button>\n    </footer>\n    <div class=\"disclaimer\">CANDLES \u2014 by TRADING BOOKS \u00b7 Educational material only. Candlestick colour describes the relationship between a candle's Open and Close; it does not predict the next price movement or provide a trading recommendation.</div>\n  `;\n  if (lesson.id === \"overview\") {\n    const finBtn = $(\"#finishBookBtn\");\n    if (finBtn) {\n      finBtn.addEventListener(\"click\", () => {\n        if (!state.completed.includes(\"overview\")) {\n          state.completed.push(\"overview\");\n          saveProgress();\n          renderNavigation();\n        }\n        playLearningCue(\"finish\");\n        sendParentMessage(\"FINISH_CANDLES_BOOK\");\n      });\n    }\n  }\n  if (lesson.id !== \"overview\") {\n    bindIllustration();\n    bindAnimation();\n    bindLab();\n    bindQuiz();\n  }\n  $$(\".journey-step\").forEach(link => link.addEventListener(\"click\", event => {\n    const href = link.getAttribute(\"href\");\n    if (href && href.startsWith(\"#\")) {\n      event.preventDefault();\n      playLearningCue(\"click\");\n      $$(\".journey-step\").forEach(el => el.classList.toggle(\"active\", el === link));\n      const targetEl = $(href);\n      if (targetEl) targetEl.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n    }\n  }));\n  $(\"#previousChapter\").addEventListener(\"click\", () => { playLearningCue(\"chapter\"); navigate(state.chapter - 1); });\n  if ($(\"#nextChapter\")) $(\"#nextChapter\").addEventListener(\"click\", () => { playLearningCue(\"chapter\"); navigate(state.chapter + 1); });\n  renderNavigation();\n}\nfunction renderNavigation() {\n  const nav = $(\"#chapterNav\");\n  nav.innerHTML = LESSONS.map((lesson,index)=>`\n    <button class=\"chapter-link\" data-chapter=\"${index}\" ${index===state.chapter?'aria-current=\"page\"':''}>\n      <span class=\"chapter-number\">${lesson.number}</span>\n      <span><strong>${esc(lesson.navTitle)}</strong><small>${esc(lesson.navDescription)}</small>${state.completed.includes(lesson.id)?'<span class=\"chapter-status\">\u2713 COMPLETED</span>':''}</span>\n    </button>`).join(\"\");\n  $$(\".chapter-link\",nav).forEach(button=>button.addEventListener(\"click\",()=>navigate(Number(button.dataset.chapter))));\n  $(\"#mobileChapter\").innerHTML = LESSONS.map((lesson,index)=>`<option value=\"${index}\" ${index===state.chapter?'selected':''}>${lesson.number} \u2014 ${esc(lesson.navTitle)}</option>`).join(\"\");\n  $(\"#mobileChapter\").onchange = event => navigate(Number(event.target.value));\n  $(\"#progressLabel\").textContent = `${state.completed.length} / 3`;\n  $(\"#progressFill\").style.width = `${state.completed.length/3*100}%`;\n}\n\n/* ==========================================================================\n   ILLUSTRATION INTERACTION\n   ========================================================================== */\nfunction bindIllustration() {\n  const explanations = {\n    high:[\"High\",\"The highest price reached during this candle. The upper wick ends here.\"],\n    open:[\"Open\",\"The first price recorded when the candle period begins.\"],\n    body:[\"Body\",\"The solid rectangle between the Open and Close. Its colour shows whether the candle closed higher or lower.\"],\n    close:[\"Close\",\"The final recorded price when the candle period ends.\"],\n    low:[\"Low\",\"The lowest price reached during this candle. The lower wick ends here.\"],\n    upper:[\"Upper wick\",\"The thin line above the body, showing the distance from the body to the High.\"],\n    lower:[\"Lower wick\",\"The thin line below the body, showing the distance from the Low to the body.\"]\n  };\n  $$(\"[data-part]\").forEach(part=>part.addEventListener(\"click\",()=>{\n    $$(\"[data-part]\").forEach(el=>el.classList.toggle(\"selected\",el===part));\n    const [title,text]=explanations[part.dataset.part];\n    $(\"#diagramExplanation\").innerHTML=`<strong>${title}</strong><p>${text}</p>`;\n    playLearningCue(\"anatomy\");\n  }));\n}\n\n/* ==========================================================================\n   UPGRADED STUDIO LEARNING AUDIO ENGINE (Multi-Voice Harmonic Web Audio Synth)\n   Features warm low-pass filtering, soft harmonic overtones, stereo imaging,\n   and distinct acoustic cues for anatomy, formation stages, OHLC lab, and quizzes.\n   ========================================================================== */\nfunction saveAudioPreferences() {\n  try { localStorage.setItem(\"candles-audio\", JSON.stringify(state.audio)); } catch {}\n}\nfunction setAudioStatus(message) { const status = $(\"#audioStatus\"); if (status) status.textContent = message; }\nfunction loadAudioPreferences() {\n  try {\n    const saved = JSON.parse(localStorage.getItem(\"candles-audio\") || \"null\");\n    if (saved && typeof saved === \"object\") Object.assign(state.audio, saved);\n    else state.audio.enabled = localStorage.getItem(\"candles-sound\") !== \"off\";\n  } catch {}\n}\nfunction playLearningCue(kind = \"step\") {\n  const isMobBook = window.innerWidth <= 650;\n  if (!isMobBook && (!state.audio.enabled || state.audio.volume <= 0)) return;\n  try {\n    const AudioContextClass = window.AudioContext || window.webkitAudioContext;\n    if (!AudioContextClass) { setAudioStatus(\"Unavailable\"); return; }\n    state.audioContext = state.audioContext || new AudioContextClass();\n    const ctx = state.audioContext;\n    if (ctx.state === \"suspended\") ctx.resume();\n    const now = ctx.currentTime;\n    const profileConfig = {\n      balanced: { gain: 1.0, cutoff: 2600, shimmer: 0.22 },\n      focus: { gain: 0.82, cutoff: 1850, shimmer: 0.12 },\n      quiet: { gain: 0.55, cutoff: 1450, shimmer: 0.08 }\n    }[state.audio.profile] || { gain: 0.85, cutoff: 2200, shimmer: 0.16 };\n    const base = Math.max(0.015, Math.min(0.25, state.audio.volume * profileConfig.gain * 0.14));\n\n    const patterns = {\n      step: [[493.88, .085, 0, \"triangle\", 0]],\n      click: [[659.25, .06, 0, \"sine\", 0], [987.77, .045, .01, \"sine\", .08]],\n      chapter: [[440, .08, 0, \"triangle\", -.12], [587.33, .11, .055, \"sine\", .12]],\n      anatomy: [[587.33, .07, 0, \"sine\", -.08], [880, .09, .04, \"triangle\", .08]],\n      green: [[523.25, .09, 0, \"triangle\", -.16], [659.25, .12, .065, \"triangle\", .05], [783.99, .14, .12, \"sine\", .18]],\n      red: [[440, .09, 0, \"triangle\", .16], [349.23, .13, .065, \"triangle\", -.05], [293.66, .15, .12, \"sine\", -.18]],\n      doji: [[440, .08, 0, \"sine\", -.1], [659.25, .11, .05, \"sine\", .1]],\n      invalid: [[293.66, .08, 0, \"sawtooth\", -.1], [246.94, .11, .07, \"triangle\", .1]],\n      correct: [[523.25, .095, 0, \"sine\", -.2], [659.25, .115, .075, \"sine\", -.05], [783.99, .14, .15, \"triangle\", .1], [1046.5, .22, .22, \"sine\", .22]],\n      wrong: [[329.63, .11, 0, \"triangle\", .12], [261.63, .17, .09, \"sine\", -.12]],\n      finish: [[523.25, .11, 0, \"triangle\", -.25], [659.25, .12, .08, \"triangle\", -.08], [783.99, .15, .16, \"triangle\", .08], [987.77, .18, .24, \"sine\", .18], [1046.5, .28, .32, \"sine\", 0]]\n    };\n\n    const masterFilter = ctx.createBiquadFilter();\n    masterFilter.type = \"lowpass\";\n    masterFilter.frequency.setValueAtTime(profileConfig.cutoff, now);\n    masterFilter.connect(ctx.destination);\n\n    (patterns[kind] || patterns.step).forEach(([frequency, duration, delay, wave, pan]) => {\n      const startAt = now + delay;\n      const osc = ctx.createOscillator();\n      const subOsc = ctx.createOscillator();\n      const gain = ctx.createGain();\n      const subGain = ctx.createGain();\n\n      osc.type = wave;\n      osc.frequency.setValueAtTime(frequency, startAt);\n\n      subOsc.type = \"sine\";\n      subOsc.frequency.setValueAtTime(frequency * 2, startAt);\n\n      const peak = base * (kind === \"finish\" ? 1.15 : 1);\n      gain.gain.setValueAtTime(0.0001, startAt);\n      gain.gain.linearRampToValueAtTime(peak, startAt + 0.012);\n      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);\n\n      subGain.gain.setValueAtTime(0.0001, startAt);\n      subGain.gain.linearRampToValueAtTime(peak * profileConfig.shimmer, startAt + 0.012);\n      subGain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration * 0.85);\n\n      osc.connect(gain);\n      subOsc.connect(subGain);\n\n      if (ctx.createStereoPanner) {\n        const panner = ctx.createStereoPanner();\n        panner.pan.setValueAtTime(pan, startAt);\n        gain.connect(panner);\n        subGain.connect(panner);\n        panner.connect(masterFilter);\n      } else {\n        gain.connect(masterFilter);\n        subGain.connect(masterFilter);\n      }\n\n      osc.start(startAt);\n      subOsc.start(startAt);\n      osc.stop(startAt + duration + 0.04);\n      subOsc.stop(startAt + duration + 0.04);\n    });\n    setAudioStatus(state.audio.profile === \"quiet\" ? \"Quiet mode\" : \"On\");\n  } catch { setAudioStatus(\"Muted by browser\"); }\n}\nfunction showFormationCheckpoint() {\n  const panel = $(\"#formationCheck\");\n  if (!panel || !panel.hidden) return;\n  panel.hidden = false;\n  playLearningCue(\"finish\");\n  renderFormationCheckpoint();\n}\nfunction renderFormationCheckpoint() {\n  const isGreen = LESSONS[state.chapter].id === \"green\";\n  const questions = [\n    { key:\"open\", text:\"Where is OPEN on this candle?\", options:[\"At the top of the body\",\"At the bottom of the body\"], answer:isGreen ? 1 : 0,\n      explain:isGreen ? \"Correct: a green candle opens at the bottom of its body.\" : \"Correct: a red candle opens at the top of its body.\" },\n    { key:\"close\", text:\"Where is CLOSE on this candle?\", options:[\"At the top of the body\",\"At the bottom of the body\"], answer:isGreen ? 0 : 1,\n      explain:isGreen ? \"Correct: a green candle closes at the top of its body.\" : \"Correct: a red candle closes at the bottom of its body.\" }\n  ];\n  const target = $(\"#formationQuiz\");\n  if (!target) return;\n  target.innerHTML = questions.map((q,index) => {\n    const chosen = state.formationAnswers[q.key];\n    return `<div class=\"formation-question\">${index+1}. ${q.text}</div>\n      <div class=\"answer-list\">${q.options.map((option,choice) => {\n        const cls = chosen === undefined ? \"\" : choice === q.answer ? \"correct\" : chosen === choice ? \"incorrect\" : \"\";\n        return `<button type=\"button\" class=\"answer-option ${cls}\" data-form-key=\"${q.key}\" data-form-choice=\"${choice}\" ${chosen!==undefined?\"disabled\":\"\"}>${String.fromCharCode(65+choice)}. ${option}</button>`;\n      }).join(\"\")}</div>\n      ${chosen!==undefined?`<div class=\"formation-feedback ${chosen===q.answer?\"good\":\"bad\"}\">${chosen===q.answer?\"That's right!\":\"Let's remember this:\"} ${q.explain}</div>`:\"\"}`;\n  }).join(\"\");\n  if (Object.keys(state.formationAnswers).length === 2) {\n    const score = questions.filter(q=>state.formationAnswers[q.key]===q.answer).length;\n    target.innerHTML += `<p class=\"formation-feedback\"><strong>${score} out of 2 correct.</strong> ${score===2?\"Excellent! You can identify the candle's Open and Close.\":\"Replay the animation and try again. Learning takes practice.\"}</p>\n      <button type=\"button\" class=\"btn\" id=\"formationTryAgain\">Try these questions again</button>`;\n    $(\"#formationTryAgain\").onclick = () => { state.formationAnswers = {}; renderFormationCheckpoint(); };\n  }\n  $$(\"[data-form-key]\",target).forEach(button => button.onclick = () => {\n    const key = button.dataset.formKey;\n    if (state.formationAnswers[key] !== undefined) return;\n    const q = questions.find(item=>item.key===key);\n    state.formationAnswers[key] = Number(button.dataset.formChoice);\n    playLearningCue(state.formationAnswers[key] === q.answer ? \"correct\" : \"wrong\");\n    renderFormationCheckpoint();\n  });\n}\n\n/* ==========================================================================\n   FORMATION SIMULATOR\n   Price geometry is calculated from OHLC at every stage; no decorative motion\n   can contradict the recorded open, running high, running low or current price.\n   ========================================================================== */\nfunction stopAnimation() {\n  state.playing = false;\n  if (state.timer) clearTimeout(state.timer);\n  if (state.frame) cancelAnimationFrame(state.frame);\n  state.timer = null; state.frame = null;\n  const button = $(\"#playPause\");\n  if (button) button.textContent = \"\u25b6 Play\";\n}\nfunction easeInOut(t) { return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }\nfunction interpolate(a,b,t) { return a+(b-a)*t; }\nfunction drawSimulation(values = null) {\n  const lesson = LESSONS[state.chapter], config = lesson.animation;\n  if (!config) return;\n  const step = config.stages[state.stage], open = config.open;\n  const shown = values || step;\n  const price = shown.price, high = shown.high, low = shown.low;\n  const color = price > open ? \"var(--bull)\" : price < open ? \"var(--bear)\" : \"var(--neutral)\";\n  const min = Math.min(low,open,price)-5, max = Math.max(high,open,price)+5;\n  const y = value => 230 - ((value-min)/(max-min))*185;\n  const bodyTop = y(Math.max(open,price)), bodyBottom = y(Math.min(open,price));\n  const bodyHeight = Math.max(3,bodyBottom-bodyTop);\n  const openY = y(open), highY = y(high), lowY = y(low), priceY = y(price);\n  const part = step.focus;\n  $(\"#simSvg\").innerHTML = `\n    <defs><filter id=\"softGlow\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\"><feGaussianBlur stdDeviation=\"3\" result=\"blur\"/><feMerge><feMergeNode in=\"blur\"/><feMergeNode in=\"SourceGraphic\"/></feMerge></filter></defs>\n    ${[open,price,high,low].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<line x1=\"28\" x2=\"292\" y1=\"${y(v)}\" y2=\"${y(v)}\" stroke=\"var(--line)\" stroke-dasharray=\"3 6\"/><text x=\"22\" y=\"${y(v)+4}\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"10\">${Number(v.toFixed(1))}</text>`).join(\"\")}\n    <line x1=\"155\" x2=\"155\" y1=\"${highY}\" y2=\"${lowY}\" stroke=\"${color}\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n    <rect x=\"125\" y=\"${bodyTop}\" width=\"60\" height=\"${bodyHeight}\" rx=\"3\" fill=\"${color}\" />\n    <line x1=\"190\" x2=\"218\" y1=\"${openY}\" y2=\"${openY}\" stroke=\"var(--accent)\" stroke-width=\"2.4\" stroke-dasharray=\"5 3\"/>\n    <text x=\"224\" y=\"${openY+20}\" fill=\"var(--accent)\" font-size=\"14\" font-weight=\"800\">OPEN</text>\n    <line x1=\"92\" x2=\"120\" y1=\"${priceY}\" y2=\"${priceY}\" stroke=\"var(--focus)\" stroke-width=\"2.4\" stroke-dasharray=\"3 3\"/>\n    <text x=\"86\" y=\"${priceY+5}\" text-anchor=\"end\" fill=\"var(--focus)\" font-size=\"14\" font-weight=\"800\">${(!values && state.stage===config.stages.length-1) ? \"CLOSE\" : \"PRICE\"}</text>\n    <circle cx=\"155\" cy=\"${priceY}\" r=\"7\" fill=\"var(--focus)\" stroke=\"white\" stroke-width=\"2\" filter=\"url(#softGlow)\"/>\n    <text x=\"155\" y=\"258\" text-anchor=\"middle\" fill=\"var(--muted)\" font-size=\"10\">ILLUSTRATIVE PRICE PATH</text>\n    <text x=\"226\" y=\"${Math.max(18,highY-12)}\" fill=\"var(--ink-soft)\" font-size=\"14\" font-weight=\"800\">HIGH ${Number(high.toFixed(1))}</text>\n    <text x=\"226\" y=\"${Math.min(246,lowY+20)}\" fill=\"var(--ink-soft)\" font-size=\"14\" font-weight=\"800\">LOW ${Number(low.toFixed(1))}</text>`;\n  $(\"#stageTitle\").textContent = step.title;\n  $(\"#currentPrice\").textContent = Number(price.toFixed(1));\n  $(\"#currentHigh\").textContent = Number(high.toFixed(1));\n  $(\"#currentLow\").textContent = Number(low.toFixed(1));\n  $(\"#currentOpen\").textContent = open;\n  $(\"#instructorTitle\").textContent = step.title;\n  $(\"#instructorCopy\").textContent = step.explanation;\n  $(\"#changedText\").textContent = step.changed;\n  $(\"#unchangedText\").textContent = step.unchanged;\n  $(\"#stageCount\").textContent = `Stage ${state.stage+1} of ${config.stages.length}`;\n  $(\"#stageTrack\").innerHTML = config.stages.map((_,index)=>`<span class=\"stage-segment ${index<=state.stage?'active':''}\"></span>`).join(\"\");\n  $(\"#previousStage\").disabled = state.stage === 0;\n  $(\"#nextStage\").disabled = state.stage === config.stages.length-1;\n}\nfunction transitionToStage(index, duration = 1900) {\n  const config = LESSONS[state.chapter].animation;\n  if (!config) return;\n  const previous = config.stages[state.stage];\n  const nextIndex = Math.max(0,Math.min(config.stages.length-1,index));\n  const next = config.stages[nextIndex];\n  if (nextIndex === state.stage) return;\n  if (state.frame) cancelAnimationFrame(state.frame);\n  const from = {price:previous.price,high:previous.high,low:previous.low};\n  const to = {price:next.price,high:next.high,low:next.low};\n  state.stage = nextIndex;\n  drawSimulation(from);\n  const startTime = performance.now();\n  playLearningCue(next.price > config.open ? \"green\" : next.price < config.open ? \"red\" : \"step\");\n  const animate = now => {\n    const raw = Math.min(1,(now-startTime)/duration), t=easeInOut(raw);\n    drawSimulation({\n      price:interpolate(from.price,to.price,t),\n      high:interpolate(from.high,to.high,t),\n      low:interpolate(from.low,to.low,t)\n    });\n    if(raw<1) state.frame=requestAnimationFrame(animate);\n    else { state.frame=null; drawSimulation(); if (state.stage === config.stages.length-1) showFormationCheckpoint(); }\n  };\n  state.frame=requestAnimationFrame(animate);\n}\nfunction setStage(index) {\n  const config = LESSONS[state.chapter].animation;\n  if (!config) return;\n  const target=Math.max(0,Math.min(config.stages.length-1,index));\n  transitionToStage(target, 2100/state.speed);\n}\nfunction advanceAnimation() {\n  const config = LESSONS[state.chapter].animation;\n  if (!state.playing || !config) return;\n  if (state.stage >= config.stages.length-1) { stopAnimation(); showFormationCheckpoint(); return; }\n  const next = state.stage+1;\n  transitionToStage(next, 2350/state.speed);\n  state.timer = setTimeout(()=>{\n    if (!state.playing) return;\n    if (state.stage >= config.stages.length-1) { stopAnimation(); showFormationCheckpoint(); return; }\n    advanceAnimation();\n  },3000/state.speed);\n}\nfunction bindAnimation() {\n  const config = LESSONS[state.chapter].animation;\n  if (!config) return;\n  state.stage = 0; state.speed = 1; state.formationAnswers = {};\n  if ($(\"#formationCheck\")) $(\"#formationCheck\").hidden = true;\n  drawSimulation();\n  $(\"#previousStage\").onclick=()=>{stopAnimation();setStage(state.stage-1);};\n  $(\"#nextStage\").onclick=()=>{stopAnimation();setStage(state.stage+1);};\n  $(\"#playPause\").onclick=()=>{\n    if (state.playing) { stopAnimation(); return; }\n    if (state.stage === config.stages.length-1) { state.stage=0; drawSimulation(); }\n    state.playing=true; $(\"#playPause\").textContent=\"\u2161 Pause\"; advanceAnimation();\n  };\n  $(\"#replay\").onclick=()=>{stopAnimation();state.stage=0;state.formationAnswers={};$(\"#formationCheck\").hidden=true;drawSimulation();};\n  $(\"#speedSelect\").onchange=event=>{\n    state.speed=Number(event.target.value);\n    if(state.playing){stopAnimation();state.playing=true;$(\"#playPause\").textContent=\"\u2161 Pause\";advanceAnimation();}\n  };\n}\n\n/* ==========================================================================\n   OHLC LABORATORY\n   Strict validation prevents impossible candles from being drawn.\n   ========================================================================== */\nfunction bindLab() {\n  const inputs = [\"labOpen\",\"labHigh\",\"labLow\",\"labClose\"].map(id=>$(\"#\"+id));\n  function update() {\n    const [open,high,low,close]=inputs.map(input=>input.value.trim()===\"\"?NaN:Number(input.value));\n    const result=$(\"#labResult\"),chart=$(\"#labChart\");\n    if (![open,high,low,close].every(Number.isFinite)) {\n      result.className=\"lab-result invalid\";result.textContent=\"Enter a valid number in all four fields.\";chart.innerHTML=\"\";return;\n    }\n    if (high < Math.max(open,close) || low > Math.min(open,close) || high < low) {\n      result.className=\"lab-result invalid\";\n      result.textContent=\"Invalid OHLC values. High must be \u2265 Open and Close. Low must be \u2264 Open and Close.\";\n      chart.innerHTML=\"\";return;\n    }\n    const type=close>open?\"bull\":close<open?\"bear\":\"neutral\";\n    result.className=\"lab-result \"+type;\n    result.textContent=type===\"bull\"?\"Green candle \u00b7 Close is above Open.\":type===\"bear\"?\"Red candle \u00b7 Close is below Open.\":\"Doji / neutral \u00b7 Close equals Open.\";\n    chart.innerHTML=candleSVG({open,high,low,close,compact:true,labels:true});\n  }\n  let labSoundTimer = null;\n  inputs.forEach(input=>input.addEventListener(\"input\",()=>{\n    update();\n    if (labSoundTimer) clearTimeout(labSoundTimer);\n    labSoundTimer = setTimeout(() => {\n      const [open,high,low,close]=inputs.map(el=>el.value.trim()===\"\"?NaN:Number(el.value));\n      if (![open,high,low,close].every(Number.isFinite) || high < Math.max(open,close) || low > Math.min(open,close) || high < low) {\n        playLearningCue(\"invalid\");\n      } else if (close > open) {\n        playLearningCue(\"green\");\n      } else if (close < open) {\n        playLearningCue(\"red\");\n      } else {\n        playLearningCue(\"doji\");\n      }\n    }, 180);\n  }));\n  $(\"#resetLab\").onclick=()=>{playLearningCue(\"click\");[100,130,90,120].forEach((value,index)=>inputs[index].value=value);update();};\n  update();\n}\n\n/* ==========================================================================\n   KNOWLEDGE CHECK\n   Assessment feedback is immediate. Progress is saved locally only after\n   all questions in a chapter are answered correctly.\n   ========================================================================== */\nfunction bindQuiz() {\n  state.quizIndex=0;state.answers={};\n  renderQuizQuestion();\n}\nfunction renderQuizQuestion() {\n  const lesson=LESSONS[state.chapter],questions=lesson.quiz,container=$(\"#quizContainer\");\n  if (state.quizIndex>=questions.length) { renderQuizSummary();return; }\n  const q=questions[state.quizIndex],chosen=state.answers[state.quizIndex];\n  container.innerHTML=`\n    <div class=\"card quiz-card\">\n      <div class=\"quiz-topline\"><div class=\"quiz-meta\">QUICK CHALLENGE \u00b7 ${state.quizIndex+1} OF ${questions.length}</div><div class=\"quiz-xp\">\u2726 +10 XP</div></div>\n      <div class=\"quiz-progress\"><span style=\"width:${(state.quizIndex/questions.length)*100}%\"></span></div>\n      <div class=\"quiz-question\">${esc(q.question)}</div>\n      <div class=\"answer-list\">${q.options.map((option,index)=>{\n        let cls=\"\";\n        if(chosen!==undefined&&index===q.answer)cls=\"correct\";\n        else if(chosen===index)cls=\"incorrect\";\n        return `<button class=\"answer-option ${cls}\" data-answer=\"${index}\" ${chosen!==undefined?\"disabled\":\"\"}>${String.fromCharCode(65+index)}. ${esc(option)}</button>`;\n      }).join(\"\")}</div>\n      ${chosen!==undefined?`<div class=\"feedback ${chosen===q.answer?'good':'bad'}\">${chosen===q.answer?'Correct.':'Not quite.'} ${esc(q.explanation)}</div>\n      <div class=\"quiz-footer\"><span class=\"stage-count\">Answer recorded</span><button class=\"btn btn-primary\" id=\"quizContinue\">${state.quizIndex===questions.length-1?\"View results\":\"Next question \u2192\"}</button></div>`:\"\"}\n    </div>`;\n  $$(\"[data-answer]\",container).forEach(button=>button.onclick=()=>{\n    if(state.answers[state.quizIndex]!==undefined)return;\n    state.answers[state.quizIndex]=Number(button.dataset.answer);\n    playLearningCue(Number(button.dataset.answer) === q.answer ? \"correct\" : \"wrong\");\n    renderQuizQuestion();\n  });\n  const next=$(\"#quizContinue\",container);\n  if(next)next.onclick=()=>{playLearningCue(\"click\");state.quizIndex++;renderQuizQuestion();};\n}\nfunction renderQuizSummary() {\n  const lesson=LESSONS[state.chapter],score=lesson.quiz.filter((q,index)=>state.answers[index]===q.answer).length;\n  const passed=score===lesson.quiz.length;\n  if(passed&&!state.completed.includes(lesson.id)){state.completed.push(lesson.id);saveProgress();renderNavigation();playLearningCue(\"finish\");}\n  else if (!passed) playLearningCue(\"wrong\");\n  $(\"#quizContainer\").innerHTML=`\n    <div class=\"card quiz-summary\">\n      <div class=\"result-sparkle\">${passed ? \"\ud83c\udfc6\" : \"\ud83d\udca1\"}</div>\n      <div class=\"score\">${score} / ${lesson.quiz.length}</div>\n      <div class=\"result-xp\">${passed ? \"CHAPTER CLEARED \u00b7 +30 XP\" : \"KEEP PRACTISING \u00b7 YOU CAN RETRY\"}</div>\n      <h3>${passed?\"Chapter knowledge check passed\":\"Assessment completed\"}</h3>\n      <p class=\"prose\">${passed?\"Excellent. You 8 !important; background: linear-gradient(120deg, var(--surface), #fffbeb) !important; }\n:root[data-theme=\"dark\"] .ysk-container #topic .card { background: linear-gradient(120deg, var(--surface), #1c1505) !important; }\n\n/* Theme Toggle Button */\n.topbar-actions { display: flex; align-items: center; gap: 10px; }\n.theme-toggle {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 13px; border: 1px solid var(--line-strong); border-radius: 999px;\n  background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 750;\n  transition: .15s ease;\n}\n.theme-toggle:hover { background: var(--surface-muted); border-color: var(--accent); }\n#mobileThemeToggle { display: none; }\n@media (max-width: 820px) { #mobileThemeToggle { display: inline-flex; } #desktopThemeToggle { display: none; } }\n\n/* Separate Mobile Layout UI */\n@media (max-width: 820px) {\n  .app-shell { display: block; }\n  .sidebar {\n    position: relative; width: 100%; height: auto;\n    padding: 12px 14px; border-right: 0; border-bottom: 1px solid var(--line);\n    box-shadow: 0 4px 16px rgba(15, 23, 42, .06);\n  }\n  .sidebar-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n  .brand { padding: 0; border: 0; }\n  .brand-name { font-size: 18px; }\n  .brand-sub { display: none; }\n  .nav-label, .chapter-nav, .overview-nav-btn, .progress-card { display: none; }\n  .mobile-chapters {\n    display: block; width: 100%; margin-top: 10px; padding: 10px 12px;\n    border: 1px solid var(--line-strong); border-radius: 12px;\n    background: var(--surface-muted); color: var(--ink); font-size: 15px; font-weight: 700;\n  }\n  .main { padding: 14px 12px 40px; overflow-x: hidden; }\n  .topbar { padding-bottom: 6px; flex-wrap: wrap; gap: 6px; }\n  .eyebrow { font-size: 11px; }\n  .hero { margin-top: 8px; padding: 20px 16px 18px; border-radius: 18px; }\n  .hero h1 { font-size: 28px; }\n  .hero .lead { font-size: 15px; line-height: 1.6; }\n  .journey-strip { gap: 4px; margin-top: 14px; overflow-x: auto; }\n  .journey-step { font-size: 10.5px; gap: 3px; }\n  .journey-step span { width: 20px; height: 20px; }\n  .card, .practice-card, .quiz-card { padding: 14px; border-radius: 16px; }\n  .figure-card { padding: 12px 14px 14px; }\n  .figure-wrap { min-height: 185px; }\n  .illus-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; padding-bottom: 10px; }\n  .illus-tab { padding: 8px 8px; font-size: 12px; line-height: 1.3; text-align: center; }\n  .anim-illus-grid { gap: 10px; }\n  .anim-illus-box { padding: 6px; }\n  .anim-illus-box svg { height: 180px; }\n  .live-guide { padding: 12px 14px; }\n  .live-guide h3 { font-size: 16px; margin: 4px 0; }\n  .live-guide p { min-height: 0; font-size: 13.5px; line-height: 1.5; margin-bottom: 8px; }\n  .live-step-pills { margin-bottom: 8px; }\n  .live-guide .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n  .animation-grid { gap: 10px; }\n  .simulator { padding: 12px; }\n  .stage-title { font-size: 17px; margin-top: 4px; }\n  .sim-svg { height: 185px; margin-top: 6px; }\n  .simulator .figure-caption { display: none; }\n  .mobile-live-note { margin: 8px 0 6px !important; padding: 9px 11px !important; font-size: 13.5px !important; line-height: 1.45 !important; }\n  .readouts { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-top: 8px; margin-top: 6px; }\n  .readout span { font-size: 9.5px; }\n  .readout strong { font-size: 13px; margin-top: 2px; }\n  .stage-track { margin: 10px 0; }\n  .controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }\n  .controls .btn { width: 100%; min-height: 40px; padding: 6px 4px; font-size: 12.5px; }\n  .controls .speed-select { grid-column: 1 / -1; width: 100%; min-height: 38px; font-size: 13px; }\n  .stage-count { margin-top: 8px; font-size: 12px; }\n  .practice-svg { height: 195px; }\n  .practice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n  .practice-actions .btn { width: 100%; min-height: 42px; font-size: 13px; }\n  .instructor { padding: 14px; margin-top: 0; }\n  .instructor h3 { font-size: 17px; margin: 6px 0; }\n  .instructor-copy { min-height: 0; font-size: 14px; line-height: 1.55; }\n  .change-grid { grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }\n  .change-item { padding: 10px; font-size: 13px; }\n  .footer-nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }\n  .footer-nav .btn { flex: 1 1 45%; min-height: 44px; font-size: 14px; }\n  .footer-note { width: 100%; order: -1; margin-bottom: 4px; text-align: center; }\n}\n\n.brand-publisher { display: block; margin-top: 6px; color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .14em; }\n.mobile-live-note { display: none; }\n.formation-feedback.good { color: var(--bull-dark); font-weight: 650; }\n.formation-feedback.bad { color: var(--bear-dark); font-weight: 650; }\n:root[data-theme=\"dark\"] .feedback.good { background: rgba(52, 211, 153, .16); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, .35); }\n:root[data-theme=\"dark\"] .feedback.bad { background: rgba(251, 113, 133, .16); color: #fda4af; border: 1px solid rgba(251, 113, 133, .35); }\n:root[data-theme=\"dark\"] .quiz-xp { background: rgba(251, 191, 36, .16); color: #fde68a; }\n.mobile-progress-bar { display: none; }\n@media (max-width: 820px) {\n  .sidebar { position: relative; top: auto; z-index: auto; }\n  .brand-publisher { display: inline; margin-left: 8px; font-size: 10px; }\n  .mobile-progress-bar {\n    display: flex; align-items: center; gap: 10px; margin-top: 8px;\n    font-size: 11px; font-weight: 800; color: var(--muted);\n  }\n  .mobile-progress-bar .progress-track { flex: 1; margin-top: 0; height: 6px; }\n  .animation-grid { display: flex !important; flex-direction: column !important; gap: 10px !important; }\n  .mobile-live-note { display: none !important; }\n}\n\n<\/style>\n<\/head>\n<body>\n<div class=\"app-shell\" id=\"trendApp\">\n  <aside class=\"sidebar\">\n    <div class=\"sidebar-top-row\">\n      <div class=\"brand\">\n        <span class=\"brand-name\">TREND LINES<\/span>\n        <span class=\"brand-sub\">THE TRADING PRIMER<\/span>\n        <span class=\"brand-publisher\">\u2014 BY TRADING BOOKS<\/span>\n      <\/div>\n      <button type=\"button\" class=\"theme-toggle\" id=\"mobileThemeToggle\" aria-label=\"Toggle dark or light mode\">\ud83c\udf19 Dark<\/button>\n    <\/div>\n    <div class=\"nav-label\">THE LEARNING BOOK<\/div>\n    <nav class=\"chapter-nav\" id=\"chapterNav\" aria-label=\"Chapters\"><\/nav>\n    <button type=\"button\" class=\"overview-nav-btn\" id=\"overviewBtn\">\ud83d\udccb Overview Card<\/button>\n    <button type=\"button\" class=\"overview-nav-btn\" id=\"youShouldKnowBtn\" style=\"margin-top:8px;\">\ud83d\udca1 You Should Know<\/button>\n    <select class=\"mobile-chapters\" id=\"mobileChapter\" aria-label=\"Choose a chapter\"><\/select>\n    <div class=\"mobile-progress-bar\" aria-hidden=\"true\">\n      <span id=\"mobileProgressLabel\">0 / 5<\/span>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"mobileProgressFill\"><\/div><\/div>\n    <\/div>\n    <div class=\"progress-card\">\n      <div class=\"progress-meta\"><span>Learning progress<\/span><span id=\"progressLabel\">0 / 5<\/span><\/div>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"><\/div><\/div>\n      <div class=\"progress-hint\">Pass all three questions in a chapter to mark it complete.<\/div>\n    <\/div>\n  <\/aside>\n\n  <main class=\"main\">\n    <div class=\"content\">\n      <header class=\"topbar\">\n        <span class=\"eyebrow\">INTERACTIVE EDUCATION \u00b7 BEGINNER LEVEL<\/span>\n        <div class=\"topbar-actions\">\n          <span class=\"topbar-right\" id=\"chapterCounter\">CHAPTER 01 / 05<\/span>\n          <button type=\"button\" class=\"theme-toggle\" id=\"desktopThemeToggle\" aria-label=\"Toggle dark or light mode\">\ud83c\udf19 Dark<\/button>\n        <\/div>\n      <\/header>\n      <div id=\"lessonContent\"><\/div>\n    <\/div>\n  <\/main>\n<\/div>\n\n<script>\n/* ==========================================================================\n   CANDLESTICK TRADING CHART HELPER\n   ========================================================================== */\nfunction renderCandleChartSVG({ candles, line = null, line2 = null, hz = null, hz2 = null, labels = [], arrows = [], min = 92, max = 148 }) {\n  const w = 440, h = 265, padTop = 24, padBot = 28;\n  const y = v => (h - padBot) - ((v - min) / Math.max(1, max - min)) * (h - padTop - padBot);\n  const gridVals = [Math.round(min + (max - min) * 0.2), Math.round(min + (max - min) * 0.5), Math.round(min + (max - min) * 0.8)];\n\n  let out = gridVals.map(v => `\n    <line x1=\"34\" x2=\"425\" y1=\"${y(v)}\" y2=\"${y(v)}\" stroke=\"var(--line)\" stroke-dasharray=\"3 5\"/>\n    <text x=\"28\" y=\"${y(v) + 4}\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"10\">${v}<\/text>\n  `).join(\"\");\n\n  if (hz !== null) {\n    out += `<line x1=\"36\" x2=\"420\" y1=\"${y(hz)}\" y2=\"${y(hz)}\" stroke=\"var(--bear)\" stroke-width=\"2.4\" stroke-dasharray=\"5 4\"/>`;\n  }\n  if (hz2 !== null) {\n    out += `<line x1=\"36\" x2=\"420\" y1=\"${y(hz2)}\" y2=\"${y(hz2)}\" stroke=\"var(--bull)\" stroke-width=\"2.4\" stroke-dasharray=\"5 4\"/>`;\n  }\n  if (line) {\n    const [x1, p1, x2, p2, dashed] = line;\n    out += `<line x1=\"${x1}\" y1=\"${y(p1)}\" x2=\"${x2}\" y2=\"${y(p2)}\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-linecap=\"round\" ${dashed ? 'stroke-dasharray=\"6 5\"' : ''}/>`;\n  }\n  if (line2) {\n    const [x1, p1, x2, p2, dashed] = line2;\n    out += `<line x1=\"${x1}\" y1=\"${y(p1)}\" x2=\"${x2}\" y2=\"${y(p2)}\" stroke=\"var(--bear)\" stroke-width=\"3\" stroke-linecap=\"round\" ${dashed ? 'stroke-dasharray=\"6 5\"' : ''}/>`;\n  }\n\n  candles.forEach(c => {\n    const [cx, o, hi, lo, cl] = c;\n    const col = cl >= o ? \"var(--bull)\" : \"var(--bear)\";\n    const bTop = y(Math.max(o, cl)), bBot = y(Math.min(o, cl));\n    const bH = Math.max(3, bBot - bTop);\n    out += `<line x1=\"${cx}\" x2=\"${cx}\" y1=\"${y(hi)}\" y2=\"${y(lo)}\" stroke=\"${col}\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n      <rect x=\"${cx - 6.5}\" y=\"${bTop}\" width=\"13\" height=\"${bH}\" rx=\"2\" fill=\"${col}\"/>`;\n  });\n\n  arrows.forEach(a => {\n    const [x1, p1, x2, p2, col, txt] = a;\n    const strokeCol = col === \"bull\" ? \"var(--bull)\" : \"var(--bear)\";\n    out += `<line x1=\"${x1}\" y1=\"${y(p1)}\" x2=\"${x2}\" y2=\"${y(p2)}\" stroke=\"${strokeCol}\" stroke-width=\"2.8\" stroke-dasharray=\"5 4\"/>\n      <text x=\"${x2 + 6}\" y=\"${y(p2) + 4}\" fill=\"${strokeCol}\" font-size=\"11\" font-weight=\"850\">${txt}<\/text>`;\n  });\n\n  labels.forEach(lb => {\n    const [lx, lp, text, type, pos] = lb;\n    const col = type === \"bull\" ? \"var(--bull-dark)\" : type === \"bear\" ? \"var(--bear)\" : type === \"focus\" ? \"var(--focus)\" : \"var(--accent)\";\n    const cy = y(lp);\n    const ty = pos === \"top\" ? cy - 12 : cy + 19;\n    out += `<circle cx=\"${lx}\" cy=\"${cy}\" r=\"5.5\" fill=\"${col}\" stroke=\"#fff\" stroke-width=\"2\"/>\n      <text x=\"${lx}\" y=\"${ty}\" text-anchor=\"middle\" fill=\"${col}\" font-size=\"10.5\" font-weight=\"850\">${text}<\/text>`;\n  });\n\n  return out;\n}\n\n/* ==========================================================================\n   CONTENT MODEL\n   ========================================================================== */\nconst LESSONS = [\n  {\n    id: \"what-is-trendline\",\n    number: \"01\",\n    title: \"What Is a Trend Line?\",\n    navTitle: \"What Is a Trend Line?\",\n    navDescription: \"Definition & how it works\",\n    kicker: \"CHAPTER 01 \u00b7 THE FOUNDATIONS\",\n    introduction: \"Learn what a trend line is, why traders draw it on candlestick charts, and how price respects and bounces off it.\",\n    topic: \"A trend line is a straight line drawn on a trading chart that connects two or more turning points (swings). It acts like a guide showing the market's direction and where price is likely to touch and bounce back.\",\n    information: [\n      { title: \"What is a trend line?\", text: \"It is a straight line connecting at least two swing lows or two swing highs on a chart. It helps you see the trend clearly at a glance.\" },\n      { title: \"Two points draw, three confirm\", text: \"You connect Point 1 and Point 2 to draw the line. When price comes back, touches the line a 3rd time, and goes back, the line is confirmed.\" },\n      { title: \"Rest along the edges\", text: \"Draw the line along the outer edges (wicks or bodies) of the candles. Never force a line straight through the middle of candle bodies.\" },\n      { title: \"Touch and go back\", text: \"When price returns to a valid trend line, buyers or sellers often step in\u2014causing price to touch the line and bounce back.\" }\n    ],\n    diagram: {\n      caption: \"Click any part of the diagram to learn what it represents.\",\n      parts: {\n        p1: [\"Point 1 (First Anchor)\", \"The first clear turning point on the chart where price bounced and started moving.\"],\n        p2: [\"Point 2 (Second Anchor)\", \"The second turning point. Connecting Point 1 to Point 2 lets you draw the trend line.\"],\n        p3: [\"Point 3 (Touch & Bounce)\", \"Price comes back to the line, touches it a 3rd time, and goes back\u2014confirming the trend line!\"],\n        line: [\"The Trend Line\", \"A straight line connecting the swing points. It acts as a guide for where price may bounce next.\"],\n        break: [\"Trend Line Break\", \"When candles close cleanly across the other side of the line, the current trend may be ending.\"]\n      }\n    },\n    animatedIllus: {\n      steps: [\n        { title: \"Step 1: Find Point 1\", text: \"First, look at the chart and mark the first clear low point where price bounced upward.\", hl: \"p1\" },\n        { title: \"Step 2: Connect to Point 2\", text: \"Wait for price to rise, dip, and bounce again. Connect Point 1 to Point 2 with a straight line.\", hl: \"p2\" },\n        { title: \"Step 3: Extend the line forward\", text: \"Extend the straight line into empty space on the right so you can watch what price does next.\", hl: \"line\" },\n        { title: \"Step 4: Price touches & goes back!\", text: \"Price comes back down, touches the line at Point 3, and bounces right back up. Your trend line is confirmed!\", hl: \"p3\" }\n      ]\n    },\n    chartSim: {\n      tag: \"TRADING CHART SIMULATION\",\n      min: 94, max: 140,\n      stages: [\n        {\n          title: \"Candle 1\u20132: Point 1 forms\", cur: \"102\", p1: \"98\", p2: \"None\", status: \"Point 1\",\n          explanation: \"The chart starts playing. Candles drop to 98 and bounce up\u2014forming our first swing point (Point 1).\",\n          changed: \"Point 1 forms at 98.\", unchanged: \"No line can be drawn from 1 point.\",\n          candles: [[55,108,110,98,100],[80,100,107,99,106]],\n          labels: [[55,98,\"Point 1\",\"bull\",\"bot\"]]\n        },\n        {\n          title: \"Candles rise to first peak\", cur: \"120\", p1: \"98\", p2: \"None\", status: \"Rising\",\n          explanation: \"Green candles push price up to 120 before sellers pause the move.\",\n          changed: \"Price climbs to 120.\", unchanged: \"Point 1 stays at 98.\",\n          candles: [[55,108,110,98,100],[80,100,107,99,106],[105,106,115,105,114],[130,114,120,113,118]],\n          labels: [[55,98,\"Point 1\",\"bull\",\"bot\"],[130,120,\"Peak\",\"accent\",\"top\"]]\n        },\n        {\n          title: \"Pullback forms Point 2\", cur: \"106\", p1: \"98\", p2: \"105\", status: \"2 Points\",\n          explanation: \"Price pulls back to 105 and turns green. Now we have Point 1 (98) and Point 2 (105)!\",\n          changed: \"Point 2 forms at 105.\", unchanged: \"105 is higher than 98.\",\n          candles: [[55,108,110,98,100],[80,100,107,99,106],[105,106,115,105,114],[130,114,120,113,118],[155,118,119,110,111],[180,111,112,105,108]],\n          labels: [[55,98,\"Point 1\",\"bull\",\"bot\"],[180,105,\"Point 2\",\"bull\",\"bot\"]]\n        },\n        {\n          title: \"Line drawn through P1 & P2\", cur: \"126\", p1: \"98\", p2: \"105\", status: \"Line Drawn\",\n          explanation: \"We draw a straight trend line through Point 1 and Point 2 and extend it forward as price rallies to 126.\",\n          changed: \"Trend line drawn and extended.\", unchanged: \"Anchors 1 and 2 stay locked.\",\n          candles: [[55,108,110,98,100],[80,100,107,99,106],[105,106,115,105,114],[130,114,120,113,118],[155,118,119,110,111],[180,111,112,105,108],[205,108,118,107,117],[230,117,126,116,125]],\n          line: [45,97.4,395,117,true],\n          labels: [[55,98,\"Point 1\",\"bull\",\"bot\"],[180,105,\"Point 2\",\"bull\",\"bot\"]]\n        },\n        {\n          title: \"Price comes back to the line\", cur: \"114\", p1: \"98\", p2: \"105\", status: \"Approaching\",\n          explanation: \"Red candles bring price back down toward our extended trend line.\",\n          changed: \"Price drops toward the trend line.\", unchanged: \"The line waits below as support.\",\n          candles: [[55,108,110,98,100],[80,100,107,99,106],[105,106,115,105,114],[130,114,120,113,118],[155,118,119,110,111],[180,111,112,105,108],[205,108,118,107,117],[230,117,126,116,125],[255,125,126,118,119],[280,119,120,114,115]],\n          line: [45,97.4,395,117,false],\n          labels: [[55,98,\"Point 1\",\"bull\",\"bot\"],[180,105,\"Point 2\",\"bull\",\"bot\"]]\n        },\n        {\n          title: \"Price touches the line!\", cur: \"112\", p1: \"98\", p2: \"105\", status: \"Touch 3!\",\n          explanation: \"The candle dips right down and touches the trend line at 112\u2014then buyers step in!\",\n          changed: \"Candle touches the trend line at 112.\", unchanged: \"Price stays above the line.\",\n          candles: [[55,108,110,98,100],[80,100,107,99,106],[105,106,115,105,114],[130,114,120,113,118],[155,118,119,110,111],[180,111,112,105,108],[205,108,118,107,117],[230,117,126,116,125],[255,125,126,118,119],[280,119,120,114,115],[305,115,117,112,116]],\n          line: [45,97.4,395,117,false],\n          labels: [[55,98,\"Point 1\",\"bull\",\"bot\"],[180,105,\"Point 2\",\"bull\",\"bot\"],[305,112,\"Touch 3!\",\"focus\",\"bot\"]]\n        },\n        {\n          title: \"Touches & goes back up!\", cur: \"134\", p1: \"98\", p2: \"105\", status: \"Confirmed!\",\n          explanation: \"After touching the line, green candles rally strongly to 134. The trend line is confirmed!\",\n          changed: \"Price bounces off the line and goes back up.\", unchanged: \"3 clean touches confirm the line.\",\n          candles: [[55,108,110,98,100],[80,100,107,99,106],[105,106,115,105,114],[130,114,120,113,118],[155,118,119,110,111],[180,111,112,105,108],[205,108,118,107,117],[230,117,126,116,125],[255,125,126,118,119],[280,119,120,114,115],[305,115,117,112,116],[330,116,124,115,123],[355,123,130,122,129],[380,129,135,128,134]],\n          line: [45,97.4,395,117,false],\n          labels: [[55,98,\"Point 1\",\"bull\",\"bot\"],[180,105,\"Point 2\",\"bull\",\"bot\"],[305,112,\"Touch 3\",\"bull\",\"bot\"],[380,135,\"Goes Back Up\",\"bull\",\"top\"]]\n        }\n      ],\n      checkpoint: [\n        { key: \"q1\", text: \"How many points do you connect to draw a trend line?\", options: [\"2 points\", \"1 point\"], answer: 0, explain: \"Correct: Connect Point 1 and Point 2 to draw the line.\" },\n        { key: \"q2\", text: \"What happens at Touch 3 in a valid trend line?\", options: [\"Price touches the line and goes back\", \"The line disappears\"], answer: 0, explain: \"Correct: Price touches the line and bounces back, confirming it.\" }\n      ]\n    },\n    practice: {\n      prompt: \"Click the 3 bottom
