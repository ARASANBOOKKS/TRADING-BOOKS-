.stages.length}</div>\n        \n        <div class=\"formation-check\" id=\"formationCheck\" hidden>\n          <h3>Quick check</h3>\n          <p>The chart simulation is complete. Tap the correct answer for each question.</p>\n          <div id=\"formationQuiz\"></div>\n        </div>\n      </div>\n      <aside class=\"instructor\" aria-live=\"polite\">\n        <div class=\"instructor-top\">\n          <div>\n            <div class=\"instructor-label\">\u2726 INSTRUCTOR EXPLANATION</div>\n            <h3 id=\"instructorTitle\"></h3>\n            <div class=\"instructor-copy\" id=\"instructorCopy\"></div>\n          </div>\n          <div class=\"change-grid\">\n            <div class=\"change-item\"><strong>WHAT CHANGED</strong><span id=\"changedText\"></span></div>\n            <div class=\"change-item\"><strong>WHAT STAYED THE SAME</strong><span id=\"unchangedText\"></span></div>\n          </div>\n        </div>\n        <div class=\"instructor-foot\">The instructor's explanation updates live with each stage of the chart animation above.</div>\n      </aside>\n    </div>\n  </section>`;\n}\n\nfunction renderPracticeSection() {\n  return `<section class=\"lesson-section\" id=\"practice\">\n    ${sectionHeading(\"05\", \"Your turn \u00b7 Try it yourself on the chart\")}\n    <div class=\"card practice-card\" id=\"practiceBox\"></div>\n  </section>`;\n}\n\nfunction renderQuiz() {\n  return `<section class=\"lesson-section\" id=\"knowledge-check\">\n    ${sectionHeading(\"06\", \"Quick-fire challenge\")}\n    <div id=\"quizContainer\"></div>\n  </section>`;\n}\n\n/* ==========================================================================\n   DEDICATED OVERVIEW CARD VIEW\n   ========================================================================== */\nfunction renderOverviewCard() {\n  stopAnimation();\n  stopIllusAnim();\n  state.view = \"overview\";\n  $(\"#chapterCounter\").textContent = \"OVERVIEW CARD \u00b7 QUICK REFERENCE\";\n  $(\"#lessonContent\").innerHTML = `\n    <header class=\"hero\">\n      <div class=\"hero-topline\"><span class=\"kicker\">SUPPORT &amp; RESISTANCE \u00b7 OVERVIEW CARD</span><span class=\"lesson-pill\">QUICK REFERENCE</span></div>\n      <h1>Support &amp; Resistance Overview</h1>\n      <div class=\"lead\">Everything you learned in one simple reference card: Support Floors, Resistance Ceilings, Strongest Levels, and Role Flips.</div>\n    </header>\n\n    <section class=\"lesson-section\">\n      ${sectionHeading(\"01\", \"The Core Concepts\")}\n      <div class=\"overview-grid\">\n        <article class=\"overview-card\">\n          <span class=\"overview-badge bull\">1. SUPPORT (FLOOR)</span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Support summary\">\n            <rect x=\"20\" y=\"108\" width=\"220\" height=\"18\" rx=\"4\" fill=\"var(--bull-soft)\"/>\n            <line x1=\"20\" y1=\"117\" x2=\"240\" y2=\"117\" stroke=\"var(--bull)\" stroke-width=\"2.8\"/>\n            <polyline points=\"28,45 75,115 130,38 185,115 235,28\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.3\"/>\n            <circle cx=\"75\" cy=\"115\" r=\"5\" fill=\"var(--bull)\" stroke=\"#fff\" stroke-width=\"1.5\"/>\n            <circle cx=\"185\" cy=\"115\" r=\"5\" fill=\"var(--bull)\" stroke=\"#fff\" stroke-width=\"1.5\"/>\n          </svg>\n          <h3>Buyer's Floor Below Price</h3>\n          <p>Drawn <strong>BELOW</strong> the lows. Buyers always look for the lowest price to buy, so the <strong>Lowest Support is the Strongest!</strong></p>\n          <div class=\"overview-rule\">Action: Touches Floor &amp; Bounces UP</div>\n        </article>\n        <article class=\"overview-card\">\n          <span class=\"overview-badge bear\">2. RESISTANCE (CEILING)</span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Resistance summary\">\n            <rect x=\"20\" y=\"28\" width=\"220\" height=\"18\" rx=\"4\" fill=\"var(--bear-soft)\"/>\n            <line x1=\"20\" y1=\"37\" x2=\"240\" y2=\"37\" stroke=\"var(--bear)\" stroke-width=\"2.8\"/>\n            <polyline points=\"28,115 75,39 130,120 185,39 235,128\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.3\"/>\n            <circle cx=\"75\" cy=\"39\" r=\"5\" fill=\"var(--bear)\" stroke=\"#fff\" stroke-width=\"1.5\"/>\n            <circle cx=\"185\" cy=\"39\" r=\"5\" fill=\"var(--bear)\" stroke=\"#fff\" stroke-width=\"1.5\"/>\n          </svg>\n          <h3>Seller's Ceiling Above Price</h3>\n          <p>Drawn <strong>ABOVE</strong> the peaks. Sellers always look for the highest price to sell, so the <strong>Highest Resistance is the Strongest!</strong></p>\n          <div class=\"overview-rule\">Action: Touches Ceiling &amp; Drops DOWN</div>\n        </article>\n        <article class=\"overview-card\">\n          <span class=\"overview-badge flat\">3. BREAKOUT &amp; ROLE FLIP</span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Role Flip summary\">\n            <rect x=\"20\" y=\"72\" width=\"110\" height=\"14\" rx=\"3\" fill=\"var(--bear-soft)\"/>\n            <rect x=\"130\" y=\"72\" width=\"110\" height=\"14\" rx=\"3\" fill=\"var(--bull-soft)\"/>\n            <line x1=\"20\" y1=\"79\" x2=\"240\" y2=\"79\" stroke=\"var(--accent)\" stroke-width=\"2.4\" stroke-dasharray=\"4 3\"/>\n            <polyline points=\"25,130 65,80 105,120 150,32 190,78 235,20\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.3\"/>\n            <circle cx=\"65\" cy=\"80\" r=\"4.5\" fill=\"var(--bear)\"/>\n            <circle cx=\"190\" cy=\"78\" r=\"5\" fill=\"var(--bull)\"/>\n          </svg>\n          <h3>Ceiling \u21c4 Floor Role Flip</h3>\n          <p>When Resistance breaks above, it flips into <strong>New Support</strong>. When Support breaks below, it flips into <strong>New Resistance</strong>!</p>\n          <div class=\"overview-rule\">Rule: Wait for Breakout + Retest</div>\n        </article>\n      </div>\n    </section>\n\n    <section class=\"lesson-section\">\n      ${sectionHeading(\"02\", \"Golden Rules Checklist\")}\n      <div class=\"card info-list\">\n        <article class=\"info-item\"><strong>1. Buyers want the lowest price</strong><p>Buyers always look for the cheapest bargain\u2014making the Lowest Support at the bottom of the chart the strongest floor.</p></article>\n        <article class=\"info-item\"><strong>2. Sellers want the highest price</strong><p>Sellers always look for the highest price\u2014making the Highest Resistance at the top of the chart the strongest ceiling.</p></article>\n        <article class=\"info-item\"><strong>3. Resistance Breakout \u2192 New Support</strong><p>When price breaks above Resistance and comes back down to touch it, the old Ceiling acts as a New Floor.</p></article>\n        <article class=\"info-item\"><strong>4. Support Breakout \u2192 New Resistance</strong><p>When price breaks below Support and bounces back up to touch it, the old Floor acts as a New Ceiling.</p></article>\n      </div>\n    </section>\n\n    <footer class=\"footer-nav\">\n      <button class=\"btn\" id=\"backToCh5\">\u2190 Back to Chapter 05</button>\n      <div class=\"footer-note\">Quick Reference Overview Card</div>\n      <button class=\"btn btn-primary\" id=\"goToYSK\">Next: You Should Know \u2192</button>\n    </footer>\n  `;\n  $(\"#backToCh5\").onclick = () => navigate(4);\n  $(\"#goToYSK\").onclick = () => { playLearningCue(\"click\"); renderYouShouldKnowCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n  renderNavigation();\n}\n\n\nfunction renderYouShouldKnowCard() {\n  stopAnimation();\n  stopIllusAnim();\n  state.view = \"ysk\";\n  $(\"#chapterCounter\").textContent = \"YOU SHOULD KNOW \u00b7 TRADER MINDSET\";\n  $(\"#lessonContent\").innerHTML = `\n    <div class=\"ysk-container\">\n      <header class=\"hero\">\n        <div class=\"hero-topline\"><span class=\"kicker\">SUPPORT &amp; RESISTANCE \u00b7 FINAL NOTE</span><span class=\"lesson-pill\">YOU SHOULD KNOW</span></div>\n        <h1>You Should Know</h1>\n        <div class=\"lead\">Before you move on to your next trading book, keep this honest truth in mind.</div>\n      </header>\n\n      <section class=\"lesson-section\" id=\"topic\">\n        ${sectionHeading(\"\u2605\", \"The Reality of Support & Resistance\")}\n        <div class=\"card prose\">\n          <p><strong>Support and Resistance are not a magic prediction method.</strong> No horizontal line on a chart guarantees where price will go next\u2014that is why breakouts happen!</p>\n          <p><strong>These are the very basics and the foundation of trading.</strong> Every advanced concept you will learn later builds on understanding where buyers step in (Support), where sellers step in (Resistance), and how levels flip when broken.</p>\n          <p><strong>Learning this will help you become a trader in the far future</strong>\u2014if you stay consistent enough to keep learning more about trading, practice with discipline, and build the mindset of the top 1%.</p>\n        </div>\n      </section>\n\n      <section class=\"lesson-section\">\n        ${sectionHeading(\"\u2713\", \"Mindset of the Top 1%\")}\n        <div class=\"card info-list\">\n          <article class=\"info-item\"><strong>1. Not a crystal ball</strong><p>Use Support and Resistance to read structure and stay disciplined\u2014never treat them as a guaranteed prediction tool.</p></article>\n          <article class=\"info-item\"><strong>2. Focus on the strongest levels</strong><p>Remember buyer and seller logic: the lowest Support and highest Resistance matter far more than noisy middle bumps.</p></article>\n          <article class=\"info-item\"><strong>3. Consistency over time</strong><p>Becoming a skilled trader takes time, patience, and steady daily study\u2014not shortcuts or overnight luck.</p></article>\n          <article class=\"info-item\"><strong>4. Keep learning</strong><p>You now know Candlesticks, Trend Lines, and Support &amp; Resistance. Keep studying risk management and psychology!</p></article>\n        </div>\n      </section>\n\n      <div class=\"card quiz-summary\" id=\"finishBanner\" hidden style=\"margin-top:24px;\">\n        <div class=\"result-sparkle\">\ud83c\udf93</div>\n        <div class=\"result-xp\">SUPPORT &amp; RESISTANCE BOOK COMPLETED</div>\n        <h3>Congratulations! You finished the Support &amp; Resistance Book.</h3>\n        <p class=\"prose\">You now know What Support &amp; Resistance Are, the Logic of Strong Support &amp; Strong Resistance, Support Floors, Resistance Ceilings, Breakouts &amp; Role Flip for Resistance, Breakouts &amp; Role Flip for Support, and the Top 1% Mindset!</p>\n        <div class=\"controls\" style=\"justify-content:center;margin-top:16px;\">\n          <button type=\"button\" class=\"btn btn-primary\" id=\"restartBookBtn\">\u21ba Restart from Chapter 01</button>\n        </div>\n      </div>\n\n      <footer class=\"footer-nav\">\n        <button class=\"btn\" id=\"backToOverview\">\u2190 Previous: Overview Card</button>\n        <div class=\"footer-note\">Foundation &amp; Mindset</div>\n        <button class=\"btn btn-primary\" id=\"finishBookBtn\">\u2713 Finish Book</button>\n      </footer>\n    </div>\n  `;\n  $(\"#backToOverview\").onclick = () => { playLearningCue(\"click\"); renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n  $(\"#finishBookBtn\").onclick = () => {\n    playLearningCue(\"finish\");\n    const banner = $(\"#finishBanner\");\n    if (banner) { banner.hidden = false; banner.scrollIntoView({ behavior: \"smooth\", block: \"center\" }); }\n  };\n  $(\"#restartBookBtn\").onclick = () => navigate(0);\n  renderNavigation();\n}\n\nfunction renderLesson(viewMode = \"chapter\") {\n  stopAnimation();\n  stopIllusAnim();\n  state.view = viewMode;\n  if (state.view === \"ysk\") { renderYouShouldKnowCard(); return; }\n  const isLogic = state.view === \"logic\";\n  const lesson = isLogic ? LOGIC_LESSON : LESSONS[state.chapter];\n  $(\"#chapterCounter\").textContent = isLogic ? \"LOGIC CARD \u00b7 STRONG SUPPORT & RESISTANCE\" : `CHAPTER ${lesson.number} / 0${LESSONS.length}`;\n  $(\"#lessonContent\").innerHTML = `\n    <header class=\"hero\">\n      <div class=\"hero-topline\"><span class=\"kicker\">${esc(lesson.kicker)}</span><span class=\"lesson-pill\">${isLogic ? \"LOGIC CARD\" : `LESSON ${state.chapter + 1} OF ${LESSONS.length}`}</span></div>\n      <h1>${esc(lesson.title)}</h1>\n      <div class=\"lead\">${esc(lesson.introduction)}</div>\n      <nav class=\"journey-strip\" aria-label=\"Lesson steps\">\n        <a class=\"journey-step active\" href=\"#topic\"><span>1</span><b>Learn</b></a>\n        <i></i><a class=\"journey-step\" href=\"#illustration\"><span>2</span><b>Illustrate</b></a>\n        <i></i><a class=\"journey-step\" href=\"#animation\"><span>3</span><b>Watch</b></a>\n        <i></i><a class=\"journey-step\" href=\"#knowledge-check\"><span>4</span><b>Quiz</b></a>\n      </nav>\n    </header>\n    ${renderTopic(lesson)}\n    ${renderInformation(lesson)}\n    ${renderIllustration(lesson)}\n    ${renderAnimation(lesson)}\n    ${renderPracticeSection(lesson)}\n    ${renderQuiz()}\n    <footer class=\"footer-nav\">\n      <button class=\"btn\" id=\"previousChapter\" ${!isLogic && state.chapter === 0 ? \"disabled\" : \"\"}>${isLogic ? \"\u2190 Back to Chapter 01\" : state.chapter === 1 ? \"\u2190 Logic & Strong S/R Card\" : \"\u2190 Previous chapter\"}</button>\n      <div class=\"footer-note\">${state.completed.includes(lesson.id) ? \"\u2713 Completed\" : \"Complete the knowledge check to mark this complete.\"}</div>\n      ${isLogic\n        ? `<button class=\"btn btn-primary\" id=\"nextChapter\">Continue to Chapter 02 (Support) \u2192</button>`\n        : state.chapter === 0\n          ? `<button class=\"btn btn-primary\" id=\"nextChapter\">Next: Logic &amp; Strong S/R Card \u2192</button>`\n          : state.chapter < LESSONS.length - 1\n            ? `<button class=\"btn btn-primary\" id=\"nextChapter\">Next chapter \u2192</button>`\n            : `<button class=\"btn btn-primary\" id=\"openOverview\">Open Overview Card \u2192</button>`}\n    </footer>\n    <div class=\"disclaimer\">Educational material only. Support and resistance levels are visual learning tools that help you read price structure; they do not guarantee future price movement or give financial advice.</div>\n  `;\n  bindIllustration();\n  bindAnimation();\n  bindPractice();\n  bindQuiz();\n  $$(\".journey-step\").forEach(link => link.addEventListener(\"click\", event => {\n    const href = link.getAttribute(\"href\");\n    if (href && href.startsWith(\"#\")) {\n      event.preventDefault();\n      playLearningCue(\"click\");\n      $$(\".journey-step\").forEach(el => el.classList.toggle(\"active\", el === link));\n      const targetEl = $(href);\n      if (targetEl) targetEl.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n    }\n  }));\n  $(\"#previousChapter\").addEventListener(\"click\", () => {\n    if (isLogic) navigate(0);\n    else if (state.chapter === 1) openLogicCard();\n    else navigate(state.chapter - 1);\n  });\n  if ($(\"#nextChapter\")) $(\"#nextChapter\").addEventListener(\"click\", () => {\n    if (isLogic) navigate(1);\n    else if (state.chapter === 0) openLogicCard();\n    else navigate(state.chapter + 1);\n  });\n  if ($(\"#openOverview\")) $(\"#openOverview\").addEventListener(\"click\", () => { playLearningCue(\"click\"); renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); });\n  renderNavigation();\n}\n\nfunction renderNavigation() {\n  const nav = $(\"#chapterNav\");\n  nav.innerHTML = LESSONS.map((lesson, index) => {\n    const btn = `<button class=\"chapter-link\" data-chapter=\"${index}\" ${state.view === \"chapter\" && index === state.chapter ? 'aria-current=\"page\"' : ''}>\n      <span class=\"chapter-number\">${lesson.number}</span>\n      <span><strong>${esc(lesson.navTitle)}</strong><small>${esc(lesson.navDescription)}</small>${state.completed.includes(lesson.id) ? '<span class=\"chapter-status\">\u2713 COMPLETED</span>' : ''}</span>\n    </button>`;\n    const logicBtn = index === 0 ? `<button class=\"chapter-link zones-card-btn\" id=\"logicCardBtn\" ${state.view === \"logic\" ? 'aria-current=\"page\"' : ''}>\n      <span class=\"chapter-number\" style=\"color:var(--accent)\">\u2605</span>\n      <span><strong>Logic &amp; Strong S/R</strong><small>Highest Res &amp; Lowest Sup</small>${state.completed.includes(\"logic-strong-sr\") ? '<span class=\"chapter-status\">\u2713 COMPLETED</span>' : ''}</span>\n    </button>` : \"\";\n    return btn + logicBtn;\n  }).join(\"\");\n  $$(\".chapter-link[data-chapter]\", nav).forEach(button => button.addEventListener(\"click\", () => navigate(Number(button.dataset.chapter))));\n  if ($(\"#logicCardBtn\")) $(\"#logicCardBtn\").onclick = () => openLogicCard();\n\n  const ovBtn = $(\"#overviewBtn\");\n  if (ovBtn) {\n    ovBtn.setAttribute(\"aria-current\", state.view === \"overview\" ? \"page\" : \"false\");\n    ovBtn.onclick = () => { playLearningCue(\"click\"); renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n  }\n  const yskBtn = $(\"#youShouldKnowBtn\");\n  if (yskBtn) {\n    yskBtn.setAttribute(\"aria-current\", state.view === \"ysk\" ? \"page\" : \"false\");\n    yskBtn.onclick = () => { playLearningCue(\"click\"); renderYouShouldKnowCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n  }\n\n  $(\"#mobileChapter\").innerHTML = LESSONS.map((lesson, index) => {\n    const opt = `<option value=\"${index}\" ${state.view === \"chapter\" && index === state.chapter ? 'selected' : ''}>${lesson.number} \u2014 ${esc(lesson.navTitle)}</option>`;\n    const lOpt = index === 0 ? `<option value=\"logic\" ${state.view === \"logic\" ? 'selected' : ''}>\u2605 \u2014 Logic &amp; Strong S/R Card</option>` : \"\";\n    return opt + lOpt;\n  }).join(\"\") + `<option value=\"overview\" ${state.view === \"overview\" ? 'selected' : ''}>Overview Card</option><option value=\"ysk\" ${state.view === \"ysk\" ? 'selected' : ''}>You Should Know</option>`;\n  $(\"#mobileChapter\").onchange = event => {\n    if (event.target.value === \"overview\") { renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); }\n    else if (event.target.value === \"ysk\") { renderYouShouldKnowCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); }\n    else if (event.target.value === \"logic\") openLogicCard();\n    else navigate(Number(event.target.value));\n  };\n\n  const mainDone = state.completed.filter(id => id !== \"logic-strong-sr\").length;\n  $(\"#progressLabel\").textContent = `${mainDone} / ${LESSONS.length}`;\n  $(\"#progressFill\").style.width = `${(mainDone / LESSONS.length) * 100}%`;\n  if ($(\"#mobileProgressLabel\")) $(\"#mobileProgressLabel\").textContent = `${mainDone} / ${LESSONS.length} Chapters`;\n  if ($(\"#mobileProgressFill\")) $(\"#mobileProgressFill\").style.width = `${(mainDone / LESSONS.length) * 100}%`;\n}\n\n/* ==========================================================================\n   ILLUSTRATION INTERACTION\n   ========================================================================== */\nfunction stopIllusAnim() {\n  if (state.animIllusTimer) clearInterval(state.animIllusTimer);\n  state.animIllusTimer = null;\n}\n\nfunction bindIllustration() {\n  const lesson = state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter];\n\n  const tabInter = $(\"#tabInteractive\"), tabAnim = $(\"#tabAnimated\");\n  if (tabInter) tabInter.onclick = () => { stopIllusAnim(); state.illusTab = \"interactive\"; rerenderIllustration(); };\n  if (tabAnim) tabAnim.onclick = () => { state.illusTab = \"animated\"; state.animIllusStep = 0; rerenderIllustration(); startIllusAuto(); };\n\n  if (state.illusTab === \"interactive\") {\n    const parts = lesson.diagram.parts;\n    $$(\"[data-part]\").forEach(part => part.addEventListener(\"click\", () => {\n      playLearningCue(\"click\");\n      $$(\"[data-part]\").forEach(el => el.classList.toggle(\"selected\", el === part));\n      const entry = parts[part.dataset.part];\n      if (entry) $(\"#diagramExplanation\").innerHTML = `<strong>${esc(entry[0])}</strong><p>${esc(entry[1])}</p>`;\n    }));\n  } else {\n    const prev = $(\"#prevIllusStep\"), next = $(\"#nextIllusStep\");\n    const total = lesson.animatedIllus.steps.length;\n    if (prev) prev.onclick = () => { stopIllusAnim(); state.animIllusStep = Math.max(0, state.animIllusStep - 1); playLearningCue(\"step\"); rerenderIllustration(); };\n    if (next) next.onclick = () => { stopIllusAnim(); state.animIllusStep = state.animIllusStep >= total - 1 ? 0 : state.animIllusStep + 1; playLearningCue(\"step\"); rerenderIllustration(); };\n  }\n}\n\nfunction startIllusAuto() {\n  stopIllusAnim();\n  const lesson = state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter];\n  if (!lesson.animatedIllus || state.illusTab !== \"animated\") return;\n  state.animIllusTimer = setInterval(() => {\n    if ((state.view !== \"chapter\" && state.view !== \"logic\") || state.illusTab !== \"animated\") { stopIllusAnim(); return; }\n    const total = lesson.animatedIllus.steps.length;\n    state.animIllusStep = (state.animIllusStep + 1) % total;\n    rerenderIllustration();\n  }, 2600);\n}\n\nfunction rerenderIllustration() {\n  const sec = $(\"#illustration\");\n  if (!sec) return;\n  const tmp = document.createElement(\"div\");\n  tmp.innerHTML = renderIllustration(state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter]);\n  sec.replaceWith(tmp.firstElementChild);\n  bindIllustration();\n}\n\n/* ==========================================================================\n   BOOSTED AUDIO VOLUME CUES\n   ========================================================================== */\nfunction playLearningCue(kind = \"step\") {\n  try {\n    const AudioContextClass = window.AudioContext || window.webkitAudioContext;\n    if (!AudioContextClass) return;\n    state.audioContext = state.audioContext || new AudioContextClass();\n    const ctx = state.audioContext;\n    if (ctx.state === \"suspended\") ctx.resume();\n    const now = ctx.currentTime;\n    const patterns = {\n      step: [[520, .08, 0, \"triangle\"]],\n      correct: [[523, .13, 0, \"triangle\"], [659, .15, .09, \"triangle\"], [784, .22, .19, \"triangle\"]],\n      wrong: [[330, .14, 0, \"triangle\"], [260, .20, .10, \"triangle\"]],\n      finish: [[523, .15, 0, \"triangle\"], [659, .15, .10, \"triangle\"], [784, .20, .20, \"triangle\"], [1046, .30, .32, \"triangle\"]],\n      click: [[620, .06, 0, \"triangle\"]]\n    };\n    const comp = ctx.createDynamicsCompressor();\n    comp.threshold.setValueAtTime(-12, now);\n    comp.ratio.setValueAtTime(6, now);\n    comp.connect(ctx.destination);\n    (patterns[kind] || patterns.step).forEach(([frequency, duration, delay, wave]) => {\n      const osc = ctx.createOscillator(), gain = ctx.createGain();\n      const startAt = now + delay;\n      osc.type = wave;\n      osc.frequency.setValueAtTime(frequency, startAt);\n      gain.gain.setValueAtTime(.0001, startAt);\n      gain.gain.exponentialRampToValueAtTime(kind === \"finish\" ? .52 : .42, startAt + .015);\n      gain.gain.exponentialRampToValueAtTime(.0001, startAt + duration);\n      osc.connect(gain); gain.connect(comp);\n      osc.start(startAt); osc.stop(startAt + duration + .03);\n    });\n  } catch {}\n}\n\n/* ==========================================================================\n   TRADING CHART SIMULATOR\n   ========================================================================== */\nfunction stopAnimation() {\n  state.playing = false;\n  if (state.timer) clearTimeout(state.timer);\n  state.timer = null;\n  const button = $(\"#playPause\");\n  if (button) button.textContent = \"\u25b6 Play\";\n}\n\nfunction drawSimulation() {\n  const config = (state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!config) return;\n  const step = config.stages[state.stage];\n\n  $(\"#simSvg\").innerHTML = renderCandleChartSVG({\n    candles: step.candles,\n    line: step.line || null,\n    line2: step.line2 || null,\n    hz: step.hz !== undefined ? step.hz : null,\n    hz2: step.hz2 !== undefined ? step.hz2 : null,\n    zone: step.zone || null,\n    zone2: step.zone2 || null,\n    labels: step.labels || [],\n    arrows: step.arrows || [],\n    min: config.min,\n    max: config.max,\n    stageTitle: `STAGE ${state.stage + 1}/${config.stages.length} \u00b7 ${step.title}`,\n    statusBadge: step.status\n  });\n  $(\"#stageTitle\").textContent = step.title;\n  $(\"#readCur\").textContent = step.cur;\n  $(\"#readP1\").textContent = step.p1;\n  $(\"#readP2\").textContent = step.p2;\n  $(\"#readStatus\").textContent = step.status;\n  $(\"#instructorTitle\").textContent = step.title;\n  $(\"#instructorCopy\").textContent = step.explanation;\n  if ($(\"#mobileLiveNote\")) $(\"#mobileLiveNote\").textContent = \"\u2726 \" + step.explanation;\n  $(\"#changedText\").textContent = step.changed;\n  $(\"#unchangedText\").textContent = step.unchanged;\n  $(\"#stageCount\").textContent = `Stage ${state.stage + 1} of ${config.stages.length}`;\n  $(\"#stageTrack\").innerHTML = config.stages.map((_, i) => `<span class=\"stage-segment ${i <= state.stage ? 'active' : ''}\"></span>`).join(\"\");\n  $(\"#previousStage\").disabled = state.stage === 0;\n  $(\"#nextStage\").disabled = state.stage === config.stages.length - 1;\n}\n\nfunction showFormationCheckpoint() {\n  const panel = $(\"#formationCheck\");\n  if (!panel || !panel.hidden) return;\n  panel.hidden = false;\n  playLearningCue(\"finish\");\n  renderFormationCheckpoint();\n}\n\nfunction renderFormationCheckpoint() {\n  const config = (state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!config) return;\n  const questions = config.checkpoint;\n  const target = $(\"#formationQuiz\");\n  if (!target) return;\n  target.innerHTML = questions.map((q, index) => {\n    const chosen = state.formationAnswers[q.key];\n    return `<div class=\"formation-question\">${index + 1}. ${esc(q.text)}</div>\n      <div class=\"answer-list\">${q.options.map((option, choice) => {\n        const cls = chosen === undefined ? \"\" : choice === q.answer ? \"correct\" : chosen === choice ? \"incorrect\" : \"\";\n        return `<button type=\"button\" class=\"answer-option ${cls}\" data-form-key=\"${q.key}\" data-form-choice=\"${choice}\" ${chosen !== undefined ? \"disabled\" : \"\"}>${String.fromCharCode(65 + choice)}. ${esc(option)}</button>`;\n      }).join(\"\")}</div>\n      ${chosen !== undefined ? `<div class=\"formation-feedback ${chosen === q.answer ? \"good\" : \"bad\"}\">${esc(q.explain)}</div>` : \"\"}`;\n  }).join(\"\");\n  if (Object.keys(state.formationAnswers).length === questions.length) {\n    const score = questions.filter(q => state.formationAnswers[q.key] === q.answer).length;\n    target.innerHTML += `<p class=\"formation-feedback\"><strong>${score} out of ${questions.length} correct.</strong> ${score === questions.length ? \"Great job!\" : \"Replay the chart and try again.\"}</p>\n      <button type=\"button\" class=\"btn\" id=\"formationTryAgain\">Try these questions again</button>`;\n    $(\"#formationTryAgain\").onclick = () => { state.formationAnswers = {}; renderFormationCheckpoint(); };\n  }\n  $$(\"[data-form-key]\", target).forEach(button => button.onclick = () => {\n    const key = button.dataset.formKey;\n    if (state.formationAnswers[key] !== undefined) return;\n    const q = questions.find(item => item.key === key);\n    state.formationAnswers[key] = Number(button.dataset.formChoice);\n    playLearningCue(state.formationAnswers[key] === q.answer ? \"correct\" : \"wrong\");\n    renderFormationCheckpoint();\n  });\n}\n\nfunction setStage(index) {\n  const config = (state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!config) return;\n  const next = Math.max(0, Math.min(config.stages.length - 1, index));\n  if (next === state.stage) return;\n  state.stage = next;\n  playLearningCue(\"step\");\n  drawSimulation();\n  if (state.stage === config.stages.length - 1) showFormationCheckpoint();\n}\n\nfunction advanceAnimation() {\n  const config = (state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!state.playing || !config) return;\n  if (state.stage >= config.stages.length - 1) { stopAnimation(); showFormationCheckpoint(); return; }\n  state.timer = setTimeout(() => {\n    if (!state.playing) return;\n    setStage(state.stage + 1);\n    if (state.stage >= config.stages.length - 1) { stopAnimation(); showFormationCheckpoint(); }\n    else advanceAnimation();\n  }, 2000 / state.speed);\n}\n\nfunction bindAnimation() {\n  const config = (state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!config) return;\n  state.stage = 0; state.speed = 1; state.formationAnswers = {};\n  $(\"#formationCheck\").hidden = true;\n  drawSimulation();\n  $(\"#previousStage\").onclick = () => { stopAnimation(); setStage(state.stage - 1); };\n  $(\"#nextStage\").onclick = () => { stopAnimation(); setStage(state.stage + 1); };\n  $(\"#playPause\").onclick = () => {\n    if (state.playing) { stopAnimation(); return; }\n    if (state.stage === config.stages.length - 1) {\n      state.stage = 0;\n      state.formationAnswers = {};\n      if ($(\"#formationCheck\")) $(\"#formationCheck\").hidden = true;\n      drawSimulation();\n    }\n    state.playing = true; $(\"#playPause\").textContent = \"\u2161 Pause\"; advanceAnimation();\n  };\n  $(\"#replay\").onclick = () => { stopAnimation(); state.stage = 0; state.formationAnswers = {}; $(\"#formationCheck\").hidden = true; drawSimulation(); };\n  $(\"#speedSelect\").onchange = event => {\n    state.speed = Number(event.target.value);\n    if (state.playing) { stopAnimation(); state.playing = true; $(\"#playPause\").textContent = \"\u2161 Pause\"; advanceAnimation(); }\n  };\n}\n\n/* ==========================================================================\n   INTERACTIVE CHART PRACTICE (TRY IT YOURSELF \u2014 WIDE 800x410 CANVAS)\n   ========================================================================== */\nfunction bindPractice() {\n  state.practiceLevel = 0;\n  state.practiceLevelsCleared = [];\n  state.practiceFound = [];\n  state.practiceMsg = \"\";\n  state.practiceState = \"\";\n  renderPractice();\n}\n\nfunction renderPractice() {\n  const lesson = state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter];\n  const box = $(\"#practiceBox\");\n  if (!box) return;\n\n  const h = 420, padTop = 78, padBot = 78, candleLeft = 88, candleRight = 606;\n  const sx = x => Math.round((candleLeft + ((x - 36) / 356) * (candleRight - candleLeft)) * 10) / 10;\n\n  // Chapter 01: 3-Level Progressive Try It Yourself (1st Support, 2nd Resistance, 3rd Both)\n  if (lesson.practiceType === \"three-level-sr\") {\n    const lvIdx = state.practiceLevel;\n    const lv = lesson.practiceLevels[lvIdx];\n    const y = v => Math.round(((h - padBot) - ((v - lv.min) / Math.max(1, lv.max - lv.min)) * (h - padTop - padBot)) * 10) / 10;\n\n    const foundCount = state.practiceFound.length;\n    const totalCount = lv.targets.length;\n    const allFound = foundCount === totalCount;\n\n    const supTargets = lv.targets.filter(t => t.role === \"sup\");\n    const resTargets = lv.targets.filter(t => t.role === \"res\");\n    const supFound = supTargets.filter(t => state.practiceFound.includes(t.id));\n    const resFound = resTargets.filter(t => state.practiceFound.includes(t.id));\n\n    let drawnSupLine = null;\n    if (supFound.length >= 2) {\n      drawnSupLine = supFound.length === supTargets.length\n        ? [...lv.supLine, false]\n        : [supFound[0].x, supFound[0].p, supFound[1].x, supFound[1].p, true];\n    }\n    let drawnResLine = null;\n    if (resFound.length >= 2) {\n      drawnResLine = resFound.length === resTargets.length\n        ? [...lv.resLine, false]\n        : [resFound[0].x, resFound[0].p, resFound[1].x, resFound[1].p, true];\n    }\n\n    const activeSupZone = supTargets.length > 0 && supFound.length === supTargets.length ? lv.supZone : null;\n    const activeResZone = resTargets.length > 0 && resFound.length === resTargets.length ? lv.resZone : null;\n\n    const labels = state.practiceFound.map(id => {\n      const t = lv.targets.find(item => item.id === id);\n      return [t.x, t.p, t.label, t.role === \"res\" ? \"bear\" : \"bull\", t.role === \"res\" ? \"top\" : \"bot\"];\n    });\n\n    const hotspots = [...lv.targets, ...lv.decoys].map(pt => {\n      const isHit = state.practiceFound.includes(pt.id);\n      const cx = sx(pt.x), cy = y(pt.p);\n      const hitCol = pt.role === \"res\" ? \"var(--bear)\" : \"var(--bull)\";\n      return `<g class=\"swing-hotspot\" data-pt=\"${pt.id}\">\n        <circle class=\"ring ${isHit ? '' : 'svg-hotspot-pulse'}\" cx=\"${cx}\" cy=\"${cy}\" r=\"${isHit ? 15 : 18}\" fill=\"${isHit ? 'rgba(21,150,106,.26)' : 'rgba(49,95,206,.16)'}\" stroke=\"${isHit ? hitCol : 'var(--accent)'}\" stroke-width=\"3\" stroke-dasharray=\"${isHit ? 'none' : '5 3'}\"/>\n      </g>`;\n    }).join(\"\");\n\n    box.innerHTML = `\n      <div class=\"practice-level-tabs\" role=\"tablist\" aria-label=\"Practice levels\">\n        ${lesson.practiceLevels.map((item, idx) => {\n          const isDone = state.practiceLevelsCleared.includes(idx);\n          return `<button type=\"button\" class=\"practice-level-btn ${idx === lvIdx ? \"active\" : \"\"} ${isDone ? \"done\" : \"\"}\" data-lv=\"${idx}\">\n            ${isDone ? \"\u2713 \" : \"\"}${esc(item.title)}\n          </button>`;\n        }).join(\"\")}\n      </div>\n      <div class=\"practice-top\">\n        <p class=\"practice-prompt\">${esc(lv.prompt)}</p>\n        <span class=\"sim-tag\">${foundCount} / ${totalCount} SELECTED</span>\n      </div>\n      <svg class=\"practice-svg\" viewBox=\"0 0 820 420\" role=\"img\" aria-label=\"${esc(lv.title)}\">\n        ${renderCandleChartSVG({\n          candles: lv.candles,\n          line: drawnSupLine,\n          line2: drawnResLine,\n          zone: activeResZone,\n          zone2: activeSupZone,\n          labels,\n          min: lv.min,\n          max: lv.max,\n          stageTitle: `TRY IT YOURSELF \u00b7 ${lv.title.toUpperCase()}`,\n          statusBadge: `${foundCount} / ${totalCount} MARKED`\n        })}\n        ${hotspots}\n      </svg>\n      <div class=\"practice-status ${allFound ? 'good' : state.practiceState}\">${esc(allFound ? lv.successMsg : (state.practiceMsg || \"Tap the pulsing circles on the candles to mark the required level.\"))}</div>\n      <div class=\"practice-actions\">\n        <button type=\"button\" class=\"btn\" id=\"resetPractice\">\u21ba Reset Level</button>\n        ${allFound && lvIdx < lesson.practiceLevels.length - 1\n          ? `<button type=\"button\" class=\"btn btn-primary\" id=\"nextPracticeLevel\">Next Level (${lvIdx + 2} of 3) \u2192</button>`\n          : \"\"}\n      </div>\n    `;\n\n    $$(\"[data-lv]\", box).forEach(btn => btn.onclick = () => {\n      playLearningCue(\"click\");\n      state.practiceLevel = Number(btn.dataset.lv);\n      state.practiceFound = [];\n      state.practiceMsg = \"\";\n      state.practiceState = \"\";\n      renderPractice();\n    });\n\n    $$(\"[data-pt]\", box).forEach(el => el.onclick = () => {\n      const id = el.dataset.pt;\n      if (state.practiceFound.includes(id)) return;\n      const targetObj = lv.targets.find(t => t.id === id);\n      if (targetObj) {\n        state.practiceFound.push(id);\n        const nowAll = state.practiceFound.length === lv.targets.length;\n        if (nowAll && !state.practiceLevelsCleared.includes(lvIdx)) {\n          state.practiceLevelsCleared.push(lvIdx);\n        }\n        playLearningCue(nowAll ? \"finish\" : \"correct\");\n        state.practiceState = \"good\";\n        state.practiceMsg = nowAll\n          ? lv.successMsg\n          : `Good! (${state.practiceFound.length} of ${lv.targets.length} points marked). Keep clicking!`;\n      } else {\n        playLearningCue(\"wrong\");\n        state.practiceState = \"warn\";\n        state.practiceMsg = lv.wrongMsg;\n      }\n      renderPractice();\n    });\n\n    $(\"#resetPractice\").onclick = () => {\n      playLearningCue(\"click\");\n      state.practiceFound = [];\n      state.practiceMsg = \"\";\n      state.practiceState = \"\";\n      renderPractice();\n    };\n    if ($(\"#nextPracticeLevel\")) {\n      $(\"#nextPracticeLevel\").onclick = () => {\n        playLearningCue(\"click\");\n        state.practiceLevel = Math.min(lesson.practiceLevels.length - 1, lvIdx + 1);\n        state.practiceFound = [];\n        state.practiceMsg = \"\";\n        state.practiceState = \"\";\n        renderPractice();\n      };\n    }\n    return;\n  }\n\n  // \u2605 Logic Card Practice: Spot Strongest Support & Strongest Resistance\n  if (lesson.practiceType === \"spot-strong-sr\") {\n    const qs = [\n      {\n        prompt: \"Question 1: Look at the two Support levels (114 in the middle vs. 98 at the very bottom). Which Support is the STRONGEST?\",\n        candles: [[55,112,113,98,103],[95,103,124,102,122],[135,122,123,114,116],[175,116,136,115,134],[215,134,135,98,104],[255,104,128,103,126]],\n        zone2: [96.5, 99.5, \"bull\", \"LOWEST SUPPORT (98)\"],\n        hz2: 114,\n        labels: [[55,98,\"Lowest Support: 98\",\"bull\",\"bot\"],[135,114,\"Middle Support: 114\",\"focus\",\"bot\"],[215,98,\"Bounce at 98!\",\"bull\",\"bot\"]],\n        ans: \"low\",\n        explain: \"Correct! Buyers ALWAYS look for the lowest price to buy, so the Lowest Support (98) is the strongest!\"\n      },\n      {\n        prompt: \"Question 2: Look at the two Resistance levels (122 in the middle vs. 140 at the very top). Which Resistance is the STRONGEST?\",\n        candles: [[55,126,140,125,135],[95,135,136,112,114],[135,114,122,113,118],[175,118,119,102,104],[215,104,140,103,134],[255,134,135,110,112]],\n        zone: [138.5, 141.5, \"bear\", \"HIGHEST RESISTANCE (140)\"],\n        hz: 122,\n        labels: [[55,140,\"Highest Resistance: 140\",\"bear\",\"top\"],[135,122,\"Middle Resistance: 122\",\"focus\",\"top\"],[215,140,\"Reject at 140!\",\"bear\",\"top\"]],\n        ans: \"high\",\n        explain: \"Correct! Sellers ALWAYS look for the highest price to sell, so the Highest Resistance (140) is the strongest!\"\n      }\n    ];\n    const idx = state.practiceFound.length % qs.length;\n    const item = qs[idx];\n    box.innerHTML = `\n      <div class=\"practice-top\"><p class=\"practice-prompt\">${esc(item.prompt)}</p></div>\n      <svg class=\"practice-svg\" viewBox=\"0 0 820 420\" role=\"img\" aria-label=\"Strongest Support and Resistance practice\">\n        ${renderCandleChartSVG({\n          candles: item.candles,\n          zone: item.zone || null,\n          zone2: item.zone2 || null,\n          hz: item.hz || null,\n          hz2: item.hz2 || null,\n          labels: item.labels,\n          min: 92,\n          max: 146,\n          stageTitle: `LOGIC CHECK \u00b7 QUESTION ${idx + 1} OF 2`,\n          statusBadge: \"SPOT STRONGEST\"\n        })}\n      </svg>\n      <div class=\"practice-actions\">\n        <button type=\"button\" class=\"btn\" data-schoice=\"low\">The LOWEST Support (98) \u2014 Buyers want lowest price</button>\n        <button type=\"button\" class=\"btn\" data-schoice=\"high\">The HIGHEST Resistance (140) \u2014 Sellers want highest price</button>\n        <button type=\"button\" class=\"btn\" data-schoice=\"mid\">The middle level (114 / 122)</button>\n        <button type=\"button\" class=\"btn btn-primary\" id=\"nextStrongQ\" style=\"margin-left:auto\">Next Question \u2192</button>\n      </div>\n      <div class=\"practice-status ${state.practiceState}\">${esc(state.practiceMsg || \"Tap the strongest level above.\")}</div>\n    `;\n    $$(\"[data-schoice]\", box).forEach(btn => btn.onclick = () => {\n      const ok = btn.dataset.schoice === item.ans;\n      playLearningCue(ok ? \"correct\" : \"wrong\");\n      state.practiceState = ok ? \"good\" : \"warn\";\n      state.practiceMsg = ok ? item.explain : \"Remember the logic: Buyers want the LOWEST price, and Sellers want the HIGHEST price!\";\n      renderPractice();\n    });\n    $(\"#nextStrongQ\").onclick = () => {\n      playLearningCue(\"click\");\n      state.practiceFound.push(idx);\n      state.practiceMsg = \"\";\n      state.practiceState = \"\";\n      renderPractice();\n    };\n    return;\n  }\n\n  // Click-to-draw horizontal zone on candlestick chart (Chapters 02, 03, 04, 05)\n  const p = lesson.practice;\n  const y = v => Math.round(((h - padBot) - ((v - p.min) / Math.max(1, p.max - p.min)) * (h - padTop - padBot)) * 10) / 10;\n  const foundCount = state.practiceFound.length;\n  const allFound = foundCount === p.targets.length;\n\n  let drawnLine = null;\n  if (foundCount >= 2) {\n    drawnLine = allFound\n      ? [...p.lineExtend, false]\n      : [p.targets[0].x, p.targets[0].p, p.targets[1].x, p.targets[1].p, true];\n  }\n\n  const activeZone = allFound && p.zoneBand ? p.zoneBand : null;\n\n  const labels = state.practiceFound.map(id => {\n    const t = p.targets.find(item => item.id === id);\n    return [t.x, t.p, t.label, p.lineColor === \"bear\" ? \"bear\" : \"bull\", p.lineColor === \"bear\" ? \"top\" : \"bot\"];\n  });\n\n  const hotspots = [...p.targets, ...p.decoys].map(pt => {\n    const isHit = state.practiceFound.includes(pt.id);\n    const cx = sx(pt.x), cy = y(pt.p);\n    return `<g class=\"swing-hotspot\" data-pt=\"${pt.id}\">\n      <circle class=\"ring ${isHit ? '' : 'svg-hotspot-pulse'}\" cx=\"${cx}\" cy=\"${cy}\" r=\"${isHit ? 15 : 18}\" fill=\"${isHit ? 'rgba(21,150,106,.26)' : 'rgba(49,95,206,.16)'}\" stroke=\"${isHit ? 'var(--bull)' : 'var(--accent)'}\" stroke-width=\"3\" stroke-dasharray=\"${isHit ? 'none' : '5 3'}\"/>\n    </g>`;\n  }).join(\"\");\n\n  box.innerHTML = `\n    <div class=\"practice-top\">\n      <p class=\"practice-prompt\">${esc(p.prompt)}</p>\n      <span class=\"sim-tag\">${foundCount} / ${p.targets.length} TOUCHES SELECTED</span>\n    </div>\n    <svg class=\"practice-svg\" viewBox=\"0 0 820 420\" role=\"img\" aria-label=\"Click touches to draw Support or Resistance\">\n      ${renderCandleChartSVG({\n        candles: p.candles,\n        line: p.lineColor === \"bear\" ? null : drawnLine,\n        line2: p.lineColor === \"bear\" ? drawnLine : null,\n        zone: p.lineColor === \"bear\" ? activeZone : null,\n        zone2: p.lineColor === \"bear\" ? null : activeZone,\n        labels,\n        min: p.min,\n        max: p.max,\n        stageTitle: `TRY IT YOURSELF \u00b7 CLICK THE 3 TOUCHES`,\n        statusBadge: `${foundCount} / ${p.targets.length} MARKED`\n      })}\n      ${hotspots}\n    </svg>\n    <div class=\"practice-status ${allFound ? 'good' : state.practiceState}\">${esc(allFound ? p.successMsg : (state.practiceMsg || \"Tap the large pulsing circles at the key turning points on the candles.\"))}</div>\n    <div class=\"practice-actions\">\n      <button type=\"button\" class=\"btn\" id=\"resetPractice\">\u21ba Reset Chart</button>\n    </div>\n  `;\n\n  $$(\"[data-pt]\", box).forEach(el => el.onclick = () => {\n    const id = el.dataset.pt;\n    if (state.practiceFound.includes(id)) return;\n    const isTarget = p.targets.some(t => t.id === id);\n    if (isTarget) {\n      state.practiceFound.push(id);\n      playLearningCue(state.practiceFound.length === p.targets.length ? \"finish\" : \"correct\");\n      state.practiceState = \"good\";\n      state.practiceMsg = state.practiceFound.length === 1\n        ? \"Point 1 selected! Now click the second point at that same horizontal level.\"\n        : state.practiceFound.length === 2\n          ? \"Line drawn! Now click the 3rd point to confirm!\"\n          : p.successMsg;\n    } else {\n      playLearningCue(\"wrong\");\n      state.practiceState = \"warn\";\n      state.practiceMsg = \"That point is not on the horizontal level! Click the 3 aligned touches.\";\n    }\n    renderPractice();\n  });\n  $(\"#resetPractice\").onclick = () => { playLearningCue(\"click\"); bindPractice(); };\n}\n\n/* ==========================================================================\n   KNOWLEDGE CHECK\n   ========================================================================== */\nfunction bindQuiz() {\n  state.quizIndex = 0; state.answers = {};\n  renderQuizQuestion();\n}\nfunction renderQuizQuestion() {\n  const lesson = state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter], questions = lesson.quiz, container = $(\"#quizContainer\");\n  if (state.quizIndex >= questions.length) { renderQuizSummary(); return; }\n  const q = questions[state.quizIndex], chosen = state.answers[state.quizIndex];\n  container.innerHTML = `\n    <div class=\"card quiz-card\">\n      <div class=\"quiz-topline\"><div class=\"quiz-meta\">QUICK CHALLENGE \u00b7 ${state.quizIndex + 1} OF ${questions.length}</div><div class=\"quiz-xp\">\u2726 +10 XP</div></div>\n      <div class=\"quiz-progress\"><span style=\"width:${(state.quizIndex / questions.length) * 100}%\"></span></div>\n      <div class=\"quiz-question\">${esc(q.question)}</div>\n      <div class=\"answer-list\">${q.options.map((option, index) => {\n        let cls = \"\";\n        if (chosen !== undefined && index === q.answer) cls = \"correct\";\n        else if (chosen === index) cls = \"incorrect\";\n        return `<button class=\"answer-option ${cls}\" data-answer=\"${index}\" ${chosen !== undefined ? \"disabled\" : \"\"}>${String.fromCharCode(65 + index)}. ${esc(option)}</button>`;\n      }).join(\"\")}</div>\n      ${chosen !== undefined ? `<div class=\"feedback ${chosen === q.answer ? 'good' : 'bad'}\">${chosen === q.answer ? 'Correct.' : 'Not quite.'} ${esc(q.explanation)}</div>\n      <div class=\"quiz-footer\"><span class=\"stage-count\">Answer recorded</span><button class=\"btn btn-primary\" id=\"quizContinue\">${state.quizIndex === questions.length - 1 ? \"View results\" : \"Next question \u2192\"}</button></div>` : \"\"}\n    </div>`;\n  $$(\"[data-answer]\", container).forEach(button => button.onclick = () => {\n    if (state.answers[state.quizIndex] !== undefined) return;\n    state.answers[state.quizIndex] = Number(button.dataset.answer);\n    playLearningCue(Number(button.dataset.answer) === q.answer ? \"correct\" : \"wrong\");\n    renderQuizQuestion();\n  });\n  const next = $(\"#quizContinue\", container);\n  if (next) next.onclick = () => { playLearningCue(\"click\"); state.quizIndex++; renderQuizQuestion(); };\n}\nfunction renderQuizSummary() {\n  const lesson = state.view === \"logic\" ? LOGIC_LESSON : LESSONS[state.chapter], score = lesson.quiz.filter((q, index) => state.answers[index] === q.answer).length;\n  const passed = score === lesson.quiz.length;\n  if (passed && !state.completed.includes(lesson.id)) { state.completed.push(lesson.id); saveProgress(); renderNavigation(); playLearningCue(\"finish\"); }\n  else if (!passed) playLearningCue(\"wrong\");\n  $(\"#quizContainer\").innerHTML = `\n    <div class=\"card quiz-summary\">\n      <div class=\"result-sparkle\">${passed ? \"\ud83c\udfc6\" : \"\ud83d\udca1\"}</div>\n      <div class=\"score\">${score} / ${lesson.quiz.length}</div>\n      <div class=\"result-xp\">${passed ? \"CHAPTER CLEARED \u00b7 +30 XP\" : \"KEEP PRACTISING \u00b7 YOU CAN RETRY\"}</div>\n      <h3>${passed ? \"Chapter knowledge check passed\" : \"Assessment completed\"}</h3>\n      <p class=\"prose\">${passed ? \"Excellent. You answered every question correctly, and this chapter is now marked complete.\" : \"Review the explanations and retake the assessment. Answer all three correctly to complete the chapter.\"}</p>\n      <div class=\"controls\" style=\"justify-content:center;margin-top:17px\">\n        <button class=\"btn btn-primary\" id=\"retakeQuiz\">\u21ba Retake assessment</button>\n        ${state.view === 'logic' ? '<button class=\"btn\" id=\"summaryCh2\">Continue to Chapter 02 \u2192</button>' : state.chapter < LESSONS.length - 1 ? '<button class=\"btn\" id=\"summaryNext\">Next chapter \u2192</button>' : '<button class=\"btn\" id=\"summaryOverview\">Open Overview Card \u2192</button>'}\n      </div>\n    </div>`;\n  $(\"#retakeQuiz\").onclick = () => { playLearningCue(\"click\"); state.quizIndex = 0; state.answers = {}; renderQuizQuestion(); };\n  if ($(\"#summaryCh2\")) $(\"#summaryCh2\").onclick = () => navigate(1);\n  if ($(\"#summaryNext\")) $(\"#summaryNext\").onclick = () => state.chapter === 0 ? openLogicCard() : navigate(state.chapter + 1);\n  if ($(\"#summaryOverview\")) $(\"#summaryOverview\").onclick = () => { renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n}\nfunction openLogicCard() {\n  playLearningCue(\"click\");\n  state.illusTab = \"interactive\";\n  state.animIllusStep = 0;\n  renderLesson(\"logic\");\n  window.scrollTo({ top: 0, behavior: \"smooth\" });\n}\nfunction navigate(index) {\n  if (index < 0 || index >= LESSONS.length) return;\n  stopAnimation(); stopIllusAnim();\n  state.chapter = index; state.illusTab = \"interactive\"; state.animIllusStep = 0;\n  renderLesson(); window.scrollTo({ top: 0, behavior: \"smooth\" });\n}\n\n/* ==========================================================================\n   INITIALIZATION & THEME TOGGLE\n   ========================================================================== */\nfunction applyTheme(theme) {\n  document.documentElement.setAttribute(\"data-theme\", theme);\n  try { localStorage.setItem(\"sr-book-theme\", theme); } catch {}\n  const label = theme === \"dark\" ? \"\u2600\ufe0f Light\" : \"\ud83c\udf19 Dark\";\n  if ($(\"#desktopThemeToggle\")) $(\"#desktopThemeToggle\").textContent = label;\n  if ($(\"#mobileThemeToggle\")) $(\"#mobileThemeToggle\").textContent = label;\n}\nfunction toggleTheme() {\n  const cur = document.documentElement.getAttribute(\"data-theme\") === \"dark\" ? \"dark\" : \"light\";\n  playLearningCue(\"click\");\n  applyTheme(cur === \"dark\" ? \"light\" : \"dark\");\n}\n(function initTheme() {\n  let saved = \"light\";\n  try { saved = localStorage.getItem(\"sr-book-theme\") || \"light\"; } catch {}\n  applyTheme(saved);\n  if ($(\"#desktopThemeToggle\")) $(\"#desktopThemeToggle\").onclick = toggleTheme;\n  if ($(\"#mobileThemeToggle\")) $(\"#mobileThemeToggle\").onclick = toggleTheme;\n})();\n\nrenderLesson();\n<\/script>\n</body>\n</html>";

/* --- 1E: PLATFORM WEB AUDIO SOUND SYSTEM --- */
// TRADING BOOKS Platform Web Audio Sound System
let platformAudioCtx = null;
function playPlatformSound(type = 'click', enabled = true) {
  if (!enabled || typeof window === 'undefined') return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!platformAudioCtx) platformAudioCtx = new AudioCtx();
    if (platformAudioCtx.state === 'suspended') platformAudioCtx.resume();
    const now = platformAudioCtx.currentTime;
    const filter = platformAudioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2800, now);
    const comp = platformAudioCtx.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-10, now);
    comp.ratio.setValueAtTime(4, now);
    filter.connect(comp);
    comp.connect(platformAudioCtx.destination);
    const presets = {
      click: [[587.33, 0.055, 0, 'sine', 0, 0.045]],
      nav: [[523.25, 0.07, 0, 'triangle', -0.1, 0.055], [659.25, 0.095, 0.045, 'sine', 0.1, 0.06]],
      category: [[587.33, 0.05, 0, 'sine', -0.08, 0.045], [783.99, 0.07, 0.035, 'sine', 0.08, 0.045]],
      bookmarkSave: [[523.25, 0.075, 0, 'triangle', -0.15, 0.06], [659.25, 0.09, 0.055, 'triangle', 0, 0.06], [880, 0.14, 0.11, 'sine', 0.15, 0.065]],
      bookmarkRemove: [[587.33, 0.07, 0, 'sine', 0.1, 0.05], [440, 0.11, 0.055, 'triangle', -0.1, 0.05]],
      openBook: [[440, 0.09, 0, 'triangle', -0.18, 0.065], [554.37, 0.11, 0.06, 'triangle', 0, 0.065], [659.25, 0.16, 0.12, 'sine', 0.18, 0.075]],
      closeBook: [[659.25, 0.07, 0, 'sine', 0.12, 0.05], [493.88, 0.11, 0.05, 'triangle', -0.12, 0.05]],
      fullscreen: [[523.25, 0.07, 0, 'sine', -0.15, 0.055], [783.99, 0.12, 0.05, 'triangle', 0.15, 0.065]],
      modal: [[493.88, 0.06, 0, 'sine', -0.1, 0.05], [739.99, 0.09, 0.04, 'sine', 0.1, 0.05]]
    };
    (presets[type] || presets.click).forEach(([freq, dur, delay, wave, pan, peakGain]) => {
      const start = now + delay;
      const osc = platformAudioCtx.createOscillator();
      const gain = platformAudioCtx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(Math.min(0.65, peakGain * 6.0), start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain);
      if (platformAudioCtx.createStereoPanner) {
        const panner = platformAudioCtx.createStereoPanner();
        panner.pan.setValueAtTime(pan, start);
        gain.connect(panner);
        panner.connect(filter);
      } else {
        gain.connect(filter);
      }
      osc.start(start);
      osc.stop(start + dur + 0.03);
    });
  } catch (e) {}
}

      });

      });
      lines.push("");
    }

      if (lockProduction) {
        docClone.querySelector('body')?.classList.add('tb-production-locked');
      } else {
        docClone.querySelector('body')?.classList.remove('tb-production-locked');
      }
      let serialized = "<!DOCTYPE html>\n" + docClone.outerHTML;
      const statePayload = JSON.stringify(studioState);
      serialized = serialized.replace(
        /window\.__PRODUCTION_LOCKED__\s*=\s*(true|false);/,
        `window.__PRODUCTION_LOCKED__ = ${lockProduction ? 'true' : 'false'};`
      );
      serialized = serialized.replace(
        /window\.__PRELOADED_STUDIO_STATE__\s*=\s*window\.__PRELOADED_STUDIO_STATE__\s*\|\|\s*\{[\s\S]*?\};\nconst BOOK_CONTENTS/,
        `window.__PRELOADED_STUDIO_STATE__ = ${statePayload};\nconst BOOK_CONTENTS`
      );

      const blob = new Blob([serialized], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = lockProduction ? 'trading_books_founded_by_arasan_updated.html' : 'trading_books_editable_canvas_saved.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
