rading chart in the world moves in one of three simple ways.\",\n    topic: \"There are three types of trend: an Up Trend (price moving upward), a Down Trend (price moving downward), and a Sideway Trend (price moving flat between a ceiling and floor).\",\n    information: [\n      { title: \"1. Up Trend (Rising)\", text: \"Price climbs upward making Higher Highs and Higher Lows. Buyers are in control.\" },\n      { title: \"2. Down Trend (Falling)\", text: \"Price drops downward making Lower Highs and Lower Lows. Sellers are in control.\" },\n      { title: \"3. Sideway Trend (Flat)\", text: \"Price bounces flat between a top ceiling and a bottom floor. Beginners should avoid trading here.\" },\n      { title: \"Know the type first\", text: \"Always identify which of the 3 trends you are looking at before drawing your trend line.\" }\n    ],\n    typesIllustration: true,\n    chartSim: null,\n    practiceType: \"spot-trend\",\n    quiz: [\n      { question: \"What are the three types of trend?\", options: [\"Up Trend, Down Trend, and Sideway Trend\", \"Fast, Medium, and Slow\", \"Green, Red, and Yellow\"], answer: 0, explanation: \"Every market moves up, down, or sideways.\" },\n      { question: \"Which trend moves flat between a ceiling and a floor?\", options: [\"Up Trend\", \"Down Trend\", \"Sideway Trend\"], answer: 2, explanation: \"A Sideway Trend moves horizontally with no upward or downward slope.\" },\n      { question: \"In which trend are buyers in control?\", options: [\"Up Trend\", \"Down Trend\", \"Sideway Trend\"], answer: 0, explanation: \"Buyers push price higher in an Up Trend.\" }\n    ]\n  },\n  {\n    id: \"up-trend\",\n    number: \"03\",\n    title: \"Up Trend\",\n    navTitle: \"Up Trend\",\n    navDescription: \"Higher Highs & Higher Lows\",\n    kicker: \"CHAPTER 03 \u00b7 RISING MARKET\",\n    introduction: \"An Up Trend is like walking up a staircase. Learn how to draw an Uptrend Line below the lows and watch price touch it and bounce higher.\",\n    topic: \"In an Up Trend, price makes Higher Highs (HH) and Higher Lows (HL). You always draw the Uptrend Line BELOW the Higher Lows so it acts like a rising floor supporting price.\",\n    information: [\n      { title: \"Higher Highs (HH)\", text: \"Each new peak climbs higher than the last peak.\" },\n      { title: \"Higher Lows (HL)\", text: \"Each pullback stops higher than the previous low.\" },\n      { title: \"Draw BELOW the lows\", text: \"Connect the Higher Lows underneath the candles. This rising line is your support.\" },\n      { title: \"Touch and bounce up\", text: \"When price pulls back to touch the rising line, buyers step in and push price back up.\" }\n    ],\n    diagram: {\n      caption: \"Click any point in the Up Trend diagram to see how it works.\",\n      parts: {\n        p1: [\"Low 1 (Start)\", \"The first low where buyers push price upward.\"],\n        p2: [\"Higher Low (HL)\", \"Price pulls back, but stops HIGHER than Low 1. Connect Low 1 to this point!\"],\n        p3: [\"Touch 3 (Bounce)\", \"Price returns to the rising line, touches it, and goes back up.\"],\n        line: [\"Uptrend Support Line\", \"Drawn BELOW the Higher Lows to support price from underneath.\"],\n        break: [\"Higher High (HH)\", \"Each rally climbs above the previous peak, confirming buyers are strong.\"]\n      }\n    },\n    animatedIllus: {\n      steps: [\n        { title: \"Step 1: Low 1 & High 1\", text: \"Price starts at Low 1 and climbs up to High 1.\", hl: \"p1\" },\n        { title: \"Step 2: Higher Low forms\", text: \"Price dips, but stops HIGHER than Low 1. Connect the two lows underneath!\", hl: \"p2\" },\n        { title: \"Step 3: Higher High forms\", text: \"Price climbs past High 1, making a new Higher High.\", hl: \"break\" },\n        { title: \"Step 4: Touch & go back up!\", text: \"Price dips back to touch the rising line and bounces upward again.\", hl: \"p3\" }\n      ]\n    },\n    chartSim: {\n      tag: \"UP TREND l.\" },\n    { title: \"Swing Low (Bottom)\", text: \"A turning point at the bottom where price stops going down and starts moving up\u2014like the bottom of a valley.\" },\n    { title: \"Higher High (HH) & Higher Low (HL)\", text: \"When each new peak is higher than the last (HH) and each new bottom is higher than the last (HL), price is climbing.\" },\n    { title: \"Lower High (LH) & Lower Low (LL)\", text: \"When each new peak is lower than the last (LH) and each new bottom is lower than the last (LL), price is falling.\" }\n  ],\n  diagram: {\n    caption: \"Click any label on the chart to see the difference between Swing High, Swing Low, HH/HL, and LH/LL.\",\n    parts: {\n      sh: [\"Swing High (Peak)\", \"A turning point at the top where buyers pause and price turns downward.\"],\n      sl: [\"Swing Low (Bottom)\", \"A turning point at the bottom where sellers pause and price turns upward.\"],\n      hh: [\"Higher High (HH)\", \"A new Swing High that climbs ABOVE the previous Swing High.\"],\n      hl: [\"Higher Low (HL)\", \"A new Swing Low that stops ABOVE the previous Swing Low.\"],\n      lh: [\"Lower High (LH)\", \"A new Swing High that stops BELOW the previous Swing High.\"],\n      ll: [\"Lower Low (LL)\", \"A new Swing Low that drops BELOW the previous Swing Low.\"]\n    }\n  },\n  animatedIllus: {\n    steps: [\n      { title: \"Step 1: Swing Low & Swing High\", text: \"Price turns up at a Swing Low (bottom) and turns down at a Swing High (peak).\", hl: \"sl\" },\n      { title: \"Step 2: Higher Low (HL)\", text: \"Price dips again, but stops ABOVE the first Swing Low. That is a Higher Low!\", hl: \"hl\" },\n      { title: \"Step 3: Higher High (HH)\", text: \"Price rallies ABOVE the first Swing High. That is a Higher High!\", hl: \"hh\" },\n      { title: \"Step 4: Lower High & Lower Low\", text: \"When price turns down, peaks stop lower (LH) and bottoms drop lower (LL).\", hl: \"ll\" }\n    ]\n  },\n  chartSim: {\n    tag: \"SWINGS & HH / LL SIM \"800\">BREAK UP<\/text>\n      <text x=\"485\" y=\"256\" text-anchor=\"middle\" fill=\"var(--bear)\" font-size=\"11\" font-weight=\"800\">OR BREAK DOWN<\/text>\n    <\/g>\n  <\/svg>`;\n}\n\nfunction renderIllustration(lesson) {\n  if (lesson.typesIllustration) {\n    return `<section class=\"lesson-section\" id=\"illustration\">\n      ${sectionHeading(\"03\", \"Illustration of each type of trend\")}\n      <div class=\"overview-grid\">\n        <article class=\"overview-card\">\n          <span class=\"overview-badge bull\">1. UP TREND<\/span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Up Trend illustration\">\n            <line x1=\"20\" y1=\"130\" x2=\"240\" y2=\"55\" stroke=\"var(--bull)\" stroke-width=\"3\"/>\n            <polyline points=\"30,126 75,65 110,98 160,38 195,70 235,20\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.2\"/>\n            <circle cx=\"30\" cy=\"126\" r=\"4.5\" fill=\"var(--bull)\"/>\n            <circle cx=\"110\" cy=\"98\" r=\"4.5\" fill=\"var(--bull)\"/>\n            <circle cx=\"195\" cy=\"70\" r=\"4.5\" fill=\"var(--bull)\"/>\n          <\/svg>\n          <h3>Price Climbs Up<\/h3>\n          <p>Price makes <strong>Higher Highs<\/strong> and <strong>Higher Lows<\/strong>. Buyers are pushing the market upward.<\/p>\n          <div class=\"overview-rule\">Line goes BELOW the lows<\/div>\n        <\/article>\n        <article class=\"overview-card\">\n          <span class=\"overview-badge bear\">2. DOWN TREND<\/span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Down Trend illustration\">\n            <line x1=\"20\" y1=\"25\" x2=\"240\" y2=\"100\" stroke=\"var(--bear)\" stroke-width=\"3\"/>\n            <polyline points=\"30,28 75,90 110,56 160,118 195,84 235,135\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.2\"/>\n            <circle cx=\"30\" cy=\"28\" r=\"4.5\" fill=\"var(--bear)\"/>\n            <circle cx=\"110\" cy=\"56\" r=\"4.5\" fill=\"var(--bear)\"/>\n            <circle cx=\"195\" cy=\"84\" r=\"4.5\" fill=\"var(--bear)\"/>\n          <\/svg>\n          <h3>Price Drops Down<\/h3>\n          <p>Price makes <strong>Lower Highs<\/strong> and <strong>Lower Lows<\/strong>. Sellers are pushing the market downward.<\/p>\n          <div class=\"overview-rule\">Line goes ABOVE the highs<\/div>\n        <\/article>\n        <article class=\"overview-card\">\n          <span class=\"overview-badge flat\">3. SIDEWAY TREND<\/span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Sideway Trend illustration\">\n            <line x1=\"20\" y1=\"42\" x2=\"240\" y2=\"42\" stroke=\"var(--bear)\" stroke-width=\"2.8\"/>\n            <line x1=\"20\" y1=\"114\" x2=\"240\" y2=\"114\" stroke=\"var(--bull)\" stroke-width=\"2.8\"/>\n            <polyline points=\"30,112 70,45 110,112 150,45 190,112 230,45\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.2\"/>\n          <\/svg>\n          <h3>Price Moves Flat<\/h3>\n          <p>Price bounces flat between a <strong>Ceiling<\/strong> and <strong>Floor<\/strong>. Beginners should avoid trading here.<\/p>\n          <div class=\"overview-rule\">Wait for breakout (Up or Down)<\/div>\n        <\/article>\n      <\/div>\n    <\/section>`;\n  }\n\n  const isAnim = state.illusTab === \"animated\";\n  const stepObj = lesson.animatedIllus.steps[state.animIllusStep];\n  return `<section class=\"lesson-section\" id=\"illustration\">\n    ${sectionHeading(\"03\", \"Explore the illustration\")}\n    <div class=\"card figure-card\">\n      <div class=\"illus-tabs\" role=\"tablist\" aria-label=\"Illustration mode\">\n        <button type=\"button\" class=\"illus-tab ${!isAnim ? \"active\" : \"\"}\" id=\"tabInteractive\">1. Interactive Image Illustration<\/button>\n        <button type=\"button\" class=\"illus-tab ${isAnim ? \"active\" : \"\"}\" id=\"tabAnimated\">2. Animated Illustration (Live Instruction)<\/button>\n      <\/div>\n      ${!isAnim ? `\n        <div class=\"figure-wrap\">${getInteractiveSVG(lesson)}<\/div>\n        <div class=\"figure-caption\">${esc(lesson.diagram.caption)}<\/div>\n        <div class=\"diagram-explanation\" id=\"diagramExplanation\"><strong>Choose a component<\/strong><p>Click any label or dot in the diagram above to learn what it means.<\/p><\/div>\n      ` : `\n        <div class=\"anim-illus-grid\">\n          <div class=\"anim-illus-box\">${getInteractiveSVG(lesson, stepObj.hl)}<\/div>\n          <aside class=\"live-guide\" aria-live=\"polite\">\n            <div class=\"live-guide-tag\">\u2726 LIVE INSTRUCTION \u00b7 STEP ${state.animIllusStep + 1} OF ${lesson.animatedIllus.steps.length}<\/div>\n            <h3>${esc(stepObj.title)}<\/h3>\n            <p>${esc(stepObj.text)}<\/p>\n            <div class=\"live-step-pills\">${lesson.animatedIllus.steps.map((_, i) => `<span class=\"live-pill ${i <= state.animIllusStep ? \"active\" : \"\"}\"><\/span>`).join(\"\")}<\/div>\n            <div class=\"controls\">\n              <button type=\"button\" class=\"btn\" id=\"prevIllusStep\" ${state.animIllusStep === 0 ? \"disabled\" : \"\"}>\u2190 Prev<\/button>\n              <button type=\"button\" class=\"btn btn-primary\" id=\"nextIllusStep\">${state.animIllusStep === lesson.animatedIllus.steps.length - 1 ? \"\u21ba Restart\" : \"Next \u2192\"}<\/button>\n            <\/div>\n          <\/aside>\n        <\/div>\n      `}\n    <\/div>\n  <\/section>`;\n}\n\nfunction renderAnimation(lesson) {\n  if (!lesson.chartSim) {\n    return `<section class=\"lesson-section\" id=\"animation\">\n      ${sectionHeading(\"04\", \"Trading Chart Simulation\")}\n      <div class=\"card prose\"><p>No animation is needed in this chapter\u2014use the three illustrations above to compare Up, Down, and Sideway trends. In the next three chapters, you will watch live candlestick chart simulations form each trend step by step.<\/p><\/div>\n    <\/section>`;\n  }\n  return `<section class=\"lesson-section\" id=\"animation\">\n    ${sectionHeading(\"04\", \"Animation \u00b7 Trading chart simulation\")}\n    <div class=\"animation-grid\">\n      <div class=\"card simulator\">\n        <div class=\"sim-head\"><span class=\"sim-tag\">${esc(lesson.chartSim.tag)}<\/span><span class=\"sim-tag\">CANDLESTICK CHART<\/span><\/div>\n        <div class=\"stage-title\" id=\"stageTitle\">${esc(lesson.chartSim.stages[0].title)}<\/div>\n        <svg class=\"sim-svg\" id=\"simSvg\" viewBox=\"0 0 440 265\" role=\"img\" aria-label=\"Simulated trading candlestick chart\"><\/svg>\n        <div class=\"mobile-live-note\" id=\"mobileLiveNote\" style=\"margin:8px 0 4px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px;line-height:1.5;font-weight:600;\"><\/div>\n        <div class=\"figure-caption\" style=\"text-align:center;margin:4px 0 6px\">Watch the trading chart play, draw the line through the points, and see how price reacts at the line.<\/div>\n        <div class=\"readouts\">\n          <div class=\"readout\"><span>PRICE<\/span><strong id=\"readCur\">\u2014<\/strong><\/div>\n          <div class=\"readout\"><span>POINT 1<\/span><strong id=\"readP1\">\u2014<\/strong><\/div>\n          <div class=\"readout\"><span>POINT 2<\/span><strong id=\"readP2\">\u2014<\/strong><\/div>\n          <div class=\"readout\"><span>STATUS<\/span><strong id=\"readStatus\">\u2014<\/strong><\/div>\n        <\/div>\n        <div class=\"stage-track\" id=\"stageTrack\"><\/div>\n        <div class=\"controls\">\n          <button class=\"btn\" id=\"previousStage\" type=\"button\">\u2190 Previous<\/button>\n          <button class=\"btn btn-primary\" id=\"playPause\" type=\"button\">\u25b6 Play<\/button>\n          <button class=\"btn\" id=\"nextStage\" type=\"button\">Next \u2192<\/button>\n          <button class=\"btn\" id=\"replay\" type=\"button\">\u21ba Replay<\/button>\n          <select class=\"speed-select\" id=\"speedSelect\" aria-label=\"Animation speed\"><option value=\"0.6\">Slow<\/option><option value=\"1\" selected>Normal<\/option><option value=\"1.5\">Fast<\/option><\/select>\n        <\/div>\n        <div class=\"stage-count\" id=\"stageCount\">Stage 1 of 7<\/div>\n        \n        <div class=\"formation-check\" id=\"formationCheck\" hidden>\n          <h3>Quick check<\/h3>\n          <p>The chart simulation is complete. Tap the correct answer for each question.<\/p>\n          <div id=\"formationQuiz\"><\/div>\n        <\/div>\n      <\/div>\n      <aside class=\"instructor\" aria-live=\"polite\">\n        <div class=\"instructor-label\">\u2726 INSTRUCTOR EXPLANATION<\/div>\n        <h3 id=\"instructorTitle\"><\/h3>\n        <div class=\"instructor-copy\" id=\"instructorCopy\"><\/div>\n        <div class=\"change-grid\">\n          <div class=\"change-item\"><strong>WHAT CHANGED<\/strong><span id=\"changedText\"><\/span><\/div>\n          <div class=\"change-item\"><strong>WHAT STAYED THE SAME<\/strong><span id=\"unchangedText\"><\/span><\/div>\n        <\/div>\n        <div class=\"instructor-foot\">The instructor's explanation matches the selected trading chart stage.<\/div>\n      <\/aside>\n    <\/div>\n  <\/section>`;\n}\n\nfunction renderPracticeSection(lesson) {\n  return `<section class=\"lesson-section\" id=\"practice\">\n    ${sectionHeading(\"05\", \"Your turn \u00b7 Practice on the chart\")}\n    <div class=\"card practice-card\" id=\"practiceBox\"><\/div>\n  <\/section>`;\n}\n\nfunction renderQuiz() {\n  return `<section class=\"lesson-section\" id=\"knowledge-check\">\n    ${sectionHeading(\"06\", \"Quick-fire challenge\")}\n    <div id=\"quizContainer\"><\/div>\n  <\/section>`;\n}\n\n/* ==========================================================================\n   DEDICATED OVERVIEW CARD VIEW\n   ========================================================================== */\nfunction renderOverviewCard() {\n  stopAnimation();\n  stopIllusAnim();\n  state.view = \"overview\";\n  $(\"#chapterCounter\").textContent = \"OVERVIEW CARD \u00b7 QUICK REFERENCE\";\n  $(\"#lessonContent\").innerHTML = `\n    <header class=\"hero\">\n      <div class=\"hero-topline\"><span class=\"kicker\">TREND LINES \u00b7 OVERVIEW CARD<\/span><span class=\"lesson-pill\">QUICK REFERENCE<\/span><\/div>\n      <h1>Trend Lines Overview<\/h1>\n      <div class=\"lead\">Everything you learned in one clean reference card. Review the three trend types and the core rules before you open any live trading chart.<\/div>\n    <\/header>\n\n    <section class=\"lesson-section\">\n      ${sectionHeading(\"01\", \"The 3 Types of Trend\")}\n      <div class=\"overview-grid\">\n        <article class=\"overview-card\">\n          <span class=\"overview-badge bull\">1. UP TREND<\/span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Up Trend summary\">\n            <line x1=\"20\" y1=\"130\" x2=\"240\" y2=\"55\" stroke=\"var(--bull)\" stroke-width=\"3\"/>\n            <polyline points=\"30,126 75,65 110,98 160,38 195,70 235,20\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.2\"/>\n          <\/svg>\n          <h3>Higher Highs &amp; Higher Lows<\/h3>\n          <p>Draw the line <strong>BELOW<\/strong> the Higher Lows. Watch price dip to touch the line and bounce back up.<\/p>\n          <div class=\"overview-rule\">Role: Rising Support (Floor)<\/div>\n        <\/article>\n        <article class=\"overview-card\">\n          <span class=\"overview-badge bear\">2. DOWN TREND<\/span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Down Trend summary\">\n            <line x1=\"20\" y1=\"25\" x2=\"240\" y2=\"100\" stroke=\"var(--bear)\" stroke-width=\"3\"/>\n            <polyline points=\"30,28 75,90 110,56 160,118 195,84 235,135\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.2\"/>\n          <\/svg>\n          <h3>Lower Highs &amp; Lower Lows<\/h3>\n          <p>Draw the line <strong>ABOVE<\/strong> the Lower Highs. Watch price bounce to touch the line and drop back down.<\/p>\n          <div class=\"overview-rule\">Role: Falling Resistance (Ceiling)<\/div>\n        <\/article>\n        <article class=\"overview-card\">\n          <span class=\"overview-badge flat\">3. SIDEWAY TREND<\/span>\n          <svg viewBox=\"0 0 260 155\" role=\"img\" aria-label=\"Sideway Trend summary\">\n            <line x1=\"20\" y1=\"42\" x2=\"240\" y2=\"42\" stroke=\"var(--bear)\" stroke-width=\"2.8\"/>\n            <line x1=\"20\" y1=\"114\" x2=\"240\" y2=\"114\" stroke=\"var(--bull)\" stroke-width=\"2.8\"/>\n            <polyline points=\"30,112 70,45 110,112 150,45 190,112 230,45\" fill=\"none\" stroke=\"var(--ink-soft)\" stroke-width=\"2.2\"/>\n          <\/svg>\n          <h3>Flat Floor &amp; Ceiling<\/h3>\n          <p>Beginners should <strong>avoid trading<\/strong> here. Breakouts can happen either <strong>UP or DOWN<\/strong>\u2014wait for direction.<\/p>\n          <div class=\"overview-rule\">Action: Stay Patient &amp; Wait<\/div>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <section class=\"lesson-section\">\n      ${sectionHeading(\"02\", \"Golden Rules Checklist\")}\n      <div class=\"card info-list\">\n        <article class=\"info-item\"><strong>1. Spot the trend type first<\/strong><p>Always ask: Is the market going Up, Down, or Sideways? Never force a diagonal line on a flat market.<\/p><\/article>\n        <article class=\"info-item\"><strong>2. Two points draw, three confirm<\/strong><p>Connect Point 1 and Point 2 to draw your line, then wait for Touch 3 to confirm the market respects it.<\/p><\/article>\n        <article class=\"info-item\"><strong>3. Don't cut candle bodies<\/strong><p>Rest your trend line along the outer edges of swing highs or swing lows\u2014never slice through solid candle bodies.<\/p><\/article>\n        <article class=\"info-item\"><strong>4. Avoid Sideway Trends<\/strong><p>Sideway ranges chop beginners up and can break either upward or downward. Wait for a clear trend instead.<\/p><\/article>\n      <\/div>\n    <\/section>\n\n    <footer class=\"footer-nav\">\n      <button class=\"btn\" id=\"backToCh5\">\u2190 Back to Chapter 05<\/button>\n      <div class=\"footer-note\">Quick Reference Overview Card<\/div>\n      <button class=\"btn btn-primary\" id=\"goToYSK\">Next: You Should Know \u2192<\/button>\n    <\/footer>\n  `;\n  $(\"#backToCh5\").onclick = () => navigate(4);\n  $(\"#goToYSK\").onclick = () => { playLearningCue(\"click\"); renderYouShouldKnowCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n  renderNavigation();\n}\n\n\nfunction renderYouShouldKnowCard() {\n  stopAnimation();\n  stopIllusAnim();\n  state.view = \"ysk\";\n  $(\"#chapterCounter\").textContent = \"YOU SHOULD KNOW \u00b7 TRADER MINDSET\";\n  $(\"#lessonContent\").innerHTML = `\n    <div class=\"ysk-container\">\n      <header class=\"hero\">\n        <div class=\"hero-topline\"><span class=\"kicker\">TREND LINES \u00b7 FINAL NOTE<\/span><span class=\"lesson-pill\">YOU SHOULD KNOW<\/span><\/div>\n        <h1>You Should Know<\/h1>\n        <div class=\"lead\">Before you move on to your next trading lesson, keep this honest truth in mind.<\/div>\n      <\/header>\n\n      <section class=\"lesson-section\" id=\"topic\">\n        ${sectionHeading(\"\u2605\", \"The Reality of Trend Lines\")}\n        <div class=\"card prose\">\n          <p><strong>These are not a prediction method.<\/strong> Trend lines do not tell the future, and no line on a chart guarantees where price will go next.<\/p>\n          <p><strong>These are the very basics and the foundation of trading.<\/strong> Every advanced concept you will learn later builds on understanding price direction, swings, and structure.<\/p>\n          <p><strong>Learning this will help you become a trader in the far future<\/strong>\u2014if you stay consistent enough to keep learning more about trading, practice with discipline, and build the mindset of the top 1%.<\/p>\n        <\/div>\n      <\/section>\n\n      <section class=\"lesson-section\">\n        ${sectionHeading(\"\u2713\", \"Mindset of the Top 1%\")}\n        <div class=\"card info-list\">\n          <article class=\"info-item\"><strong>1. Not a crystal ball<\/strong><p>Use trend lines to read structure and stay disciplined\u2014never treat them as a magic prediction tool.<\/p><\/article>\n          <article class=\"info-item\"><strong>2. Master the foundation<\/strong><p>Strong traders never skip the basics. Knowing Up, Down, and Sideway trends is where real skill starts.<\/p><\/article>\n          <article class=\"info-item\"><strong>3. Consistency over time<\/strong><p>Becoming a trader takes time, patience, and steady daily study\u2014not shortcuts or overnight luck.<\/p><\/article>\n          <article class=\"info-item\"><strong>4. Keep learning<\/strong><p>Treat this book as step one. Keep studying market structure, risk management, and your own psychology.<\/p><\/article>\n        <\/div>\n      <\/section>\n\n      <div class=\"card quiz-summary\" id=\"finishBanner\" hidden style=\"margin-top:24px;\">\n        <div class=\"result-sparkle\">\ud83c\udf93<\/div>\n        <div class=\"result-xp\">TREND LINES BOOK COMPLETED<\/div>\n        <h3>Congratulations! You finished the Trend Lines Book.<\/h3>\n        <p class=\"prose\">You now know What Trend Lines Are, Swing Highs &amp; Lows (HH/LL), Types of Trend, Up Trend, Down Trend, Sideway Trend, and the Top 1% Mindset. Keep practising on real charts!<\/p>\n        <div class=\"controls\" style=\"justify-content:center;margin-top:16px;\">\n          <button type=\"button\" class=\"btn btn-primary\" id=\"restartBookBtn\">\u21ba Restart from Chapter 01<\/button>\n        <\/div>\n      <\/div>\n\n      <footer class=\"footer-nav\">\n        <button class=\"btn\" id=\"backToOverview\">\u2190 Previous: Overview Card<\/button>\n        <div class=\"footer-note\">Foundation &amp; Mindset<\/div>\n        <button class=\"btn btn-primary\" id=\"finishBookBtn\">\u2713 Finish Book<\/button>\n      <\/footer>\n    <\/div>\n  `;\n  $(\"#backToOverview\").onclick = () => { playLearningCue(\"click\"); renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n  $(\"#finishBookBtn\").onclick = () => {\n    playLearningCue(\"finish\");\n    const banner = $(\"#finishBanner\");\n    if (banner) { banner.hidden = false; banner.scrollIntoView({ behavior: \"smooth\", block: \"center\" }); }\n  };\n  $(\"#restartBookBtn\").onclick = () => navigate(0);\n  renderNavigation();\n}\n\nfunction renderLesson(viewMode = \"chapter\") {\n  stopAnimation();\n  stopIllusAnim();\n  state.view = viewMode;\n  if (state.view === \"ysk\") { renderYouShouldKnowCard(); return; }\n  const isSwings = state.view === \"swings\";\n  const lesson = isSwings ? SWINGS_LESSON : LESSONS[state.chapter];\n  $(\"#chapterCounter\").textContent = isSwings ? \"PRIMER CARD \u00b7 SWINGS & HH / LL\" : `CHAPTER ${lesson.number} / 0${LESSONS.length}`;\n  $(\"#lessonContent\").innerHTML = `\n    <header class=\"hero\">\n      <div class=\"hero-topline\"><span class=\"kicker\">${esc(lesson.kicker)}<\/span><span class=\"lesson-pill\">${isSwings ? \"PRIMER CARD\" : `LESSON ${state.chapter + 1} OF ${LESSONS.length}`}<\/span><\/div>\n      <h1>${esc(lesson.title)}<\/h1>\n      <div class=\"lead\">${esc(lesson.introduction)}<\/div>\n      <nav class=\"journey-strip\" aria-label=\"Lesson steps\">\n        <a class=\"journey-step active\" href=\"#topic\"><span>1<\/span><b>Learn<\/b><\/a>\n        <i><\/i><a class=\"journey-step\" href=\"#illustration\"><span>2<\/span><b>Illustrate<\/b><\/a>\n        <i><\/i><a class=\"journey-step\" href=\"#animation\"><span>3<\/span><b>Watch<\/b><\/a>\n        <i><\/i><a class=\"journey-step\" href=\"#knowledge-check\"><span>4<\/span><b>Quiz<\/b><\/a>\n      <\/nav>\n    <\/header>\n    ${renderTopic(lesson)}\n    ${renderInformation(lesson)}\n    ${renderIllustration(lesson)}\n    ${renderAnimation(lesson)}\n    ${renderPracticeSection(lesson)}\n    ${renderQuiz()}\n    <footer class=\"footer-nav\">\n      <button class=\"btn\" id=\"previousChapter\" ${!isSwings && state.chapter === 0 ? \"disabled\" : \"\"}>${isSwings ? \"\u2190 Back to Chapter 01\" : state.chapter === 1 ? \"\u2190 Swings & HH/LL Card\" : \"\u2190 Previous chapter\"}<\/button>\n      <div class=\"footer-note\">${state.completed.includes(lesson.id) ? \"\u2713 Completed\" : \"Complete the knowledge check to mark this complete.\"}<\/div>\n      ${isSwings\n        ? `<button class=\"btn btn-primary\" id=\"nextChapter\">Continue to Chapter 02 \u2192<\/button>`\n        : state.chapter === 0\n          ? `<button class=\"btn btn-primary\" id=\"nextChapter\">Next: Swings &amp; HH/LL Card \u2192<\/button>`\n          : state.chapter < LESSONS.length - 1\n            ? `<button class=\"btn btn-primary\" id=\"nextChapter\">Next chapter \u2192<\/button>`\n            : `<button class=\"btn btn-primary\" id=\"openOverview\">Open Overview Card \u2192<\/button>`}\n    <\/footer>\n    <div class=\"disclaimer\">Educational material only. Trend lines are visual learning tools that help you read price direction; they do not guarantee future price movement or give financial advice.<\/div>\n  `;\n  bindIllustration();\n  bindAnimation();\n  bindPractice();\n  bindQuiz();\n  $$(\".journey-step\").forEach(link => link.addEventListener(\"click\", event => {\n    const href = link.getAttribute(\"href\");\n    if (href && href.startsWith(\"#\")) {\n      event.preventDefault();\n      playLearningCue(\"click\");\n      $$(\".journey-step\").forEach(el => el.classList.toggle(\"active\", el === link));\n      const targetEl = $(href);\n      if (targetEl) targetEl.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n    }\n  }));\n  $(\"#previousChapter\").addEventListener(\"click\", () => {\n    if (isSwings) navigate(0);\n    else if (state.chapter === 1) openSwingsCard();\n    else navigate(state.chapter - 1);\n  });\n  if ($(\"#nextChapter\")) $(\"#nextChapter\").addEventListener(\"click\", () => {\n    if (isSwings) navigate(1);\n    else if (state.chapter === 0) openSwingsCard();\n    else navigate(state.chapter + 1);\n  });\n  if ($(\"#openOverview\")) $(\"#openOverview\").addEventListener(\"click\", () => { playLearningCue(\"click\"); renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); });\n  renderNavigation();\n}\n\nfunction renderNavigation() {\n  const nav = $(\"#chapterNav\");\n  nav.innerHTML = LESSONS.map((lesson, index) => {\n    const btn = `<button class=\"chapter-link\" data-chapter=\"${index}\" ${state.view === \"chapter\" && index === state.chapter ? 'aria-current=\"page\"' : ''}>\n      <span class=\"chapter-number\">${lesson.number}<\/span>\n      <span><strong>${esc(lesson.navTitle)}<\/strong><small>${esc(lesson.navDescription)}<\/small>${state.completed.includes(lesson.id) ? '<span class=\"chapter-status\">\u2713 COMPLETED<\/span>' : ''}<\/span>\n    <\/button>`;\n    const swingsBtn = index === 0 ? `<button class=\"chapter-link swings-card-btn\" id=\"swingsCardBtn\" ${state.view === \"swings\" ? 'aria-current=\"page\"' : ''}>\n      <span class=\"chapter-number\" style=\"color:var(--accent)\">\u2605<\/span>\n      <span><strong>Swings &amp; HH / LL<\/strong><small>Swing Highs, Lows &amp; HH/LL<\/small>${state.completed.includes(\"swings-hh-ll\") ? '<span class=\"chapter-status\">\u2713 COMPLETED<\/span>' : ''}<\/span>\n    <\/button>` : \"\";\n    return btn + swingsBtn;\n  }).join(\"\");\n  $$(\".chapter-link[data-chapter]\", nav).forEach(button => button.addEventListener(\"click\", () => navigate(Number(button.dataset.chapter))));\n  if ($(\"#swingsCardBtn\")) $(\"#swingsCardBtn\").onclick = () => openSwingsCard();\n\n  const ovBtn = $(\"#overviewBtn\");\n  if (ovBtn) {\n    ovBtn.setAttribute(\"aria-current\", state.view === \"overview\" ? \"page\" : \"false\");\n    ovBtn.onclick = () => { playLearningCue(\"click\"); renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n  }\n  const yskBtn = $(\"#youShouldKnowBtn\");\n  if (yskBtn) {\n    yskBtn.setAttribute(\"aria-current\", state.view === \"ysk\" ? \"page\" : \"false\");\n    yskBtn.onclick = () => { playLearningCue(\"click\"); renderYouShouldKnowCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n  }\n\n  $(\"#mobileChapter\").innerHTML = LESSONS.map((lesson, index) => {\n    const opt = `<option value=\"${index}\" ${state.view === \"chapter\" && index === state.chapter ? 'selected' : ''}>${lesson.number} \u2014 ${esc(lesson.navTitle)}<\/option>`;\n    const swOpt = index === 0 ? `<option value=\"swings\" ${state.view === \"swings\" ? 'selected' : ''}>\u2605 \u2014 Swings &amp; HH / LL Card<\/option>` : \"\";\n    return opt + swOpt;\n  }).join(\"\") + `<option value=\"overview\" ${state.view === \"overview\" ? 'selected' : ''}>Overview Card<\/option><option value=\"ysk\" ${state.view === \"ysk\" ? 'selected' : ''}>You Should Know<\/option>`;\n  $(\"#mobileChapter\").onchange = event => {\n    if (event.target.value === \"overview\") { renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); }\n    else if (event.target.value === \"ysk\") { renderYouShouldKnowCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); }\n    else if (event.target.value === \"swings\") openSwingsCard();\n    else navigate(Number(event.target.value));\n  };\n\n  const mainDone = state.completed.filter(id => id !== \"swings-hh-ll\").length;\n  $(\"#progressLabel\").textContent = `${mainDone} / ${LESSONS.length}`;\n  $(\"#progressFill\").style.width = `${(mainDone / LESSONS.length) * 100}%`;\n  if ($(\"#mobileProgressLabel\")) $(\"#mobileProgressLabel\").textContent = `${mainDone} / ${LESSONS.length} Chapters`;\n  if ($(\"#mobileProgressFill\")) $(\"#mobileProgressFill\").style.width = `${(mainDone / LESSONS.length) * 100}%`;\n}\n\n/* ==========================================================================\n   ILLUSTRATION INTERACTION\n   ========================================================================== */\nfunction stopIllusAnim() {\n  if (state.animIllusTimer) clearInterval(state.animIllusTimer);\n  state.animIllusTimer = null;\n}\n\nfunction bindIllustration() {\n  const lesson = state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter];\n  if (lesson.typesIllustration) return;\n\n  const tabInter = $(\"#tabInteractive\"), tabAnim = $(\"#tabAnimated\");\n  if (tabInter) tabInter.onclick = () => { stopIllusAnim(); state.illusTab = \"interactive\"; rerenderIllustration(); };\n  if (tabAnim) tabAnim.onclick = () => { state.illusTab = \"animated\"; state.animIllusStep = 0; rerenderIllustration(); startIllusAuto(); };\n\n  if (state.illusTab === \"interactive\") {\n    const parts = lesson.diagram.parts;\n    $$(\"[data-part]\").forEach(part => part.addEventListener(\"click\", () => {\n      playLearningCue(\"click\");\n      $$(\"[data-part]\").forEach(el => el.classList.toggle(\"selected\", el === part));\n      const entry = parts[part.dataset.part];\n      if (entry) $(\"#diagramExplanation\").innerHTML = `<strong>${esc(entry[0])}<\/strong><p>${esc(entry[1])}<\/p>`;\n    }));\n  } else {\n    const prev = $(\"#prevIllusStep\"), next = $(\"#nextIllusStep\");\n    const total = lesson.animatedIllus.steps.length;\n    if (prev) prev.onclick = () => { stopIllusAnim(); state.animIllusStep = Math.max(0, state.animIllusStep - 1); playLearningCue(\"step\"); rerenderIllustration(); };\n    if (next) next.onclick = () => { stopIllusAnim(); state.animIllusStep = state.animIllusStep >= total - 1 ? 0 : state.animIllusStep + 1; playLearningCue(\"step\"); rerenderIllustration(); };\n  }\n}\n\nfunction startIllusAuto() {\n  stopIllusAnim();\n  const lesson = state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter];\n  if (!lesson.animatedIllus || state.illusTab !== \"animated\") return;\n  state.animIllusTimer = setInterval(() => {\n    if ((state.view !== \"chapter\" && state.view !== \"swings\") || state.illusTab !== \"animated\") { stopIllusAnim(); return; }\n    const total = lesson.animatedIllus.steps.length;\n    state.animIllusStep = (state.animIllusStep + 1) % total;\n    rerenderIllustration();\n  }, 2600);\n}\n\nfunction rerenderIllustration() {\n  const sec = $(\"#illustration\");\n  if (!sec) return;\n  const tmp = document.createElement(\"div\");\n  tmp.innerHTML = renderIllustration(state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter]);\n  sec.replaceWith(tmp.firstElementChild);\n  bindIllustration();\n}\n\n/* ==========================================================================\n   BOOSTED AUDIO VOLUME CUES\n   ========================================================================== */\nfunction playLearningCue(kind = \"step\") {\n  try {\n    const AudioContextClass = window.AudioContext || window.webkitAudioContext;\n    if (!AudioContextClass) return;\n    state.audioContext = state.audioContext || new AudioContextClass();\n    const ctx = state.audioContext;\n    if (ctx.state === \"suspended\") ctx.resume();\n    const now = ctx.currentTime;\n    const patterns = {\n      step: [[520, .08, 0, \"triangle\"]],\n      correct: [[523, .13, 0, \"triangle\"], [659, .15, .09, \"triangle\"], [784, .22, .19, \"triangle\"]],\n      wrong: [[330, .14, 0, \"triangle\"], [260, .20, .10, \"triangle\"]],\n      finish: [[523, .15, 0, \"triangle\"], [659, .15, .10, \"triangle\"], [784, .20, .20, \"triangle\"], [1046, .30, .32, \"triangle\"]],\n      click: [[620, .06, 0, \"triangle\"]]\n    };\n    const comp = ctx.createDynamicsCompressor();\n    comp.threshold.setValueAtTime(-12, now);\n    comp.ratio.setValueAtTime(6, now);\n    comp.connect(ctx.destination);\n    (patterns[kind] || patterns.step).forEach(([frequency, duration, delay, wave]) => {\n      const osc = ctx.createOscillator(), gain = ctx.createGain();\n      const startAt = now + delay;\n      osc.type = wave;\n      osc.frequency.setValueAtTime(frequency, startAt);\n      gain.gain.setValueAtTime(.0001, startAt);\n      gain.gain.exponentialRampToValueAtTime(kind === \"finish\" ? .52 : .42, startAt + .015);\n      gain.gain.exponentialRampToValueAtTime(.0001, startAt + duration);\n      osc.connect(gain); gain.connect(comp);\n      osc.start(startAt); osc.stop(startAt + duration + .03);\n    });\n  } catch {}\n}\n\n/* ==========================================================================\n   TRADING CHART SIMULATOR\n   ========================================================================== */\nfunction stopAnimation() {\n  state.playing = false;\n  if (state.timer) clearTimeout(state.timer);\n  state.timer = null;\n  const button = $(\"#playPause\");\n  if (button) button.textContent = \"\u25b6 Play\";\n}\n\nfunction drawSimulation() {\n  const config = (state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!config) return;\n  const step = config.stages[state.stage];\n\n  $(\"#simSvg\").innerHTML = renderCandleChartSVG({\n    candles: step.candles,\n    line: step.line || null,\n    line2: step.line2 || null,\n    hz: step.hz !== undefined ? step.hz : null,\n    hz2: step.hz2 !== undefined ? step.hz2 : null,\n    labels: step.labels || [],\n    arrows: step.arrows || [],\n    min: config.min,\n    max: config.max\n  });\n  $(\"#stageTitle\").textContent = step.title;\n  $(\"#readCur\").textContent = step.cur;\n  $(\"#readP1\").textContent = step.p1;\n  $(\"#readP2\").textContent = step.p2;\n  $(\"#readStatus\").textContent = step.status;\n  $(\"#instructorTitle\").textContent = step.title;\n  $(\"#instructorCopy\").textContent = step.explanation;\n  if ($(\"#mobileLiveNote\")) $(\"#mobileLiveNote\").textContent = \"\u2726 \" + step.explanation;\n  $(\"#changedText\").textContent = step.changed;\n  $(\"#unchangedText\").textContent = step.unchanged;\n  $(\"#stageCount\").textContent = `Stage ${state.stage + 1} of ${config.stages.length}`;\n  $(\"#stageTrack\").innerHTML = config.stages.map((_, i) => `<span class=\"stage-segment ${i <= state.stage ? 'active' : ''}\"><\/span>`).join(\"\");\n  $(\"#previousStage\").disabled = state.stage === 0;\n  $(\"#nextStage\").disabled = state.stage === config.stages.length - 1;\n}\n\nfunction showFormationCheckpoint() {\n  const panel = $(\"#formationCheck\");\n  if (!panel || !panel.hidden) return;\n  panel.hidden = false;\n  playLearningCue(\"finish\");\n  renderFormationCheckpoint();\n}\n\nfunction renderFormationCheckpoint() {\n  const config = (state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!config) return;\n  const questions = config.checkpoint;\n  const target = $(\"#formationQuiz\");\n  if (!target) return;\n  target.innerHTML = questions.map((q, index) => {\n    const chosen = state.formationAnswers[q.key];\n    return `<div class=\"formation-question\">${index + 1}. ${esc(q.text)}<\/div>\n      <div class=\"answer-list\">${q.options.map((option, choice) => {\n        const cls = chosen === undefined ? \"\" : choice === q.answer ? \"correct\" : chosen === choice ? \"incorrect\" : \"\";\n        return `<button type=\"button\" class=\"answer-option ${cls}\" data-form-key=\"${q.key}\" data-form-choice=\"${choice}\" ${chosen !== undefined ? \"disabled\" : \"\"}>${String.fromCharCode(65 + choice)}. ${esc(option)}<\/button>`;\n      }).join(\"\")}<\/div>\n      ${chosen !== undefined ? `<div class=\"formation-feedback ${chosen === q.answer ? \"good\" : \"bad\"}\">${esc(q.explain)}<\/div>` : \"\"}`;\n  }).join(\"\");\n  if (Object.keys(state.formationAnswers).length === questions.length) {\n    const score = questions.filter(q => state.formationAnswers[q.key] === q.answer).length;\n    target.innerHTML += `<p class=\"formation-feedback\"><strong>${score} out of ${questions.length} correct.<\/strong> ${score === questions.length ? \"Great job!\" : \"Replay the chart and try again.\"}<\/p>\n      <button type=\"button\" class=\"btn\" id=\"formationTryAgain\">Try these questions again<\/button>`;\n    $(\"#formationTryAgain\").onclick = () => { state.formationAnswers = {}; renderFormationCheckpoint(); };\n  }\n  $$(\"[data-form-key]\", target).forEach(button => button.onclick = () => {\n    const key = button.dataset.formKey;\n    if (state.formationAnswers[key] !== undefined) return;\n    const q = questions.find(item => item.key === key);\n    state.formationAnswers[key] = Number(button.dataset.formChoice);\n    playLearningCue(state.formationAnswers[key] === q.answer ? \"correct\" : \"wrong\");\n    renderFormationCheckpoint();\n  });\n}\n\nfunction setStage(index) {\n  const config = (state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!config) return;\n  const next = Math.max(0, Math.min(config.stages.length - 1, index));\n  if (next === state.stage) return;\n  state.stage = next;\n  playLearningCue(\"step\");\n  drawSimulation();\n  if (state.stage === config.stages.length - 1) showFormationCheckpoint();\n}\n\nfunction advanceAnimation() {\n  const config = (state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!state.playing || !config) return;\n  if (state.stage >= config.stages.length - 1) { stopAnimation(); showFormationCheckpoint(); return; }\n  state.timer = setTimeout(() => {\n    if (!state.playing) return;\n    setStage(state.stage + 1);\n    if (state.stage >= config.stages.length - 1) { stopAnimation(); showFormationCheckpoint(); }\n    else advanceAnimation();\n  }, 2000 / state.speed);\n}\n\nfunction bindAnimation() {\n  const config = (state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter]).chartSim;\n  if (!config) return;\n  state.stage = 0; state.speed = 1; state.formationAnswers = {};\n  $(\"#formationCheck\").hidden = true;\n  drawSimulation();\n  $(\"#previousStage\").onclick = () => { stopAnimation(); setStage(state.stage - 1); };\n  $(\"#nextStage\").onclick = () => { stopAnimation(); setStage(state.stage + 1); };\n  $(\"#playPause\").onclick = () => {\n    if (state.playing) { stopAnimation(); return; }\n    if (state.stage === config.stages.length - 1) {\n      state.stage = 0;\n      state.formationAnswers = {};\n      if ($(\"#formationCheck\")) $(\"#formationCheck\").hidden = true;\n      drawSimulation();\n    }\n    state.playing = true; $(\"#playPause\").textContent = \"\u2161 Pause\"; advanceAnimation();\n  };\n  $(\"#replay\").onclick = () => { stopAnimation(); state.stage = 0; state.formationAnswers = {}; $(\"#formationCheck\").hidden = true; drawSimulation(); };\n  $(\"#speedSelect\").onchange = event => {\n    state.speed = Number(event.target.value);\n    if (state.playing) { stopAnimation(); state.playing = true; $(\"#playPause\").textContent = \"\u2161 Pause\"; advanceAnimation(); }\n  };\n}\n\n/* ==========================================================================\n   INTERACTIVE CHART PRACTICE\n   ========================================================================== */\nfunction bindPractice() {\n  const lesson = state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter];\n  state.practiceFound = [];\n  state.practiceMsg = \"\";\n  state.practiceState = \"\";\n  renderPractice();\n}\n\nfunction renderPractice() {\n  const lesson = state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter];\n  const box = $(\"#practiceBox\");\n  if (!box) return;\n\n  if (lesson.practiceType === \"spot-swings\") {\n    const qs = [\n      {\n        prompt: \"Question 1: Low 1 is 100, and the next dip stops at 109. What is 109 called?\",\n        candles: [[70,108,110,100,102],[120,102,120,101,118],[170,118,119,109,112],[220,112,126,111,125]],\n        labels: [[70,100,\"Low 1: 100\",\"bull\",\"bot\"],[170,109,\"? : 109\",\"focus\",\"bot\"]],\n        ans: \"hl\",\n        explain: \"Correct! Because 109 is higher than 100, it is a Higher Low (HL).\"\n      },\n      {\n        prompt: \"Question 2: High 1 is 120, and the next peak reaches 134. What is 134 called?\",\n        candles: [[70,106,120,105,118],[120,118,119,109,111],[170,111,134,110,132]],\n        labels: [[70,120,\"High 1: 120\",\"accent\",\"top\"],[170,134,\"? : 134\",\"focus\",\"top\"]],\n        ans: \"hh\",\n        explain: \"Correct! Because 134 is higher than 120, it is a Higher High (HH).\"\n      },\n      {\n        prompt: \"Question 3: High 1 is 134, and the next bounce stops at 126. What is 126 called?\",\n        candles: [[70,130,134,122,124],[120,124,125,114,115],[170,115,126,114,122]],\n        labels: [[70,134,\"High 1: 134\",\"bear\",\"top\"],[170,126,\"? : 126\",\"focus\",\"top\"]],\n        ans: \"lh\",\n        explain: \"Correct! Because 126 is lower than 134, it is a Lower High (LH).\"\n      }\n    ];\n    const idx = state.practiceFound.length % qs.length;\n    const item = qs[idx];\n    box.innerHTML = `\n      <div class=\"practice-top\"><p class=\"practice-prompt\">${esc(item.prompt)}<\/p><\/div>\n      <svg class=\"practice-svg\" viewBox=\"0 0 440 265\" role=\"img\" aria-label=\"Spot the swing label\">\n        ${renderCandleChartSVG({ candles: item.candles, labels: item.labels, min: 95, max: 140 })}\n      <\/svg>\n      <div class=\"practice-actions\">\n        <button type=\"button\" class=\"btn\" data-swlabel=\"hh\">Higher High (HH)<\/button>\n        <button type=\"button\" class=\"btn\" data-swlabel=\"hl\">Higher Low (HL)<\/button>\n        <button type=\"button\" class=\"btn\" data-swlabel=\"lh\">Lower High (LH)<\/button>\n        <button type=\"button\" class=\"btn\" data-swlabel=\"ll\">Lower Low (LL)<\/button>\n        <button type=\"button\" class=\"btn btn-primary\" id=\"nextSwingQ\" style=\"margin-left:auto\">Next \u2192<\/button>\n      <\/div>\n      <div class=\"practice-status ${state.practiceState}\">${esc(state.practiceMsg || \"Tap the right swing label above.\")}<\/div>\n    `;\n    $$(\"[data-swlabel]\", box).forEach(btn => btn.onclick = () => {\n      const ok = btn.dataset.swlabel === item.ans;\n      playLearningCue(ok ? \"correct\" : \"wrong\");\n      state.practiceState = ok ? \"good\" : \"warn\";\n      state.practiceMsg = ok ? item.explain : \"Compare the two marked numbers (higher or lower?) and try again!\";\n      renderPractice();\n    });\n    $(\"#nextSwingQ\").onclick = () => {\n      playLearningCue(\"click\");\n      state.practiceFound.push(idx);\n      state.practiceMsg = \"\";\n      state.practiceState = \"\";\n      renderPractice();\n    };\n    return;\n  }\n\n  if (lesson.practiceType === \"spot-trend\") {\n    const scenarios = [\n      {\n        title: \"Chart A: Higher Highs & Higher Lows\",\n        candles: [[60,104,108,100,106],[100,106,118,105,116],[140,116,117,108,110],[180,110,126,109,124],[220,124,125,116,118],[260,118,136,117,134]],\n        line: [45, 99, 280, 118, false],\n        answer: \"up\",\n        explain: \"Correct! Price is making Higher Highs and Higher Lows, so it's an Up Trend.\"\n      },\n      {\n        title: \"Chart B: Lower Highs & Lower Lows\",\n        candles: [[60,136,140,132,133],[100,133,134,120,122],[140,122,130,121,128],[180,128,129,112,114],[220,114,121,113,120],[260,120,121,104,106]],\n        line2: [45, 141, 280, 118, false],\n        answer: \"down\",\n        explain: \"Correct! Price is making Lower Highs and Lower Lows, so it's a Down Trend.\"\n      },\n      {\n        title: \"Chart C: Flat Ceiling & Floor\",\n        candles: [[60,106,110,102,108],[100,108,122,107,120],[140,120,121,104,105],[180,105,121,104,119],[220,119,121,103,104],[260,104,121,103,118]],\n        hz: 122, hz2: 102,\n        answer: \"side\",\n        explain: \"Correct! Price is bouncing flat between a Ceiling (122) and Floor (102)\u2014a Sideway Trend.\"\n      }\n    ];\n    const idx = state.practiceFound.length % scenarios.length;\n    const sc = scenarios[idx];\n    box.innerHTML = `\n      <div class=\"practice-top\">\n        <p class=\"practice-prompt\">Spot the Trend: Look at the candles below and choose the right trend type (${idx + 1} of 3).<\/p>\n      <\/div>\n      <svg class=\"practice-svg\" viewBox=\"0 0 440 265\" role=\"img\" aria-label=\"${esc(sc.title)}\">\n        ${renderCandleChartSVG({ candles: sc.candles, line: sc.line || null, line2: sc.line2 || null, hz: sc.hz || null, hz2: sc.hz2 || null, min: 96, max: 144 })}\n      <\/svg>\n      <div class=\"practice-actions\">\n        <button type=\"button\" class=\"btn\" data-spot=\"up\">\ud83d\udcc8 Up Trend<\/button>\n        <button type=\"button\" class=\"btn\" data-spot=\"down\">\ud83d\udcc9 Down Trend<\/button>\n        <button type=\"button\" class=\"btn\" data-spot=\"side\">\u2194\ufe0f Sideway Trend<\/button>\n        <button type=\"button\" class=\"btn btn-primary\" id=\"nextSpotChart\" style=\"margin-left:auto\">Next Chart \u2192<\/button>\n      <\/div>\n      ${state.practiceMsg ? `<div class=\"practice-status ${state.practiceState}\">${esc(state.practiceMsg)}<\/div>` : `<div class=\"practice-status\">Tap Up Trend, Down Trend, or Sideway Trend above.<\/div>`}\n    `;\n    $$(\"[data-spot]\", box).forEach(btn => btn.onclick = () => {\n      const ok = btn.dataset.spot === sc.answer;\n      playLearningCue(ok ? \"correct\" : \"wrong\");\n      state.practiceState = ok ? \"good\" : \"warn\";\n      state.practiceMsg = ok ? sc.explain : \"Look closely at the highs and lows\u2014try another answer!\";\n      renderPractice();\n    });\n    $(\"#nextSpotChart\").onclick = () => {\n      playLearningCue(\"click\");\n      state.practiceFound.push(idx);\n      state.practiceMsg = \"\";\n      state.practiceState = \"\";\n      renderPractice();\n    };\n    return;\n  }\n\n  if (lesson.practiceType === \"sideway-decision\") {\n    box.innerHTML = `\n      <div class=\"practice-top\">\n        <p class=\"practice-prompt\">Beginner Decision Check: Price is bouncing sideways between 102 and 120. What should you do?<\/p>\n      <\/div>\n      <svg class=\"practice-svg\" viewBox=\"0 0 440 265\" role=\"img\" aria-label=\"Sideway trend decision chart\">\n        ${renderCandleChartSVG({\n          candles: [[60,110,111,102,104],[95,104,119,103,118],[130,118,120,106,107],[165,107,118,105,116],[200,116,119,103,104],[235,104,117,103,115],[270,115,118,108,110]],\n          hz: 120, hz2: 102,\n          arrows: [[285,116,342,130,\"bull\",\"Break UP\"],[285,106,342,92,\"bear\",\"Break DOWN\"]],\n          min: 90, max: 135\n        })}\n      <\/svg>\n      <div class=\"practice-actions\">\n        <button type=\"button\" class=\"btn\" data-sw=\"buy\">Buy in the middle now<\/button>\n        <button type=\"button\" class=\"btn\" data-sw=\"sell\">Guess it will break up<\/button>\n        <button type=\"button\" class=\"btn\" data-sw=\"wait\">Avoid trading &amp; wait for breakout<\/button>\n      <\/div>\n      <div class=\"practice-status ${state.practiceState}\">${esc(state.practiceMsg || \"Choose the safest decision for a beginner.\")}<\/div>\n    `;\n    $$(\"[data-sw]\", box).forEach(btn => btn.onclick = () => {\n      const ok = btn.dataset.sw === \"wait\";\n      playLearningCue(ok ? \"correct\" : \"wrong\");\n      state.practiceState = ok ? \"good\" : \"warn\";\n      state.practiceMsg = ok\n        ? \"Smart choice! Sideway ranges are choppy and can break either UP or DOWN\u2014waiting keeps your capital safe.\"\n        : \"Careful! Sideway markets chop beginners up, and the breakout can go either UP or DOWN. Waiting is safer.\";\n      renderPractice();\n    });\n    return;\n  }\n\n  // Click-to-draw swing points on candlestick chart\n  const p = lesson.practice;\n  const h = 265, padTop = 24, padBot = 28;\n  const y = v => (h - padBot) - ((v - p.min) / Math.max(1, p.max - p.min)) * (h - padTop - padBot);\n  const foundCount = state.practiceFound.length;\n  const allFound = foundCount === p.targets.length;\n\n  let drawnLine = null;\n  if (foundCount >= 2) {\n    if (allFound) {\n      drawnLine = [...p.lineExtend, false];\n    } else {\n      const selPts = state.practiceFound\n        .map(id => p.targets.find(t => t.id === id))\n        .filter(Boolean)\n        .sort((a, b) => a.x - b.x);\n      if (selPts.length >= 2) {\n        drawnLine = [selPts[0].x, selPts[0].p, selPts[1].x, selPts[1].p, true];\n      }\n    }\n  }\n\n  const labels = state.practiceFound.map(id => {\n    const t = p.targets.find(item => item.id === id);\n    return [t.x, t.p, t.label, p.lineColor === \"bear\" ? \"bear\" : \"bull\", p.lineColor === \"bear\" ? \"top\" : \"bot\"];\n  });\n\n  const hotspots = [...p.targets, ...p.decoys].map(pt => {\n    const isHit = state.practiceFound.includes(pt.id);\n    const cy = y(pt.p);\n    return `<g class=\"swing-hotspot\" data-pt=\"${pt.id}\">\n      <circle class=\"ring\" cx=\"${pt.x}\" cy=\"${cy}\" r=\"${isHit ? 10 : 11}\" fill=\"${isHit ? 'rgba(21,150,106,.2)' : 'rgba(49,95,206,.12)'}\" stroke=\"${isHit ? 'var(--bull)' : 'var(--accent)'}\" stroke-width=\"2\" stroke-dasharray=\"${isHit ? 'none' : '3 2'}\"/>\n    <\/g>`;\n  }).join(\"\");\n\n  box.innerHTML = `\n    <div class=\"practice-top\">\n      <p class=\"practice-prompt\">${esc(p.prompt)}<\/p>\n      <span class=\"sim-tag\">${foundCount} / ${p.targets.length} POINTS SELECTED<\/span>\n    <\/div>\n    <svg class=\"practice-svg\" viewBox=\"0 0 440 265\" role=\"img\" aria-label=\"Click swing points to draw trend line\">\n      ${renderCandleChartSVG({\n        candles: p.candles,\n        line: p.lineColor === \"bear\" ? null : drawnLine,\n        line2: p.lineColor === \"bear\" ? drawnLine : null,\n        labels,\n        min: p.min,\n        max: p.max\n      })}\n      ${hotspots}\n    <\/svg>\n    <div class=\"practice-status ${allFound ? 'good' : state.practiceState}\">${esc(allFound ? p.successMsg : (state.practiceMsg || \"Tap the pulsing circles at the swing points on the candles.\"))}<\/div>\n    <div class=\"practice-actions\">\n      <button type=\"button\" class=\"btn\" id=\"resetPractice\">\u21ba Reset Chart<\/button>\n    <\/div>\n  `;\n\n  $$(\"[data-pt]\", box).forEach(el => el.onclick = () => {\n    const id = el.dataset.pt;\n    if (state.practiceFound.includes(id)) return;\n    const isTarget = p.targets.some(t => t.id === id);\n    if (isTarget) {\n      state.practiceFound.push(id);\n      playLearningCue(state.practiceFound.length === p.targets.length ? \"finish\" : \"correct\");\n      state.practiceState = \"good\";\n      state.practiceMsg = state.practiceFound.length === 1\n        ? \"Point 1 selected! Now click the next swing point.\"\n        : state.practiceFound.length === 2\n          ? \"Line drawn between Point 1 and Point 2! Now click Touch 3 to confirm.\"\n          : p.successMsg;\n    } else {\n      playLearningCue(\"wrong\");\n      state.practiceState = \"warn\";\n      state.practiceMsg = p.lineColor === \"bear\"\n        ? \"That's a low! In a Down Trend, click the Lower Highs ABOVE the candles.\"\n        : \"That's a peak! Click the swing lows UNDERNEATH the candles.\";\n    }\n    renderPractice();\n  });\n  $(\"#resetPractice\").onclick = () => { playLearningCue(\"click\"); bindPractice(); };\n}\n\n/* ==========================================================================\n   KNOWLEDGE CHECK\n   ========================================================================== */\nfunction bindQuiz() {\n  state.quizIndex = 0; state.answers = {};\n  renderQuizQuestion();\n}\nfunction renderQuizQuestion() {\n  const lesson = state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter], questions = lesson.quiz, container = $(\"#quizContainer\");\n  if (state.quizIndex >= questions.length) { renderQuizSummary(); return; }\n  const q = questions[state.quizIndex], chosen = state.answers[state.quizIndex];\n  container.innerHTML = `\n    <div class=\"card quiz-card\">\n      <div class=\"quiz-topline\"><div class=\"quiz-meta\">QUICK CHALLENGE \u00b7 ${state.quizIndex + 1} OF ${questions.length}<\/div><div class=\"quiz-xp\">\u2726 +10 XP<\/div><\/div>\n      <div class=\"quiz-progress\"><span style=\"width:${(state.quizIndex / questions.length) * 100}%\"><\/span><\/div>\n      <div class=\"quiz-question\">${esc(q.question)}<\/div>\n      <div class=\"answer-list\">${q.options.map((option, index) => {\n        let cls = \"\";\n        if (chosen !== undefined && index === q.answer) cls = \"correct\";\n        else if (chosen === index) cls = \"incorrect\";\n        return `<button class=\"answer-option ${cls}\" data-answer=\"${index}\" ${chosen !== undefined ? \"disabled\" : \"\"}>${String.fromCharCode(65 + index)}. ${esc(option)}<\/button>`;\n      }).join(\"\")}<\/div>\n      ${chosen !== undefined ? `<div class=\"feedback ${chosen === q.answer ? 'good' : 'bad'}\">${chosen === q.answer ? 'Correct.' : 'Not quite.'} ${esc(q.explanation)}<\/div>\n      <div class=\"quiz-footer\"><span class=\"stage-count\">Answer recorded<\/span><button class=\"btn btn-primary\" id=\"quizContinue\">${state.quizIndex === questions.length - 1 ? \"View results\" : \"Next question \u2192\"}<\/button><\/div>` : \"\"}\n    <\/div>`;\n  $$(\"[data-answer]\", container).forEach(button => button.onclick = () => {\n    if (state.answers[state.quizIndex] !== undefined) return;\n    state.answers[state.quizIndex] = Number(button.dataset.answer);\n    playLearningCue(Number(button.dataset.answer) === q.answer ? \"correct\" : \"wrong\");\n    renderQuizQuestion();\n  });\n  const next = $(\"#quizContinue\", container);\n  if (next) next.onclick = () => { playLearningCue(\"click\"); state.quizIndex++; renderQuizQuestion(); };\n}\nfunction renderQuizSummary() {\n  const lesson = state.view === \"swings\" ? SWINGS_LESSON : LESSONS[state.chapter], score = lesson.quiz.filter((q, index) => state.answers[index] === q.answer).length;\n  const passed = score === lesson.quiz.length;\n  if (passed && !state.completed.includes(lesson.id)) { state.completed.push(lesson.id); saveProgress(); renderNavigation(); playLearningCue(\"finish\"); }\n  else if (!passed) playLearningCue(\"wrong\");\n  $(\"#quizContainer\").innerHTML = `\n    <div class=\"card quiz-summary\">\n      <div class=\"result-sparkle\">${passed ? \"\ud83c\udfc6\" : \"\ud83d\udca1\"}<\/div>\n      <div class=\"score\">${score} / ${lesson.quiz.length}<\/div>\n      <div class=\"result-xp\">${passed ? \"CHAPTER CLEARED \u00b7 +30 XP\" : \"KEEP PRACTISING \u00b7 YOU CAN RETRY\"}<\/div>\n      <h3>${passed ? \"Chapter knowledge check passed\" : \"Assessment completed\"}<\/h3>\n      <p class=\"prose\">${passed ? \"Excellent. You answered every question correctly, and this chapter is now marked complete.\" : \"Review the explanations and retake the assessment. Answer all three correctly to complete the chapter.\"}<\/p>\n      <div class=\"controls\" style=\"justify-content:center;margin-top:17px\">\n        <button class=\"btn btn-primary\" id=\"retakeQuiz\">\u21ba Retake assessment<\/button>\n        ${state.view === 'swings' ? '<button class=\"btn\" id=\"summaryCh2\">Continue to Chapter 02 \u2192<\/button>' : state.chapter < LESSONS.length - 1 ? '<button class=\"btn\" id=\"summaryNext\">Next chapter \u2192<\/button>' : '<button class=\"btn\" id=\"summaryOverview\">Open Overview Card \u2192<\/button>'}\n      <\/div>\n    <\/div>`;\n  $(\"#retakeQuiz\").onclick = () => { playLearningCue(\"click\"); state.quizIndex = 0; state.answers = {}; renderQuizQuestion(); };\n  if ($(\"#summaryCh2\")) $(\"#summaryCh2\").onclick = () => navigate(1);\n  if ($(\"#summaryNext\")) $(\"#summaryNext\").onclick = () => state.chapter === 0 ? openSwingsCard() : navigate(state.chapter + 1);\n  if ($(\"#summaryOverview\")) $(\"#summaryOverview\").onclick = () => { renderOverviewCard(); window.scrollTo({ top: 0, behavior: \"smooth\" }); };\n}\nfunction openSwingsCard() {\n  playLearningCue(\"click\");\n  state.illusTab = \"interactive\";\n  state.animIllusStep = 0;\n  renderLesson(\"swings\");\n  window.scrollTo({ top: 0, behavior: \"smooth\" });\n}\nfunction navigate(index) {\n  if (index < 0 || index >= LESSONS.length) return;\n  stopAnimation(); stopIllusAnim();\n  state.chapter = index; state.illusTab = \"interactive\"; state.animIllusStep = 0;\n  renderLesson(); window.scrollTo({ top: 0, behavior: \"smooth\" });\n}\n\n/* ==========================================================================\n   INITIALIZATION & THEME TOGGLE\n   ========================================================================== */\nfunction applyTheme(theme) {\n  document.documentElement.setAttribute(\"data-theme\", theme);\n  try { localStorage.setItem(\"trendlines-theme\", theme); } catch {}\n  const label = theme === \"dark\" ? \"\u2600\ufe0f Light\" : \"\ud83c\udf19 Dark\";\n  if ($(\"#desktopThemeToggle\")) $(\"#desktopThemeToggle\").textContent = label;\n  if ($(\"#mobileThemeToggle\")) $(\"#mobileThemeToggle\").textContent = label;\n}\nfunction toggleTheme() {\n  const cur = document.documentElement.getAttribute(\"data-theme\") === \"dark\" ? \"dark\" : \"light\";\n  playLearningCue(\"click\");\n  applyTheme(cur === \"dark\" ? \"light\" : \"dark\");\n}\n(function initTheme() {\n  let saved = \"light\";\n  try { saved = localStorage.getItem(\"trendlines-theme\") || \"light\"; } catch {}\n  applyTheme(saved);\n  if ($(\"#desktopThemeToggle\")) $(\"#desktopThemeToggle\").onclick = toggleTheme;\n  if ($(\"#mobileThemeToggle\")) $(\"#mobileThemeToggle\").onclick = toggleTheme;\n})();\n\nrenderLesson();\n<\/script>\n<\/body>\n<\/html>";

/* --- VOL 03: SUPPORT & RESISTANCE BOOK HTML --- */
const SUPPORT_RESISTANCE_BOOK_HTML = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"theme-color\" content=\"#F7F8FA\">\n<title>SUPPORT &amp; RESISTANCE \u2014 by TRADING BOOKS</title>\n<style>\n/* ==========================================================================\n   SUPPORT & RESISTANCE DESIGN SYSTEM \u2014 FINAL PRODUCTION EDITION\n   ========================================================================== */\n:root {\n  color-scheme: light;\n  --canvas: #f1f5f9;\n  --surface: #ffffff;\n  --surface-muted: #f2f7fb;\n  --ink: #17212b;\n  --ink-soft: #3e4b58;\n  --muted: #596775;\n  --subtle: #87929d;\n  --line: #dce2e8;\n  --line-strong: #bbc5cf;\n  --accent: #315fce;\n  --accent-hover: #244cac;\n  --accent-soft: #eaf0ff;\n  --bull: #15966a;\n  --bull-dark: #08734e;\n  --bull-soft: #e2f7ed;\n  --bear: #e05262;\n  --bear-dark: #a92f3c;\n  --bear-soft: #fff0f1;\n  --neutral: #65717d;\n  --neutral-soft: #edf0f3;\n  --focus: #d18b20;\n  --focus-soft: #fff4d9;\n  --radius-md: 18px;\n  --radius-lg: 24px;\n  --content-width: 1240px;\n  --font-ui: \"Segoe UI\", system-ui, -apple-system, Arial, sans-serif;\n  --font-display: Georgia, \"Times New Roman\", serif;\n}\n* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\nhtml { scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  background: linear-gradient(135deg, #f4f7fc 0%, #eef3fa 55%, #f7f8fc 100%);\n  color: var(--ink);\n  font-family: var(--font-ui);\n  font-size: 18px;\n  line-height: 1.72;\n}\nbutton, input, select { font: inherit; }\nbutton { cursor: pointer; }\nbutton:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {\n  outline: 3px solid var(--focus);\n  outline-offset: 3px;\n}\n\n/* ==========================================================================\n   NEW HIGH-VISIBILITY SVG ANIMATION ENGINE KEYFRAMES\n   ========================================================================== */\n@keyframes pulseBeacon {\n  0%, 100% { transform: scale(1); opacity: 0.92; }\n  50% { transform: scale(1.48); opacity: 0.18; }\n}\n@keyframes pulseHotspot {\n  0%, 100% { transform: scale(1); opacity: 0.95; }\n  50% { transform: scale(1.22); opacity: 0.45; }\n}\n@keyframes drawZoneLine {\n  from { stroke-dashoffset: 900; }\n  to { stroke-dashoffset: 0; }\n}\n@keyframes marchAnts {\n  to { stroke-dashoffset: -28; }\n}\n@keyframes candleGrow {\n  0% { transform: scaleY(0.15); opacity: 0.25; }\n  65% { transform: scaleY(1.06); opacity: 1; }\n  100% { transform: scaleY(1); opacity: 1; }\n}\n@keyframes popInBadge {\n  0% { transform: translateY(6px) scale(0.86); opacity: 0; }\n  100% { transform: translateY(0) scale(1); opacity: 1; }\n}\n@keyframes floatBounceUp {\n  0%, 100% { transform: translateY(0); }\n  50% { transform: translateY(-7px); }\n}\n@keyframes floatDropDown {\n  0%, 100% { transform: translateY(0); }\n  50% { transform: translateY(7px); }\n}\n@keyframes zoneGlow {\n  0%, 100% { opacity: 0.82; }\n  50% { opacity: 0.98; }\n}\n\n.svg-pulse-ring {\n  transform-box: fill-box;\n  transform-origin: center;\n  animation: pulseBeacon 1.65s infinite ease-in-out;\n}\n.svg-hotspot-pulse {\n  transform-box: fill-box;\n  transform-origin: center;\n  animation: pulseHotspot 1.5s infinite ease-in-out;\n}\n.svg-animated-line {\n  stroke-dasharray: 900;\n  animation: drawZoneLine 0.7s cubic-bezier(.22,.61,.36,1) forwards;\n}\n.svg-marching-border {\n  stroke-dasharray: 9 5;\n  animation: marchAnts 1.2s linear infinite;\n}\n.svg-candle-latest {\n  transform-box: fill-box;\n  transform-origin: center;\n  animation: candleGrow 0.42s cubic-bezier(.22,.61,.36,1) forwards;\n}\n.svg-badge-pop {\n  transform-box: fill-box;\n  transform-origin: center;\n  animation: popInBadge 0.34s cubic-bezier(.22,.61,.36,1) forwards;\n}\n.svg-bounce-up {\n  transform-box: fill-box;\n  transform-origin: center;\n  animation: floatBounceUp 1.3s infinite ease-in-out;\n}\n.svg-drop-down {\n  transform-box: fill-box;\n  transform-origin: center;\n  animation: floatDropDown 1.3s infinite ease-in-out;\n}\n.svg-zone-band {\n  animation: zoneGlow 2.4s infinite ease-in-out;\n}\n\n/* ==========================================================================\n   1. DEDICATED PC WIDESCREEN INTERFACE (html[data-device=\"pc\"])\n   ========================================================================== */\n.app-shell { min-height: 100vh; display: grid; grid-template-columns: 276px minmax(0, 1fr); }\n.sidebar {\n  position: sticky; top: 0; height: 100vh; overflow-y: auto;\n  padding: 30px 20px; background: #fff; border-right: 1px solid #e4eaf2;\n  box-shadow: 8px 0 30px rgba(35, 55, 90, .035);\n}\n.brand { padding: 2px 11px 24px; border-bottom: 1px solid var(--line); }\n.brand-name { font-size: 25px; font-weight: 850; letter-spacing: .16em; color: #1c2b49; display: block; line-height: 1.2; }\n.brand-sub { display: block; margin-top: 6px; color: #71809a; font-size: 12px; font-weight: 750; letter-spacing: .14em; }\n.nav-label { margin: 24px 11px 10px; color: var(--subtle); font-size: 12px; font-weight: 800; letter-spacing: .15em; }\n.chapter-nav { display: grid; gap: 7px; }\n.chapter-link {\n  display: grid; grid-template-columns: 31px minmax(0, 1fr); gap: 9px; width: 100%;\n  padding: 13px 12px; text-align: left; border: 1px solid transparent; border-radius: 14px;\n  color: var(--ink); background: transparent; transition: .18s ease;\n}\n.chapter-link:hover { background: var(--surface-muted); }\n.chapter-link[aria-current=\"page\"] {\n  background: linear-gradient(110deg, #edf2ff, #f4f7ff);\n  border: 1px solid #d9e3ff;\n  box-shadow: inset 4px 0 #416de0;\n}\n.chapter-number { color: var(--muted); font-size: 13px; font-weight: 800; padding-top: 2px; }\n.chapter-link strong { display: block; font-size: 15px; line-height: 1.4; }\n.chapter-link small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.4; }\n.chapter-status { display: inline-block; margin-top: 4px; color: var(--bull); font-size: 12px; font-weight: 800; }\n\n.overview-nav-btn {\n  display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px;\n  padding: 12px 14px; border: 1px solid #d9e3ff; border-radius: 14px;\n  background: #f6f9ff; color: var(--accent); font-size: 14px; font-weight: 800; text-align: left;\n  transition: .18s ease;\n}\n.overview-nav-btn:hover { background: var(--accent-soft); }\n.overview-nav-btn[aria-current=\"page\"] { background: var(--accent); color: #fff; border-color: var(--accent); }\n\n.progress-card {\n  margin-top: 22px; padding: 17px;\n  background: linear-gradient(145deg, #f6f8ff, #f0f5ff);\n  border: 1px solid #e0e8fb; border-radius: 18px;\n}\n.progress-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 750; }\n.progress-track { height: 9px; margin-top: 11px; overflow: hidden; background: #dfe7f5; border-radius: 10px; }\n.progress-fill { width: 0; height: 100%; background: linear-gradient(90deg, #4779ee, #6a9bfa); border-radius: inherit; transition: width .25s ease; }\n.progress-hint { margin-top: 9px; color: var(--muted); font-size: 13px; line-height: 1.55; }\n\n/* Hide Mobile-Only UI Elements on PC */\n.mobile-chapters,\n.mobile-drawer-toggle,\n.mobile-drawer-backdrop,\n.mobile-drawer-sheet,\n.mobile-bottom-dock { display: none; }\n\n.main { min-width: 0; padding: 28px clamp(20px, 3.6vw, 52px) 70px; }\n.content { width: min(100%, var(--content-width)); margin: 0 auto; }\n.topbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 0 0 12px; }\n.eyebrow { color: #73819a; font-size: 12.5px; font-weight: 850; letter-spacing: .14em; }\n.topbar-right { color: var(--muted); font-size: 13px; font-weight: 800; }\n\n.hero {\n  position: relative; overflow: hidden; margin: 12px 0 24px; padding: 32px 36px 26px;\n  border-radius: 26px; color: white;\n  background: line
