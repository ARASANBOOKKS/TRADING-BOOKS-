root[data-theme=\"dark\"] .quiz-summary, :root[data-theme=\"dark\"] .practice-card {\n  background: #111827; border-color: #233047; box-shadow: 0 8px 22px rgba(0, 0, 0, .25);\n}\n:root[data-theme=\"dark\"] #topic .card { background: linear-gradient(120deg, #111827, #162033); border-left-color: #60a5fa; }\n:root[data-theme=\"dark\"] #topic .card:before { color: #93c5fd; }\n:root[data-theme=\"dark\"] .section-heading h2 { color: #f1f5f9; }\n:root[data-theme=\"dark\"] .section-index { background: rgba(96, 165, 250, .16); color: #93c5fd; }\n:root[data-theme=\"dark\"] .info-item { border-bottom-color: #1e293b; }\n:root[data-theme=\"dark\"] .info-item strong:before { background: rgba(96, 165, 250, .18); color: #93c5fd; }\n:root[data-theme=\"dark\"] .figure-card, :root[data-theme=\"dark\"] .simulator { background: linear-gradient(160deg, #111827, #151e30); border-color: #233047; }\n:root[data-theme=\"dark\"] .figure-wrap, :root[data-theme=\"dark\"] .sim-svg, :root[data-theme=\"dark\"] .anim-illus-box, :root[data-theme=\"dark\"] .practice-svg, :root[data-theme=\"dark\"] .overview-card svg {\n  background: #0b1120; border-color: #1e293b;\n}\n:root[data-theme=\"dark\"] .readouts { background: #0f172a; border-color: #1e293b; }\n:root[data-theme=\"dark\"] .mobile-live-note { background: linear-gradient(120deg, rgba(96, 165, 250, .16), #162033); border-left-color: #60a5fa; }\n:root[data-theme=\"dark\"] .diagram-explanation, :root[data-theme=\"dark\"] .live-guide, :root[data-theme=\"dark\"] .instructor, :root[data-theme=\"dark\"] .formation-check {\n  background: #162033; border-color: #26354d;\n}\n:root[data-theme=\"dark\"] .change-item { background: rgba(15, 23, 42, .75); border-color: #26354d; }\n:root[data-theme=\"dark\"] .answer-option { background: #162033; border-color: #26354d; color: #e2e8f0; }\n:root[data-theme=\"dark\"] .answer-option:hover:not(:disabled) { background: #1e293b; border-color: #60a5fa; }\n:root[data-theme=\"dark\"] .answer-option.correct { background: rgba(52, 211, 153, .16); border-color: #34d399; color: #6ee7b7; }\n:root[data-theme=\"dark\"] .answer-option.incorrect { background: rgba(251, 113, 133, .16); border-color: #fb7185; color: #fda4af; }\n:root[data-theme=\"dark\"] .overview-nav-btn { background: rgba(96, 165, 250, .12); border-color: rgba(96, 165, 250, .3); color: #93c5fd; }\n:root[data-theme=\"dark\"] .overview-nav-btn[aria-current=\"page\"] { background: #2563eb; color: #fff; border-color: #2563eb; }\n:root[data-theme=\"dark\"] .disclaimer { background: rgba(17, 24, 39, .75); color: #94a3b8; }\n.zones-card-btn { background: #f8faff; border-color: #e3ebfa; }\n:root[data-theme=\"dark\"] .zones-card-btn { background: rgba(96, 165, 250, .10); border-color: rgba(96, 165, 250, .25); }\n:root[data-theme=\"dark\"] .zones-card-btn[aria-current=\"page\"] { background: linear-gradient(110deg, rgba(59, 130, 246, .24), rgba(59, 130, 246, .12)); border-color: rgba(96, 165, 250, .45); }\n:root[data-theme=\"dark\"] .btn { background: #162033; border-color: #334155; color: #f1f5f9; }\n:root[data-theme=\"dark\"] .btn:hover:not(:disabled) { background: #1e293b; border-color: #60a5fa; }\n:root[data-theme=\"dark\"] .btn-primary { background: linear-gradient(110deg, #2563eb, #3b82f6); border-color: #2563eb; color: #fff; }\n:root[data-theme=\"dark\"] .speed-select, :root[data-theme=\"dark\"] .mobile-chapters { background: #162033; border-color: #334155; color: #f1f5f9; }\n:root[data-theme=\"dark\"] .theme-toggle, :root[data-theme=\"dark\"] .device-toggle { background: #162033; border-color: #334155; color: #f1f5f9; }\n:root[data-theme=\"dark\"] .illus-tab, :root[data-theme=\"dark\"] .practice-level-btn { background: #162033; border-color: #334155; color: #cbd5e1; }\n:root[data-theme=\"dark\"] .illus-tab.active, :root[data-theme=\"dark\"] .practice-level-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }\n:root[data-theme=\"dark\"] .practice-level-btn.done { background: rgba(52, 211, 153, .14); border-color: #34d399; color: #6ee7b7; }\n:root[data-theme=\"dark\"] .practice-level-btn.done.active { background: #10b981; border-color: #10b981; color: #fff; }\n:root[data-theme=\"dark\"] .chapter-link:hover { background: #162033; }\n:root[data-theme=\"dark\"] .chapter-link strong { color: #f1f5f9; }\n:root[data-theme=\"dark\"] .chapter-link small, :root[data-theme=\"dark\"] .chapter-number { color: #94a3b8; }\n\n.ysk-container .hero { background: linear-gradient(118deg, #3b1f0b 0%, #854d0e 60%, #ca8a04 100%) !important; }\n:root[data-theme=\"dark\"] .ysk-container .hero { background: linear-gradient(118deg, #291505 0%, #713f12 60%, #a16207 100%) !important; }\n.ysk-container .section-index { background: #fef08a !important; color: #854d0e !important; }\n.ysk-container #topic .card { border-left-color: #eab308 !important; background: linear-gradient(120deg, var(--surface), #fffbeb) !important; }\n:root[data-theme=\"dark\"] .ysk-container #topic .card { background: linear-gradient(120deg, var(--surface), #1c1505) !important; }\n\n/* Publisher subtitle & unified mobile elements */\n.brand-publisher { display: block; margin-top: 6px; color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .14em; }\n.mobile-live-note { display: none; }\n.mobile-progress-bar { display: none; }\n.formation-feedback.good { color: var(--bull-dark); font-weight: 650; }\n.formation-feedback.bad { color: var(--bear-dark); font-weight: 650; }\n:root[data-theme=\"dark\"] .feedback.good { background: rgba(52, 211, 153, .16); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, .35); }\n:root[data-theme=\"dark\"] .feedback.bad { background: rgba(251, 113, 133, .16); color: #fda4af; border: 1px solid rgba(251, 113, 133, .35); }\n:root[data-theme=\"dark\"] .quiz-xp { background: rgba(251, 191, 36, .16); color: #fde68a; }\n\n/* Unified Mobile Layout UI \u2014 Keeps our version's mobile layout while preserving original full-size illustrations */\n@media (max-width: 820px) {\n  #mobileThemeToggle { display: inline-flex; }\n  #desktopThemeToggle { display: none; }\n  .app-shell { display: block; }\n  .sidebar {\n    position: relative; top: auto; z-index: auto; width: 100%; height: auto;\n    padding: 12px 14px; border-right: 0; border-bottom: 1px solid var(--line);\n    box-shadow: 0 4px 16px rgba(15, 23, 42, .06);\n  }\n  .sidebar-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n  .brand { padding: 0; border: 0; }\n  .brand-name { font-size: 18px; }\n  .brand-sub { display: none; }\n  .brand-publisher { display: inline; margin-left: 8px; font-size: 10px; }\n  .nav-label, .chapter-nav, .overview-nav-btn, .progress-card { display: none; }\n  .mobile-chapters {\n    display: block; width: 100%; margin-top: 10px; padding: 10px 12px;\n    border: 1px solid var(--line-strong); border-radius: 12px;\n    background: var(--surface-muted); color: var(--ink); font-size: 15px; font-weight: 700;\n  }\n  .mobile-progress-bar {\n    display: flex; align-items: center; gap: 10px; margin-top: 8px;\n    font-size: 11px; font-weight: 800; color: var(--muted);\n  }\n  .mobile-progress-bar .progress-track { flex: 1; margin-top: 0; height: 6px; }\n  .main { padding: 14px 10px 40px; overflow-x: hidden; }\n  .topbar { padding-bottom: 6px; flex-wrap: wrap; gap: 6px; }\n  .eyebrow { font-size: 11px; }\n  .hero { margin-top: 8px; padding: 20px 16px 18px; border-radius: 18px; }\n  .hero h1 { font-size: 26px; }\n  .hero .lead { font-size: 15px; line-height: 1.6; }\n  .journey-strip { gap: 4px; margin-top: 14px; overflow-x: auto; }\n  .journey-step { font-size: 10.5px; gap: 3px; }\n  .journey-step span { width: 20px; height: 20px; }\n  .lesson-section { margin-top: 18px; scroll-margin-top: 12px; }\n  .section-heading { margin-bottom: 8px; }\n  .section-heading h2 { font-size: 19px; }\n  .card, .practice-card, .quiz-card { padding: 14px; border-radius: 16px; }\n  #topic .card { padding: 18px 18px 18px 20px; }\n  .prose { font-size: 15.5px; line-height: 1.65; }\n  .info-list { grid-template-columns: 1fr; padding: 6px 14px; }\n  .info-item { padding: 14px 2px; }\n  .info-item:nth-last-child(2) { border-bottom: 1px solid #edf0f5; }\n  :root[data-theme=\"dark\"] .info-item:nth-last-child(2) { border-bottom-color: #1e293b; }\n\n  /* Full-size mobile illustrations restored to original Support & Resistance dimensions */\n  .figure-card { padding: 10px; }\n  .illus-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; padding-bottom: 10px; }\n  .illus-tab { padding: 8px 8px; font-size: 12px; line-height: 1.3; text-align: center; }\n  .figure-wrap { min-height: 215px; padding: 4px; border-radius: 12px; }\n  .figure-wrap svg { width: 100%; max-width: 100%; height: auto; min-height: 205px; }\n  .anim-illus-grid { grid-template-columns: 1fr; gap: 10px; }\n  .anim-illus-box { padding: 4px; border-radius: 12px; }\n  .anim-illus-box svg { width: 100%; max-width: 100%; height: auto; min-height: 205px; }\n  .live-guide { padding: 12px 14px; grid-template-columns: 1fr; gap: 10px; }\n  .live-guide h3 { font-size: 16px; margin: 4px 0; }\n  .live-guide p { min-height: 0; font-size: 13.5px; line-height: 1.5; margin-bottom: 8px; }\n  .live-step-pills { max-width: 100%; margin-bottom: 4px; }\n  .live-guide .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n\n  /* Simultaneous Chart + Instructor below on mobile with full-size chart SVG */\n  .animation-grid { display: flex !important; flex-direction: column !important; gap: 10px !important; }\n  .simulator { padding: 10px; }\n  .stage-title { font-size: 17px; margin-top: 4px; }\n  .sim-svg { width: 100%; max-width: 100%; height: auto; min-height: 220px; margin-top: 6px; border-radius: 12px; }\n  .simulator .figure-caption { display: none; }\n  .mobile-live-note { display: none !important; }\n  .readouts { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 8px 6px; margin-top: 6px; }\n  .readout span { font-size: 9.5px; }\n  .readout strong { font-size: 13px; margin-top: 2px; }\n  .stage-track { margin: 10px 0; }\n  .controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }\n  .controls .btn { width: 100%; min-height: 40px; padding: 6px 4px; font-size: 12.5px; }\n  .controls .speed-select { grid-column: 1 / -1; width: 100%; min-height: 38px; font-size: 13px; }\n  .stage-count { margin-top: 8px; font-size: 12px; }\n  .instructor { padding: 14px; margin-top: 0; }\n  .instructor-top { grid-template-columns: 1fr; gap: 10px; }\n  .instructor h3 { font-size: 17px; margin: 6px 0; }\n  .instructor-copy { min-height: 0; font-size: 14px; line-height: 1.55; }\n  .change-grid { grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }\n  .change-item { padding: 10px; font-size: 13px; }\n\n  /* Full-size mobile practice chart */\n  .practice-level-tabs { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; padding-bottom: 10px; }\n  .practice-level-btn { padding: 9px 12px; font-size: 13px; text-align: left; }\n  .practice-svg { width: 100%; max-width: 100%; height: auto; min-height: 225px; border-radius: 12px; }\n  .practice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n  .practice-actions .btn { width: 100%; min-height: 42px; font-size: 13px; }\n  .overview-grid { grid-template-columns: 1fr; }\n  .footer-nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }\n  .footer-nav .btn { flex: 1 1 45%; min-height: 44px; font-size: 14px; }\n  .footer-note { width: 100%; order: -1; margin-bottom: 4px; text-align: center; }\n}\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }\n}\n</style>\n</head>\n<body>\n<div class=\"app-shell\" id=\"srApp\">\n  <aside class=\"sidebar\">\n    <div class=\"sidebar-top-row\">\n      <div class=\"brand\">\n        <span class=\"brand-name\">SUPPORT &amp; RESISTANCE</span>\n        <span class=\"brand-sub\">THE TRADING PRIMER</span>\n        <span class=\"brand-publisher\">\u2014 BY TRADING BOOKS</span>\n      </div>\n      <button type=\"button\" class=\"theme-toggle\" id=\"mobileThemeToggle\" aria-label=\"Toggle dark or light mode\">\ud83c\udf19 Dark</button>\n    </div>\n    <div class=\"nav-label\">THE LEARNING BOOK</div>\n    <nav class=\"chapter-nav\" id=\"chapterNav\" aria-label=\"Chapters\"></nav>\n    <button type=\"button\" class=\"overview-nav-btn\" id=\"overviewBtn\">\ud83d\udccb Overview Card</button>\n    <button type=\"button\" class=\"overview-nav-btn\" id=\"youShouldKnowBtn\" style=\"margin-top:8px;\">\ud83d\udca1 You Should Know</button>\n    <select class=\"mobile-chapters\" id=\"mobileChapter\" aria-label=\"Choose a chapter\"></select>\n    <div class=\"mobile-progress-bar\" aria-hidden=\"true\">\n      <span id=\"mobileProgressLabel\">0 / 5</span>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"mobileProgressFill\"></div></div>\n    </div>\n    <div class=\"progress-card\">\n      <div class=\"progress-meta\"><span>Learning progress</span><span id=\"progressLabel\">0 / 5</span></div>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progressFill\"></div></div>\n      <div class=\"progress-hint\">Pass all three questions in a chapter to mark it complete.</div>\n    </div>\n  </aside>\n\n  <main class=\"main\">\n    <div class=\"content\">\n      <header class=\"topbar\">\n        <span class=\"eyebrow\">INTERACTIVE EDUCATION \u00b7 BEGINNER LEVEL</span>\n        <div class=\"topbar-actions\">\n          <span class=\"topbar-right\" id=\"chapterCounter\">CHAPTER 01 / 05</span>\n          <button type=\"button\" class=\"theme-toggle\" id=\"desktopThemeToggle\" aria-label=\"Toggle dark or light mode\">\ud83c\udf19 Dark</button>\n        </div>\n      </header>\n      <div id=\"lessonContent\"></div>\n    </div>\n  </main>\n</div>\n\n<script>\n/* ==========================================================================\n   ZERO-OVERLAP 5-LANE CANDLESTICK ANIMATION ENGINE (820 x 420 VIEWBOX)\n   Strict Spatial Separation (Mathematically 0 Overlaps):\n   - Lane 1 (Top Callout Band, y = 12..40): Exclusively for top labels with horizontal gap solver\n   - Lane 2 (Left Axis, x = 8..60): Grid prices & Zone price pills (auto-hides colliding grid numbers)\n   - Lane 3 (Candle Arena, x = 86..608, y = 78..342): Candlesticks, wicks, and pulsing touch rings\n   - Lane 4 (Right Zone Projection, x = 614..754, y = 78..342): Zone label badges in open chart space\n   - Lane 5 (Right Live Price Axis, x = 760..812) & Bottom Callout Band (y = 380..408)\n   ========================================================================== */\nfunction formatZoneTag(zLabel, midPrice) {\n  const s = String(zLabel || \"\").toUpperCase();\n  if (s.includes(\"STRONGEST\") && s.includes(\"RESIST\")) return `STRONG RES \u00b7 ${midPrice}`;\n  if (s.includes(\"STRONGEST\") && s.includes(\"SUPPORT\")) return `STRONG SUP \u00b7 ${midPrice}`;\n  if (s.includes(\"HIGHEST\") && s.includes(\"RESIST\")) return `HIGHEST RES \u00b7 ${midPrice}`;\n  if (s.includes(\"LOWEST\") && s.includes(\"SUPPORT\")) return `LOWEST SUP \u00b7 ${midPrice}`;\n  if (s.includes(\"FLIP\") && s.includes(\"SUPPORT\")) return `NEW SUPPORT \u00b7 ${midPrice}`;\n  if (s.includes(\"FLIP\") && s.includes(\"RESIST\")) return `NEW RESIST \u00b7 ${midPrice}`;\n  if (s.includes(\"NEW SUPPORT\")) return `NEW SUPPORT \u00b7 ${midPrice}`;\n  if (s.includes(\"NEW RESIST\")) return `NEW RESIST \u00b7 ${midPrice}`;\n  if (s.includes(\"RESIST\")) return `RESISTANCE \u00b7 ${midPrice}`;\n  if (s.includes(\"SUPPORT\")) return `SUPPORT \u00b7 ${midPrice}`;\n  return `${s.slice(0, 14)} \u00b7 ${midPrice}`;\n}\n\nfunction layoutCalloutLane(items, minX, maxX) {\n  if (!items.length) return [];\n  const sorted = items.slice().sort((a, b) => a.lx - b.lx);\n  const gap = 10;\n  // Initial desired placement centered on anchor lx\n  sorted.forEach(item => {\n    item.x = Math.max(minX, Math.min(maxX - item.w, item.lx - item.w / 2));\n  });\n  // Forward pass: push right to eliminate any overlap\n  for (let i = 1; i < sorted.length; i++) {\n    const prev = sorted[i - 1];\n    if (sorted[i].x < prev.x + prev.w + gap) {\n      sorted[i].x = prev.x + prev.w + gap;\n    }\n  }\n  // Backward pass: clamp to maxX and push left if needed\n  if (sorted[sorted.length - 1].x + sorted[sorted.length - 1].w > maxX) {\n    sorted[sorted.length - 1].x = maxX - sorted[sorted.length - 1].w;\n  }\n  for (let i = sorted.length - 2; i >= 0; i--) {\n    const next = sorted[i + 1];\n    if (sorted[i].x + sorted[i].w + gap > next.x) {\n      sorted[i].x = next.x - sorted[i].w - gap;\n    }\n  }\n  // Final left clamp\n  if (sorted[0].x < minX) {\n    sorted[0].x = minX;\n    for (let i = 1; i < sorted.length; i++) {\n      const prev = sorted[i - 1];\n      if (sorted[i].x < prev.x + prev.w + gap) {\n        sorted[i].x = prev.x + prev.w + gap;\n      }\n    }\n  }\n  return sorted;\n}\n\nfunction renderCandleChartSVG({\n  candles,\n  line = null,\n  line2 = null,\n  hz = null,\n  hz2 = null,\n  zone = null,\n  zone2 = null,\n  labels = [],\n  arrows = [],\n  min = 92,\n  max = 148\n}) {\n  const w = 820, h = 420, padTop = 78, padBot = 78;\n  const leftX = 68, candleLeft = 88, candleRight = 606, rightX = 754;\n  const sx = x => Math.round((candleLeft + ((x - 36) / 356) * (candleRight - candleLeft)) * 10) / 10;\n  const y = v => Math.round(((h - padBot) - ((v - min) / Math.max(1, max - min)) * (h - padTop - padBot)) * 10) / 10;\n\n  const gridVals = [\n    Math.round(min + (max - min) * 0.18),\n    Math.round(min + (max - min) * 0.5),\n    Math.round(min + (max - min) * 0.82)\n  ];\n\n  // Collect zone midY values so grid labels on the left axis never collide with zone price pills\n  const zoneMidYs = [];\n  if (zone) zoneMidYs.push(Math.round((y(zone[1]) + y(zone[0])) / 2));\n  if (zone2) zoneMidYs.push(Math.round((y(zone2[1]) + y(zone2[0])) / 2));\n\n  let out = `\n    <defs>\n      <marker id=\"arrowBull\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\">\n        <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"var(--bull)\"/>\n      </marker>\n      <marker id=\"arrowBear\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\">\n        <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"var(--bear)\"/>\n      </marker>\n    </defs>\n    <!-- Subtle Top & Bottom Callout Lane Divider Lines -->\n    <rect x=\"${leftX}\" y=\"52\" width=\"${rightX - leftX}\" height=\"316\" rx=\"10\" fill=\"var(--surface-muted)\" opacity=\"0.32\"/>\n  `;\n\n  // Horizontal Grid Lines (auto-hide left number if a Zone Price Tag sits within 20px)\n  out += gridVals.map(v => {\n    const gy = y(v);\n    const hideText = zoneMidYs.some(zy => Math.abs(zy - gy) < 22);\n    return `\n      <line x1=\"${leftX}\" x2=\"${rightX}\" y1=\"${gy}\" y2=\"${gy}\" stroke=\"var(--line)\" stroke-width=\"1.2\" stroke-dasharray=\"4 6\"/>\n      ${hideText ? \"\" : `<text x=\"${leftX - 12}\" y=\"${gy + 4}\" text-anchor=\"end\" fill=\"var(--muted)\" font-size=\"12.5\" font-weight=\"750\">${v}</text>`}\n    `;\n  }).join(\"\");\n\n  // Glowing Shaded Support / Resistance Zones with Right-Projection Badge (x = 614..750)\n  function drawZoneBand(z) {\n    if (!z) return \"\";\n    const [zLow, zHigh, zCol, zLabel] = z;\n    const topY = y(zHigh), botY = y(zLow);\n    const midY = Math.round((topY + botY) / 2);\n    const bandH = Math.max(18, botY - topY);\n    const midPrice = Math.round((zLow + zHigh) / 2);\n    const fillCol = zCol === \"bull\" ? \"var(--bull-soft)\" : zCol === \"bear\" ? \"var(--bear-soft)\" : \"var(--accent-soft)\";\n    const strokeCol = zCol === \"bull\" ? \"var(--bull)\" : zCol === \"bear\" ? \"var(--bear)\" : \"var(--accent)\";\n    const textCol = zCol === \"bull\" ? \"var(--bull-dark)\" : zCol === \"bear\" ? \"var(--bear)\" : \"var(--accent)\";\n    const shortTag = formatZoneTag(zLabel, midPrice);\n\n    return `\n      <rect class=\"svg-zone-band\" x=\"${leftX}\" y=\"${topY}\" width=\"${rightX - leftX}\" height=\"${bandH}\" rx=\"6\" fill=\"${fillCol}\"/>\n      <line class=\"svg-marching-border\" x1=\"${leftX}\" y1=\"${topY}\" x2=\"${rightX}\" y2=\"${topY}\" stroke=\"${strokeCol}\" stroke-width=\"2.2\"/>\n      <line class=\"svg-marching-border\" x1=\"${leftX}\" y1=\"${botY}\" x2=\"${rightX}\" y2=\"${botY}\" stroke=\"${strokeCol}\" stroke-width=\"2.2\"/>\n      <!-- Left Axis Zone Price Pill -->\n      <rect x=\"10\" y=\"${midY - 12}\" width=\"48\" height=\"24\" rx=\"6\" fill=\"${strokeCol}\"/>\n      <text x=\"34\" y=\"${midY + 4}\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"900\">${midPrice}</text>\n      <!-- Right Projection Lane Zone Badge (Never overlaps candles or callouts!) -->\n      <rect x=\"614\" y=\"${midY - 13}\" width=\"136\" height=\"26\" rx=\"7\" fill=\"var(--surface)\" stroke=\"${strokeCol}\" stroke-width=\"2\"/>\n      <text x=\"682\" y=\"${midY + 4}\" text-anchor=\"middle\" fill=\"${textCol}\" font-size=\"11\" font-weight=\"900\" letter-spacing=\".03em\">${esc(shortTag)}</text>\n    `;\n  }\n\n  out += drawZoneBand(zone);\n  out += drawZoneBand(zone2);\n\n  if (hz !== null) {\n    out += `<line class=\"svg-animated-line\" x1=\"${leftX}\" x2=\"${rightX}\" y1=\"${y(hz)}\" y2=\"${y(hz)}\" stroke=\"var(--bear)\" stroke-width=\"3.2\"/>`;\n  }\n  if (hz2 !== null) {\n    out += `<line class=\"svg-animated-line\" x1=\"${leftX}\" x2=\"${rightX}\" y1=\"${y(hz2)}\" y2=\"${y(hz2)}\" stroke=\"var(--bull)\" stroke-width=\"3.2\"/>`;\n  }\n  if (line) {\n    const [x1, p1, x2, p2, dashed] = line;\n    out += `<line class=\"svg-animated-line\" x1=\"${sx(x1)}\" y1=\"${y(p1)}\" x2=\"${sx(x2)}\" y2=\"${y(p2)}\" stroke=\"var(--bull)\" stroke-width=\"3.8\" stroke-linecap=\"round\" ${dashed ? 'stroke-dasharray=\"8 6\"' : ''}/>`;\n  }\n  if (line2) {\n    const [x1, p1, x2, p2, dashed] = line2;\n    out += `<line class=\"svg-animated-line\" x1=\"${sx(x1)}\" y1=\"${y(p1)}\" x2=\"${sx(x2)}\" y2=\"${y(p2)}\" stroke=\"var(--bear)\" stroke-width=\"3.8\" stroke-linecap=\"round\" ${dashed ? 'stroke-dasharray=\"8 6\"' : ''}/>`;\n  }\n\n  // Smooth price path connecting candle closes\n  if (candles.length > 1) {\n    const pts = candles.map(c => `${sx(c[0])},${y(c[4])}`).join(\" \");\n    out += `<polyline points=\"${pts}\" fill=\"none\" stroke=\"var(--subtle)\" stroke-width=\"2\" stroke-dasharray=\"4 4\" opacity=\"0.5\"/>`;\n  }\n\n  // Live Current Price Tracker Line & Far-Right Axis Pill (x = 760..810)\n  const lastCandle = candles && candles.length ? candles[candles.length - 1] : null;\n  if (lastCandle) {\n    const curPrice = lastCandle[4];\n    const curY = y(curPrice);\n    const isBullCur = lastCandle[4] >= lastCandle[1];\n    const curCol = isBullCur ? \"var(--bull)\" : \"var(--bear)\";\n    out += `\n      <line x1=\"${sx(lastCandle[0])}\" x2=\"${rightX + 6}\" y1=\"${curY}\" y2=\"${curY}\" stroke=\"${curCol}\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\" opacity=\"0.75\"/>\n      <rect x=\"${rightX + 6}\" y=\"${curY - 12}\" width=\"50\" height=\"24\" rx=\"6\" fill=\"${curCol}\"/>\n      <text x=\"${rightX + 31}\" y=\"${curY + 4}\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"11.5\" font-weight=\"900\">${curPrice}</text>\n    `;\n  }\n\n  // Render Candlesticks inside Candle Arena (x = 88..606)\n  candles.forEach((c, idx) => {\n    const [rawX, o, hi, lo, cl] = c;\n    const cx = sx(rawX);\n    const col = cl >= o ? \"var(--bull)\" : \"var(--bear)\";\n    const bTop = y(Math.max(o, cl)), bBot = y(Math.min(o, cl));\n    const bH = Math.max(6, bBot - bTop);\n    const isLatest = idx === candles.length - 1;\n    if (isLatest) {\n      out += `\n        <rect x=\"${cx - 16}\" y=\"${padTop - 10}\" width=\"32\" height=\"${h - padTop - padBot + 20}\" rx=\"8\" fill=\"var(--accent-soft)\" opacity=\"0.38\"/>\n        <g class=\"svg-candle-latest\">\n          <line x1=\"${cx}\" x2=\"${cx}\" y1=\"${y(hi)}\" y2=\"${y(lo)}\" stroke=\"${col}\" stroke-width=\"3.2\" stroke-linecap=\"round\"/>\n          <rect x=\"${cx - 10}\" y=\"${bTop}\" width=\"20\" height=\"${bH}\" rx=\"3.5\" fill=\"${col}\" stroke=\"#fff\" stroke-width=\"1.2\"/>\n        </g>\n      `;\n    } else {\n      out += `\n        <line x1=\"${cx}\" x2=\"${cx}\" y1=\"${y(hi)}\" y2=\"${y(lo)}\" stroke=\"${col}\" stroke-width=\"2.8\" stroke-linecap=\"round\"/>\n        <rect x=\"${cx - 9.5}\" y=\"${bTop}\" width=\"19\" height=\"${bH}\" rx=\"3\" fill=\"${col}\"/>\n      `;\n    }\n  });\n\n  arrows.forEach(a => {\n    const [x1, p1, x2, p2, col, txt] = a;\n    const strokeCol = col === \"bull\" ? \"var(--bull)\" : \"var(--bear)\";\n    const markerId = col === \"bull\" ? \"url(#arrowBull)\" : \"url(#arrowBear)\";\n    const ax1 = sx(x1), ay1 = y(p1), ax2 = sx(x2), ay2 = y(p2);\n    out += `\n      <line x1=\"${ax1}\" y1=\"${ay1}\" x2=\"${ax2}\" y2=\"${ay2}\" stroke=\"${strokeCol}\" stroke-width=\"3.4\" stroke-dasharray=\"6 5\" marker-end=\"${markerId}\" stroke-linecap=\"round\"/>\n      <text x=\"${ax2 + 8}\" y=\"${ay2 + 4}\" fill=\"${strokeCol}\" font-size=\"12.5\" font-weight=\"900\">${esc(txt)}</text>\n    `;\n  });\n\n  // Render Callout Pills strictly in Dedicated Top Band (y=12..40) & Bottom Band (y=380..408)\n  const topRaw = [], botRaw = [];\n  labels.forEach((lb, idx) => {\n    const [rawX, lp, text, type, pos] = lb;\n    const lx = sx(rawX);\n    const cy = y(lp);\n    const col = type === \"bull\" ? \"var(--bull-dark)\" : type === \"bear\" ? \"var(--bear)\" : type === \"focus\" ? \"var(--focus)\" : \"var(--accent)\";\n    const dotCol = type === \"bull\" ? \"var(--bull)\" : type === \"bear\" ? \"var(--bear)\" : type === \"focus\" ? \"var(--focus)\" : \"var(--accent)\";\n    const isFeatured = idx === labels.length - 1 || type === \"focus\";\n    const fullText = String(text);\n    const pillW = Math.round(Math.max(82, fullText.length * 7.6 + 22));\n    const item = { lx, cy, text: fullText, col, dotCol, isFeatured, w: pillW, h: 28, pos };\n    if (pos === \"top\") topRaw.push(item);\n    else botRaw.push(item);\n  });\n\n  const topPlaced = layoutCalloutLane(topRaw, leftX + 4, rightX - 4);\n  const botPlaced = layoutCalloutLane(botRaw, leftX + 4, rightX - 4);\n\n  function renderPlacedCallout(item, pillY, isTop) {\n    const pillCenterX = Math.round(item.x + item.w / 2);\n    const stemStartY = isTop ? pillY + item.h : pillY;\n    const kneeY = isTop ? pillY + item.h + 10 : pillY - 10;\n    const dotEdgeY = isTop ? item.cy - 8 : item.cy + 8;\n    const pathD = `M ${pillCenterX} ${stemStartY} L ${pillCenterX} ${kneeY} L ${item.lx} ${dotEdgeY}`;\n    return `\n      ${item.isFeatured ? `<circle class=\"svg-pulse-ring\" cx=\"${item.lx}\" cy=\"${item.cy}\" r=\"14\" fill=\"none\" stroke=\"${item.dotCol}\" stroke-width=\"2.5\"/>` : \"\"}\n      <path d=\"${pathD}\" fill=\"none\" stroke=\"${item.dotCol}\" stroke-width=\"2\" stroke-dasharray=\"3 2\" opacity=\"0.88\"/>\n      <circle cx=\"${item.lx}\" cy=\"${item.cy}\" r=\"${item.isFeatured ? 7.5 : 6.5}\" fill=\"${item.dotCol}\" stroke=\"#fff\" stroke-width=\"2.2\"/>\n      <g class=\"svg-badge-pop\">\n        <rect x=\"${Math.round(item.x)}\" y=\"${pillY}\" width=\"${item.w}\" height=\"${item.h}\" rx=\"7\" fill=\"var(--surface)\" stroke=\"${item.dotCol}\" stroke-width=\"${item.isFeatured ? 2.4 : 1.8}\"/>\n        <text x=\"${pillCenterX}\" y=\"${pillY + 18.5}\" text-anchor=\"middle\" fill=\"${item.col}\" font-size=\"12\" font-weight=\"850\">${esc(item.text)}</text>\n      </g>\n    `;\n  }\n\n  topPlaced.forEach(item => { out += renderPlacedCallout(item, 12, true); });\n  botPlaced.forEach(item => { out += renderPlacedCallout(item, 380, false); });\n\n  return out;\n}\n\n/* ==========================================================================\n   CONTENT MODEL \u2014 BEGINNER SUPPORT & RESISTANCE (UNCHANGED CONTENT)\n   ========================================================================== */\nconst LESSONS = [\n  {\n    id: \"what-is-sr\",\n    number: \"01\",\n    title: \"What Are Support & Resistance?\",\n    navTitle: \"What Are Support & Resistance?\",\n    navDescription: \"Definition & how it works\",\n    kicker: \"CHAPTER 01 \u00b7 THE BASICS\",\n    introduction: \"Let's start super simple. Learn what Support is, what Resistance is, watch a full step-by-step animation of both forming on a chart, and try marking all 3 levels yourself!\",\n    topic: \"Support is a price FLOOR below the candles where price stops falling and bounces UP. Resistance is a price CEILING above the candles where price stops rising and drops DOWN.\",\n    information: [\n      { title: \"What is Support? (The Floor)\", text: \"Support is a horizontal line or zone underneath the candles. When price falls down to Support, buyers step in and push price back UP.\" },\n      { title: \"What is Resistance? (The Ceiling)\", text: \"Resistance is a horizontal line or zone above the candles. When price climbs up to Resistance, sellers step in and push price back DOWN.\" },\n      { title: \"2 points draw, 3 touches confirm\", text: \"You connect 2 lows at the same level to draw Support, or 2 highs at the same level to draw Resistance. A 3rd bounce confirms it!\" },\n      { title: \"Touch and bounce back\", text: \"Think of a ball bouncing inside a room: it bounces UP off the Floor (Support) and bounces DOWN off the Ceiling (Resistance).\" }\n    ],\n    diagram: {\n      caption: \"Click any badge or glowing point on the illustration above to see how Support and Resistance work.\",\n      parts: {\n        res: [\"What Is Resistance? (The Ceiling)\", \"The horizontal level at the top where rising candles hit a ceiling, stop going up, and drop back down.\"],\n        sup: [\"What Is Support? (The Floor)\", \"The horizontal level at the bottom where falling candles hit a floor, stop going down, and bounce back up.\"],\n        b1: [\"Support Bounce (\u25b2 Buyers Step In)\", \"Price falls down to the Support Floor at 100, touches it, and buyers push green candles back up.\"],\n        r1: [\"Resistance Rejection (\u25bc Sellers Step In)\", \"Price climbs up to the Resistance Ceiling at 128, touches it, and sellers push red candles back down.\"],\n        mid: [\"Price Moving Between Floor & Ceiling\", \"Price travels smoothly up from the 100 Support Floor and down from the 128 Resistance Ceiling.\"]\n      }\n    },\n    animatedIllus: {\n      steps: [\n        { title: \"Step 1: What is Support? (The Floor)\", text: \"Price falls to the bottom Floor (Support at 100), stops dropping, and bounces upward.\", hl: \"sup\" },\n        { title: \"Step 2: What is Resistance? (The Ceiling)\", text: \"Price climbs to the top Ceiling (Resistance at 128), stops rising, and drops downward.\", hl: \"res\" },\n        { title: \"Step 3: Support bounces price UP (\u25b2)\", text: \"Every time candles return to the Support Floor, buyers step in and bounce price back up!\", hl: \"b1\" },\n        { title: \"Step 4: Resistance pushes price DOWN (\u25bc)\", text: \"Every time candles return to the Resistance Ceiling, sellers step in and push price back down!\", hl: \"r1\" }\n      ]\n    },\n    chartSim: {\n      tag: \"EXTENDED 11-STAGE FORMATION ANIMATION\",\n      min: 94, max: 138,\n      stages: [\n        {\n          title: \"Stage 1: Price drops & finds Low 1 at 100\", cur: \"102\", p1: \"100\", p2: \"None\", status: \"Low 1\",\n          explanation: \"The chart starts. Red candles fall down to 100 and stop dropping\u2014creating our very first bottom turning point (Low 1).\",\n          changed: \"Low 1 forms at 100.\", unchanged: \"No lines can be drawn from 1 point yet.\",\n          candles: [[42,110,111,100,102]],\n          labels: [[42,100,\"Low 1: 100\",\"bull\",\"bot\"]]\n        },\n        {\n          title: \"Stage 2: Buyers push price up from 100\", cur: \"116\", p1: \"100\", p2: \"None\", status: \"Rising\",\n          explanation: \"Green candles bounce up from 100 and climb to 116.\",\n          changed: \"Price climbs to 116.\", unchanged: \"Low 1 stays at 100.\",\n          candles: [[42,110,111,100,102],[70,102,117,101,116]],\n          labels: [[42,100,\"Low 1: 100\",\"bull\",\"bot\"]]\n        },\n        {\n          title: \"Stage 3: Rally stalls at Peak 1 (128)\", cur: \"126\", p1: \"100\", p2: \"128\", status: \"Peak 1\",\n          explanation: \"Price reaches 128 and sellers step in\u2014creating our first top turning point (Peak 1 at 128).\",\n          changed: \"Peak 1 forms at 128.\", unchanged: \"Low 1 is at 100.\",\n          candles: [[42,110,111,100,102],[70,102,117,101,116],[98,116,128,115,126]],\n          labels: [[42,100,\"Low 1: 100\",\"bull\",\"bot\"],[98,128,\"Peak 1: 128\",\"bear\",\"top\"]]\n        },\n        {\n          title: \"Stage 4: Sellers push price back down\", cur: \"110\", p1: \"100\", p2: \"128\", status: \"Falling\",\n          explanation: \"Red candles drop price from 128 back down toward the 100 area.\",\n          changed: \"Price falls to 110.\", unchanged: \"Watching to see where the drop stops.\",\n          candles: [[42,110,111,100,102],[70,102,117,101,116],[98,116,128,115,126],[126,126,127,109,110]],\n          labels: [[42,100,\"Low 1: 100\",\"bull\",\"bot\"],[98,128,\"Peak 1: 128\",\"bear\",\"top\"]]\n        },\n        {\n          title: \"Stage 5: Second bounce at 100 \u2014 Draw Support!\", cur: \"106\", p1: \"100\", p2: \"128\", status: \"Support Drawn!\",\n          explanation: \"Price touches 100 a 2nd time and bounces! Connecting Low 1 (100) and Low 2 (100) draws our green SUPPORT FLOOR!\",\n          changed: \"Support Floor drawn at 100!\", unchanged: \"2 bottom touches at 100.\",\n          candles: [[42,110,111,100,102],[70,102,117,101,116],[98,116,128,115,126],[126,126,127,109,110],[154,11  LOWEST Support\", text: \"If a chart has a small Support in the middle and a major Support at the very bottom, the LOWEST Support is the strongest because buyers love the cheapest price.\" },\n    { title: \"Strongest Resistance = The HIGHEST Resistance\", text: \"If a chart has a small Resistance in the middle and a major Resistance at the very top, the HIGHEST Resistance is the strongest because sellers love the highest price.\" }\n  ],\n  diagram: {\n    caption: \"Click any level in the diagram to see why the Highest Resistance and Lowest Support are the strongest.\",\n    parts: {\n      strongres: [\"STRONGEST RESISTANCE (Highest Price)\", \"At the very top of the chart, sellers get the highest price to sell\u2014making the Highest Resistance the strongest ceiling!\"],\n      weakres: [\"Minor / Weak Resistance (Middle)\", \"A smaller peak in the middle is weaker because big sellers wait for the highest price at the top.\"],\n      weaksup: [\"Minor / Weak Support (Middle)\", \"A smaller dip in the middle is weaker because smart buyers wait for a cheaper price at the bottom.\"],\n      strongsup: [\"STRONGEST SUPPORT (Lowest Price)\", \"At the very bottom of the chart, buyers get the lowest price to buy\u2014making the Lowest Support the strongest floor!\"]\n    }\n  },\n  animatedIllus: {\n    steps: [\n      { title: \"Step 1: Buyer Logic\", text: \"Buyers always look for the LOWEST price to buy so they get the best bargain.\", hl: \"strongsup\" },\n      { title: \"Step 2: Lowest Support = Strongest\", text: \"Because buyers want the lowest price, the LOWEST Support at the bottom of the chart is the STRONGEST Support!\", hl: \"strongsup\" },\n      { title: \"Step 3: Seller Logic\", text: \"Sellers always look for the HIGHEST price to sell so they make the most profit.\", hl: \"strongres\" },\n      { title: \"Step 4: Highest Resistance = Strongest\", text: \"Because sellers want the highest price, the HIGHEST Resistance at the top of the chart is the STRO -anchor=\"middle\" fill=\"var(--bull-dark)\" font-size=\"12\" font-weight=\"900\">1. OLD SUPPORT (122)</text>\n    </g>\n\n    <g class=\"diagram-part ${sel(\"brk\")}\" data-part=\"brk\" ${dim(\"brk\")}>\n      <circle class=\"hit\" cx=\"440\" cy=\"284\" r=\"22\"/>\n      <line x1=\"440\" y1=\"356\" x2=\"440\" y2=\"292\" stroke=\"var(--bear)\" stroke-width=\"2\" stroke-dasharray=\"3 2\"/>\n      <circle class=\"node-dot\" cx=\"440\" cy=\"284\" r=\"8.5\" fill=\"var(--bear)\" stroke=\"#fff\" stroke-width=\"2.2\"/>\n      <rect class=\"pill-bg\" x=\"340\" y=\"356\" width=\"210\" height=\"28\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--bear)\" stroke-width=\"2.2\"/>\n      <text x=\"445\" y=\"375\" text-anchor=\"middle\" fill=\"var(--bear)\" font-size=\"12\" font-weight=\"900\">\u25bc 2. BREAKOUT BELOW!</text>\n    </g>\n\n    <g class=\"diagram-part ${sel(\"go\")}\" data-part=\"go\" ${dim(\"go\")}>\n      <circle class=\"hit\" cx=\"670\" cy=\"322\" r=\"22\"/>\n      <line x1=\"670\" y1=\"356\" x2=\"670\" y2=\"330\" stroke=\"var(--bear)\" stroke-width=\"2\" stroke-dasharray=\"3 2\"/>\n      <circle class=\"node-dot\" cx=\"670\" cy=\"322\" r=\"8.5\" fill=\"var(--bear)\" stroke=\"#fff\" stroke-width=\"2.2\"/>\n      <rect class=\"pill-bg\" x=\"575\" y=\"356\" width=\"205\" height=\"28\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--bear)\" stroke-width=\"2.2\"/>\n      <text x=\"677\" y=\"375\" text-anchor=\"middle\" fill=\"var(--bear)\" font-size=\"12\" font-weight=\"900\">\u25bc 4. DROPS DOWN!</text>\n    </g>\n  </svg>`;\n}\n\nfunction renderIllustration(lesson) {\n  const isAnim = state.illusTab === \"animated\";\n  const stepObj = lesson.animatedIllus.steps[state.animIllusStep];\n  return `<section class=\"lesson-section\" id=\"illustration\">\n    ${sectionHeading(\"03\", \"Explore the illustration\")}\n    <div class=\"card figure-card\">\n      <div class=\"illus-tabs\" role=\"tablist\" aria-label=\"Illustration mode\">\n        <button type=\"button\" class=\"illus-tab ${!isAnim ? \"active\" : \"\"}\" id=\"tabInteractive\">1. Interactive Image Illustration</button>\n        <button type=\"button\" class=\"illus-tab ${isAnim ? \"active\" : \"\"}\" id=\"tabAnimated\">2. Animated Illustration (Live Instruction)</button>\n      </div>\n      ${!isAnim ? `\n        <div class=\"figure-wrap\">${getInteractiveSVG(lesson)}</div>\n        <div class=\"figure-caption\">${esc(lesson.diagram.caption)}</div>\n        <div class=\"diagram-explanation\" id=\"diagramExplanation\"><strong>Choose a component</strong><p>Click any badge or glowing point in the illustration above to see a clear explanation.</p></div>\n      ` : `\n        <div class=\"anim-illus-grid\">\n          <div class=\"anim-illus-box\">${getInteractiveSVG(lesson, stepObj.hl)}</div>\n          <aside class=\"live-guide\" aria-live=\"polite\">\n            <div class=\"live-guide-body\">\n              <div class=\"live-guide-tag\">\u2726 LIVE INSTRUCTION \u00b7 STEP ${state.animIllusStep + 1} OF ${lesson.animatedIllus.steps.length}</div>\n              <h3>${esc(stepObj.title)}</h3>\n              <p>${esc(stepObj.text)}</p>\n              <div class=\"live-step-pills\">${lesson.animatedIllus.steps.map((_, i) => `<span class=\"live-pill ${i <= state.animIllusStep ? \"active\" : \"\"}\"></span>`).join(\"\")}</div>\n            </div>\n            <div class=\"controls\">\n              <button type=\"button\" class=\"btn\" id=\"prevIllusStep\" ${state.animIllusStep === 0 ? \"disabled\" : \"\"}>\u2190 Prev</button>\n              <button type=\"button\" class=\"btn btn-primary\" id=\"nextIllusStep\">${state.animIllusStep === lesson.animatedIllus.steps.length - 1 ? \"\u21ba Restart\" : \"Next \u2192\"}</button>\n            </div>\n          </aside>\n        </div>\n      `}\n    </div>\n  </section>`;\n}\n\nfunction renderAnimation(lesson) {\n  return `<section class=\"lesson-section\" id=\"animation\">\n    ${sectionHeading(\"04\", \"Animation \u00b7 Trading chart
